<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CELIKOM</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true"></span>
        <strong>CELIKOM</strong>
        <span class="status" data-status>Проверка…</span>
      </header>
      <div class="primary-actions" aria-label="Управление CELIKOM">
        <button class="primary" type="button" data-action="start">Старт</button>
        <button type="button" data-action="stop">Стоп</button>
      </div>
      <button class="wide" type="button" data-action="restore">Вернуть оригинал</button>
      <button class="wide" type="button" data-action="add">Добавить трек</button>
      <section class="upload-panel" data-upload-panel hidden aria-label="Добавить версию">
        <strong>Добавить версию</strong>
        <p class="stage">Только закрытый тест. Новые файлы не публикуются без ручной проверки.</p>
        <form data-upload-form>
          <label class="stage" for="upload-track">Track ID · только чтение</label>
          <input id="upload-track" data-upload-track readonly aria-readonly="true" required>
          <label class="stage" for="upload-file">MP3 · до 30 МиБ</label>
          <input id="upload-file" data-upload-file type="file" accept=".mp3,audio/mpeg" required>
          <label class="stage" for="upload-key">Код владельца для приватной загрузки</label>
          <input id="upload-key" data-upload-key type="password" autocomplete="off" spellcheck="false" placeholder="Только owner-only тест" required>
          <label class="upload-rights"><input data-upload-rights type="checkbox" required> Подтверждаю, что имею необходимые права на этот аудиофайл.</label>
          <progress data-upload-progress max="100" value="0" hidden aria-label="Загрузка"></progress>
          <button class="primary wide" data-upload-submit type="submit">Отправить на проверку</button>
          <p class="stage" role="status" aria-live="polite" data-upload-status>Загрузка закрыта для обычных пользователей.</p>
        </form>
      </section>
      <p class="track" data-track>Запустите трек в Яндекс Музыке</p>
      <details>
        <summary>Для разработчика</summary>
        <p class="stage">Stage 4 · серверный каталог. Тестовый ID включает встроенный сигнал; пустое поле включает API.</p>
        <label class="stage" for="test-track">Тестовый Track ID</label>
        <input id="test-track" data-test-track inputmode="numeric" pattern="[0-9]{1,24}" maxlength="24" placeholder="Пусто — серверный каталог">
        <button class="wide" type="button" data-action="use-current">Тестировать текущий трек</button>
        <button class="wide" type="button" data-action="clear-test">Убрать тестовую подмену</button>
        <label class="stage" for="api-access">Код доступа к тестовому серверу</label>
        <input id="api-access" data-api-access type="password" maxlength="512" autocomplete="off" placeholder="Только для закрытого теста">
        <button class="wide" type="button" data-action="save-api-access">Сохранить код</button>
        <p class="stage" data-api-note></p>
        <button class="diagnostics" type="button" data-action="diagnostics">Скопировать диагностику</button>
      </details>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
