<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CELIKOM</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true"></span>
        <strong>CELIKOM</strong>
        <span class="status" data-status>Проверка…</span>
      </header>
      <div class="primary-actions" aria-label="Управление CELIKOM">
        <button class="primary" type="button" data-action="start">Старт</button>
        <button type="button" data-action="stop">Стоп</button>
      </div>
      <button class="wide" type="button" data-action="restore">Вернуть оригинал</button>
      <button class="wide" type="button" data-action="add">Добавить трек</button>
      <p class="stage" data-coming-soon hidden>Загрузка треков появится после подключения сервера. Сейчас ничего не загружается.</p>
      <p class="track" data-track>Запустите трек в Яндекс Музыке</p>
      <details>
        <summary>Для разработчика</summary>
        <p class="stage">Stage 3 · тестовый сигнал вместо одного точного Track ID. Это ещё не библиотека песен.</p>
        <label class="stage" for="test-track">Тестовый Track ID</label>
        <input id="test-track" data-test-track inputmode="numeric" pattern="[0-9]{1,24}" maxlength="24" placeholder="Пусто — без подмены">
        <button class="wide" type="button" data-action="use-current">Тестировать текущий трек</button>
        <button class="wide" type="button" data-action="clear-test">Убрать тестовую подмену</button>
        <button class="diagnostics" type="button" data-action="diagnostics">Скопировать диагностику</button>
      </details>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
