name: CELIKOM A1 one-shot stuck CI02 BETA30 spool cancellation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-a1-recover-stalled-spool-beta30-once.yml'
permissions:
  contents: read
jobs:
  cancel-exact-stuck-delivery:
    if: github.repository == 'manufact-test/nomusic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel only exact stalled BETA30 CI02 attempt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=manufact-test/nomusic
          old_run=46070217462
          old_attempt=2
          old_sha=fca0dd41fad0fdf91a71f82e1d1751ab2f7e2f8c
          gh api "repos/$repo/actions/runs/$old_run/attempts/$old_attempt" > "$RUNNER_TEMP/old-run.json"
          jq -e --arg sha "$old_sha" --argjson attempt "$old_attempt" '
            .id == 46070217462 and .run_attempt == $attempt
            and .head_sha == $sha and .head_branch == "main"
            and (.path | startswith(".github/workflows/android-a1-owner-floki-spool.yml"))
          ' "$RUNNER_TEMP/old-run.json" >/dev/null
          status=$(jq -r .status "$RUNNER_TEMP/old-run.json")
          if [[ "$status" == completed ]]; then
            echo A1_BETA30_CI02_ALREADY_COMPLETED
            exit 0
          fi
          [[ "$status" == in_progress ]] || { echo A1_BETA30_NOT_IN_PROGRESS; exit 1; }
          gh api "repos/$repo/actions/runs/$old_run/attempts/$old_attempt/jobs?per_page=100" > "$RUNNER_TEMP/old-jobs.json"
          jq -e '
            .total_count == 1
            and (.jobs[0].name == "stage-verified-signed-apk")
            and (.jobs[0].status == "in_progress")
            and (.jobs[0].runner_name == "celikom-floki-ci02")
            and ((.jobs[0].steps | length) == 0)
          ' "$RUNNER_TEMP/old-jobs.json" >/dev/null
          gh api --method POST "repos/$repo/actions/runs/$old_run/cancel" >/dev/null
          for i in {1..6}; do
            sleep 4
            status=$(gh api "repos/$repo/actions/runs/$old_run/attempts/$old_attempt" --jq .status)
            [[ "$status" == completed ]] && break
          done
          if [[ "$status" != completed ]]; then
            gh api --method POST "repos/$repo/actions/runs/$old_run/force-cancel" >/dev/null
          fi
          echo A1_BETA30_EXACT_STALLED_CI02_CANCELLED_OR_FORCE_REQUESTED
