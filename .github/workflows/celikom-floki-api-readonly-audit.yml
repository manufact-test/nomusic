name: CELIKOM Floki API and admin read-only audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/celikom-floki-api-readonly-audit.yml'
      - '.github/scripts/celikom-floki-api-readonly-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celikom-floki-api-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe Floki health, config, admin login form and anonymous auth boundaries
        run: node .github/scripts/celikom-floki-api-readonly-audit.mjs
