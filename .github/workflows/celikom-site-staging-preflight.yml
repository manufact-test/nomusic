name: CELIKOM website staging Hostinger read-only check

on:
  push:
    branches: [feature/api-range]
    paths:
      - .github/workflows/celikom-site-staging-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celikom-website-staging
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and hosting preflight without writes
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "manufact-test/nomusic"
          test "$GITHUB_REF" = "refs/heads/feature/api-range"
          test -n "${SSH_KEY:-}" && test -n "${KNOWN_HOSTS:-}"
          umask 077
          t=$(mktemp -d)
          trap 'rm -rf "$t"' EXIT
          printf '%s\n' "$SSH_KEY" > "$t/id"
          printf '%s\n' "$KNOWN_HOSTS" > "$t/known_hosts"
          chmod 600 "$t/id" "$t/known_hosts"
          ssh -T -p 65002 -i "$t/id" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$t/known_hosts" -o ConnectTimeout=15 u235811320@92.113.19.189 'bash -se' <<'REMOTE'
          set -euo pipefail
          root=/home/u235811320/domains/lemonchiffon-narwhal-791953.hostingersite.com
          printf 'domain_root_present=%s\n' "$(test -d "$root" && echo yes || echo no)"
          printf 'public_html_present=%s\n' "$(test -d "$root/public_html" && echo yes || echo no)"
          printf 'public_html_entries='
          if test -d "$root/public_html"; then
            find "$root/public_html" -mindepth 1 -maxdepth 1 -printf '%f ' | head -c 800
          fi
          printf '\n'
          printf 'private_dir_present=%s\n' "$(test -e "$root/celikom-private" && echo yes || echo no)"
          printf 'ssh_php='
          command -v php || true
          printf 'php83_binary=%s\n' "$(test -x /opt/alt/php83/usr/bin/php && echo yes || echo no)"
          if test -x /opt/alt/php83/usr/bin/php; then
            /opt/alt/php83/usr/bin/php -r 'echo "php_version=",PHP_VERSION,";pdo_mysql=",(extension_loaded("pdo_mysql")?"yes":"no"),";fileinfo=",(extension_loaded("fileinfo")?"yes":"no"),PHP_EOL;'
          fi
          printf 'mysql_cli='
          command -v mysql || true
          printf 'staging_htaccess=%s\n' "$(test -f "$root/public_html/.htaccess" && echo exists || echo none)"
          REMOTE
      - name: Check intended domain HTTPS without bypassing certificate validation
        shell: bash
        run: |
          curl -sSIL --connect-timeout 10 --max-time 20 -o /dev/null \
            -w 'domain_http_status=%{http_code}\ncert_verify=%{ssl_verify_result}\n' \
            https://lemonchiffon-narwhal-791953.hostingersite.com/ || true
