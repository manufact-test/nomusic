name: CELIKOM A1 own package 2025 native parallel LSPatch2 issuer evidence ARM13
on:
  push:
    branches: [experiment/android-a1-2025-lv2-own-package-parallel-20261112]
    paths:
      - 'android/native-yandex-hooklab/ci/owner_2025_lspatch_lv2_parallel_native_arm13.py'
      - 'android/native-yandex-hooklab/ci/owner_2025_gpr_lab_clone_no_bypass_arm13.py'
      - '.github/workflows/android-a1-2025-lv2-own-package-parallel-arm13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  owned-clone-and-publisher-standalone-coexist:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 52
    env:
      CELIKOM_CLEAN_ANDROID_NATIVE_REDDROID: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate only own diagnostic, no package download before syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile android/native-yandex-hooklab/ci/owner_2025_lspatch_lv2_parallel_native_arm13.py
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_owner_2025_paired_signing_verdict.py -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_lspatch_loader_zero.py -v
      - name: Reuse ORIGINAL publisher-signed 2025.10.4 16-split XAPK privately from existing unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = manufact-test/nomusic ]
          [ "$GITHUB_REF_NAME" = experiment/android-a1-2025-lv2-own-package-parallel-20261112 ]
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/celikom-publisherbase-2025-only"
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" --pattern yandex-music-2025-10-4-120-1gpr.xapk --dir "$RUNNER_TEMP/celikom-publisherbase-2025-only" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-publisherbase-2025-only/yandex-music-2025-10-4-120-1gpr.xapk"
          [ "$(stat -c %s "$f")" = 45961661 ]
          [ "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053 ]
      - name: Download and pin independent public APKEditor 1.4.9 from GitHub release via CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/celikom-apkeditor-pinned"
          gh release download V1.4.9 --repo REAndroid/APKEditor --pattern APKEditor-1.4.9.jar --dir "$RUNNER_TEMP/celikom-apkeditor-pinned" --clobber >/dev/null
          jar="$RUNNER_TEMP/celikom-apkeditor-pinned/APKEditor-1.4.9.jar"
          [ "$(stat -c %s "$jar")" = 7733037 ]
          [ "$(sha256sum "$jar" | cut -d' ' -f1)" = a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67 ]
          echo "CELIKOM_A1_PINNED_APKEDITOR_JAR=$jar" >> "$GITHUB_ENV"
      - name: Set up build tools in sealed disposable ARM runner
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 120 apt-get update -qq
          sudo timeout 120 env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner zipalign unzip
          sdk="$RUNNER_TEMP/celikom-publisherbase-sdk"
          mkdir -p "$sdk/build-tools/35.0.0"
          for tool in aapt apksigner zipalign; do
            ln -s "$(command -v "$tool")" "$sdk/build-tools/35.0.0/$tool"
          done
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Boot actual ARM64 plus ARMv7 Android 13 isolated guest
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          bash android/native-yandex-hooklab/ci/native_arm_redroid_boot_only.sh
          [ "$(docker exec celikom-native-arm-android13 getprop sys.boot_completed)" = 1 ]
      - name: Real ARM13 install own-namespaced 2025 clone built with LSPatch2 and genuine issuer metadata, then untouched original
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/owner_2025_lspatch_lv2_parallel_native_arm13.py --xapk "$RUNNER_TEMP/celikom-publisherbase-2025-only/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Always destroy private original XAPK, own signed outputs, signer keys and Android guest
        if: always()
        shell: bash
        run: |
          docker stop celikom-native-arm-android13 >/dev/null 2>&1 || true
          sudo umount /dev/binderfs >/dev/null 2>&1 || true
          sudo modprobe -r binder_linux >/dev/null 2>&1 || true
          sudo rm -rf -- "$RUNNER_TEMP/celikom-redroid-data"
          rm -rf -- "$RUNNER_TEMP/celikom-publisherbase-2025-only" "$RUNNER_TEMP/celikom-publisherbase-sdk" "$RUNNER_TEMP/celikom-apkeditor-pinned"
          echo '{"publisher_binary_redistributed":false,"private_signer_exported":false,"owner_phone_touched":false,"stage_a":"NO_GO"}'
