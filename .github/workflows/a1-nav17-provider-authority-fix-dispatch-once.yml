name: CELIKOM A1 one-time NAV17 Passport-provider fix owner APK dispatch
on:
  push:
    branches:
      - experiment/android-a1-metrica-init-state-observer-arm13-20261112
    paths:
      - .github/a1-nav17-provider-authority-fix.once
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing fully gated owner-signed diagnostic/fix APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: experiment/android-a1-metrica-init-state-observer-arm13-20261112
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run android-a1-metrica-init-state-observer-arm13.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" \
            -f export_diagnostic_apk=true \
            -f authorize_fresh_clone_install=true
          echo "A1_NAV17_PASSPORT_PROVIDER_FIX_DISPATCH_ACCEPTED"
      - name: Remove only this one-time helper and marker
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: experiment/android-a1-metrica-init-state-observer-arm13-20261112
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/a1-nav17-provider-authority-fix-dispatch-once.yml \
            .github/a1-nav17-provider-authority-fix.once; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$TARGET_BRANCH" --jq .sha)"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="chore(android-a1): remove one-time NAV17 signed APK dispatch helper" \
              -f sha="$sha" \
              -f branch="$TARGET_BRANCH" >/dev/null
          done
          echo "A1_NAV17_PASSPORT_PROVIDER_FIX_HELPERS_REMOVED"
