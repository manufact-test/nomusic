name: CELIKOM W54 live 403 access-log presence READ ONLY

on:
  push:
    branches:
      - experiment/windows-companion-integration-20261108
    paths:
      - .github/workflows/windows-w54-live-403-logs-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fingerprinted SSH metadata-only log census; NO server writes, no secrets in output
        shell: bash
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_SSH_KEY"
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$scratch/key"
          ssh-keygen -y -P '' -f "$scratch/key" > "$scratch/public"
          test "$(ssh-keygen -lf "$scratch/public" | awk '{print $2}')" = 'SHA256:Q6FyifXRq6garceQdIIjBmXhkk81Ic1p/x9JTSYHWUk'
          printf '%s\n' '[92.113.19.189]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAf8M2EVwq0oJI8I9KZ0NFE8P8yDOvDATEhkQti/Kk/0' > "$scratch/known_hosts"
          ssh -T -p 65002 -i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             -o "UserKnownHostsFile=$scratch/known_hosts" -o GlobalKnownHostsFile=/dev/null             -o ConnectTimeout=15 u235811320@92.113.19.189 "bash -s" <<'REMOTE'
          set -euo pipefail
          home=/home/u235811320
          domain=darkred-camel-588676.hostingersite.com
          dirs=()
          for dir in "$home/logs" "$home/domains/$domain/logs" "$home/domains/$domain"; do
            if [[ -d "$dir" ]]; then dirs+=("$dir"); fi
          done
          printf 'W54_EXISTING_SEARCH_ROOTS=%d\n' "${#dirs[@]}"
          if (( ${#dirs[@]} == 0 )); then
            echo W54_LOGS_NOT_ACCESSIBLE
            exit 0
          fi
          # Search only probable access/error log names modified within 3 days.
          # Never echo paths, IP addresses, request lines, query strings, headers
          # or secrets. No write/copy/chmod/deploy to the hosting environment.
          # Metadata only: count candidate paths, do not print any filename.
          # Some Hostinger directories are unreadable by the SSH account;
          # their errors must not abort a read-only census.
          count="$( (find "${dirs[@]}" -maxdepth 6 -type f \
            \( -iname '*access*log*' -o -iname '*request*log*' -o -iname '*error*log*' \) \
            -mtime -3 -size -32M -print0 2>/dev/null || true) | tr -cd '\000' | wc -c)"
          count="$(printf '%s' "$count" | tr -dc '0-9')"
          printf 'W54_RECENT_LOG_CANDIDATES=%s\n' "${count:-0}"
          echo W54_NO_PRODUCTION_WRITES_NO_URL_OR_TOKEN_EXPORT
          REMOTE
