name: CELIKOM W56 0.24.6 to 0.24.7 one-app DPAPI upgrade proof

on:
  push:
    branches:
      - experiment/windows-companion-integration-20261108
    paths:
      - .github/workflows/windows-w56-owner-inplace-upgrade-proof.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  existing-owner-inplace-upgrade:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Retrieve exact previous owner 0.24.6 internal installer
        uses: actions/download-artifact@v4
        with:
          name: CELIKOM-W50-NATIVE-NET-UNSIGNED
          run-id: 42781645724
          repository: manufact-test/nomusic
          github-token: ${{ github.token }}
          path: old
      - name: Retrieve exact W56 stage-only 0.24.7 candidate
        uses: actions/download-artifact@v4
        with:
          name: CELIKOM-W56-SIGNED-QUERY-GUARD-UNSIGNED
          run-id: 42796898660
          repository: manufact-test/nomusic
          github-token: ${{ github.token }}
          path: new
      - name: Verify one AppId, real same-user DPAPI encryption, native source and Yandex untouched
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $oldSetup=(Resolve-Path 'old/CELIKOM-W50-NATIVE-NET-UNSIGNED.exe').Path
          $newSetup=(Resolve-Path 'new/CELIKOM-W56-SIGNED-QUERY-GUARD-UNSIGNED.exe').Path
          $program=Join-Path $env:LOCALAPPDATA 'Programs\CELIKOM'
          $exe=Join-Path $program 'CELIKOM.Companion.exe'
          $uninstaller=Join-Path $program 'unins000.exe'
          $yandex=Join-Path $env:LOCALAPPDATA 'Programs\YandexMusic'
          $state=Join-Path $env:LOCALAPPDATA 'CELIKOM\Windows'
          $session=Join-Path $state 'session.dpapi'
          if ((Test-Path $program) -or (Test-Path $yandex)) { throw 'W56_DIRTY_RUNNER' }
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($oldSetup).FileVersion.Trim() -ne '0.24.6.0') {
            throw 'W56_BAD_OLD_INSTALLER'
          }
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($newSetup).FileVersion.Trim() -ne '0.24.7.0') {
            throw 'W56_BAD_NEW_INSTALLER'
          }
          $old=Start-Process $oldSetup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($old.ExitCode -ne 0 -or -not (Test-Path $exe)) { throw 'W56_0246_INSTALL_FAILED' }
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion.Trim() -ne '0.24.6.0') {
            throw 'W56_OLD_EXE_VERSION_MISMATCH'
          }
          New-Item -ItemType Directory $state -Force | Out-Null
          $marker='W56_SAME_USER_DPAPI_OWNER_AUTH_PRESERVATION'
          $plain=[Text.Encoding]::UTF8.GetBytes($marker)
          $scope=[Security.Cryptography.DataProtectionScope]::CurrentUser
          $sealed=[Security.Cryptography.ProtectedData]::Protect($plain,$null,$scope)
          [IO.File]::WriteAllBytes($session,$sealed)
          $before=(Get-FileHash $session -Algorithm SHA256).Hash
          $appUpgrade=Start-Process $newSetup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($appUpgrade.ExitCode -ne 0 -or -not (Test-Path $exe)) { throw 'W56_0247_UPGRADE_FAILED' }
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion.Trim() -ne '0.24.7.0') {
            throw 'W56_0247_ACTUAL_EXE_VERSION_WRONG'
          }
          if ((Get-FileHash $session -Algorithm SHA256).Hash -ne $before) {
            throw 'W56_SESSION_ENCRYPTED_BYTES_MODIFIED'
          }
          $unsealed=[Security.Cryptography.ProtectedData]::Unprotect(
            [IO.File]::ReadAllBytes($session),$null,$scope)
          if ([Text.Encoding]::UTF8.GetString($unsealed) -ne $marker) {
            throw 'W56_OWNER_DPAPI_NOT_DECRYPTABLE_AFTER_UPDATE'
          }
          if (-not (Test-Path $uninstaller) -or (Test-Path (Join-Path $program 'unins001.exe'))) {
            throw 'W56_DUPLICATE_APPLICATION_OR_UNINSTALLER'
          }
          $hostFile=Join-Path $program 'integration\host.cjs'
          $renderer=Join-Path $program 'integration\renderer.js'
          if (-not (Test-Path $hostFile) -or -not (Test-Path $renderer)) {
            throw 'W56_NATIVE_MODULE_NOT_UPDATED'
          }
          $host=[IO.File]::ReadAllText($hostFile)
          $rendererText=[IO.File]::ReadAllText($renderer)
          if (-not $host.Contains('const CELIKOM_NATIVE_VERSION = "0.24.7"') -or
              -not $host.Contains('PLAYER_URL_SIGNED_FIELDS_INTACT') -or
              -not $rendererText.Contains('celikom_native_query_guard')) {
            throw 'W56_NATIVE_SIGNED_URL_FIX_ABSENT_AFTER_UPGRADE'
          }
          if (Test-Path $yandex) { throw 'W56_UPGRADE_MODIFIED_YANDEX' }
          Write-Output 'W56_0246_TO_0247_ONE_APPLICATION_UPGRADE_PASS'
          Write-Output 'W56_GENUINE_SAME_USER_DPAPI_PROTECTED_BYTES_PRESERVED_PASS'
          Write-Output 'W56_NATIVE_GUARD_AND_HOST_0247_PRESENT_PASS'
          Write-Output 'W56_NO_VENDOR_FILES_TOUCHED_PASS'
          $removed=Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw 'W56_UNINSTALL_FAILED' }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw 'W56_UNINSTALL_LEFT_APP' }
          if ((Get-FileHash $session -Algorithm SHA256).Hash -ne $before -or
              (Test-Path $yandex)) { throw 'W56_UNINSTALL_OWNER_DATA_OR_VENDOR_CHANGED' }
          Write-Output 'W56_UNINSTALL_PRESERVES_DPAPI_AND_YANDEX_PASS'
      - name: Output only outcome categories, never real owner sessions or signing keys
        run: echo W56_CI_ONLY_UNSIGNED_CANDIDATE_OWNER_AUDIO_NOT_YET_ACCEPTED
