name: CELIKOM Blur — 27 source-gap MP3 independent technical audit READ ONLY
on:
  push:
    branches: [feature/blur-batch1000-20261108]
    paths: ['.github/workflows/blur-oldgap27-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare original Git blob + MIME + MP3 inspector in ephemeral CI
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe || { sudo apt-get update -qq; sudo apt-get install -y ffmpeg; }
          python3 -m py_compile tools/blur-research/legacy-gaps-27-audio.py
          python3 tools/blur-research/legacy-gaps-27-audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celikom-oldgap27-${{ github.run_id }}
          path: oldgap27-report.json
          retention-days: 90
          if-no-files-found: ignore
