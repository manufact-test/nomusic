name: Windows Companion — read-only probe

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/windows-companion-integration-20261108
    paths:
      - windows-companion/**
      - .github/workflows/windows-companion-readonly.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build with warnings as errors
        run: dotnet build windows-companion/Celikom.Core.Tests/Celikom.Core.Tests.csproj -c Release
      - name: Run isolated safety checks
        run: dotnet run --project windows-companion/Celikom.Core.Tests/Celikom.Core.Tests.csproj -c Release --no-build
      - name: Publish read-only Windows executable
        run: dotnet publish windows-companion/Celikom.Probe/Celikom.Probe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o ./windows-companion/out
      - name: Artifact (test only, no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: celikom-windows-readonly-probe
          path: windows-companion/out/CELIKOM-Windows-Probe.exe
          if-no-files-found: error
          retention-days: 7
