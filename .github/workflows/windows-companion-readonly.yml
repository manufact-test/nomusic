name: Windows Companion — W15 Native Preview + SDK add-on

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/windows-companion-integration-20261108
    paths:
      - windows-companion/**
      - .github/workflows/windows-companion-readonly.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Setup Node 22 for W4 isolated contract
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: W14 PulseSync candidate source adapter contract (NO official runtime)
        run: node --test windows-companion/w14/source-controller.test.mjs
      - name: Install candidate PulseSync add-on SDK in CI only
        working-directory: windows-companion/w14/addon
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build REAL PulseSync add-on SDK candidate (disabled, no host execution)
        working-directory: windows-companion/w14/addon
        run: npm run build
      - name: Setup .NET 10 for real W15 Companion build
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build W15 Windows Companion UI + account and loopback bridge
        run: dotnet build windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj -c Release -warnaserror
      - name: W15 signed URL, Stop/Next and localhost pairing contracts
        run: node --test windows-companion/w15/w15-contract.test.mjs
      - name: Install W15 PulseSync SDK in isolated CI only
        working-directory: windows-companion/w15/addon
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Compile W15 CELIKOM add-on through the real PulseSync SDK
        working-directory: windows-companion/w15/addon
        run: npm run build
      - name: W12 fail-closed official-launch policy (synthetic only)
        run: node --test windows-companion/w12/official-launch-gate.test.mjs
      - name: W11 private pipe target and CDP framing policy
        run: node --test windows-companion/w11/pipe-protocol.test.mjs
      - name: W8 one-decoder fallback and async Next fencing contract
        run: node --test windows-companion/w8/native-original-recovery.test.mjs
      - name: W7 reject any non-fixture debug target
        run: node --test windows-companion/w7/session-policy.test.mjs
      - name: W6 strict identity gate and crash-safe synthetic rollback
        run: node --test windows-companion/w6/rollback-fixture.test.mjs
      - name: W4 exact-ID native resource adapter contract (synthetic, no Yandex app)
        run: node --test windows-companion/bridge/w4-source-resource-adapter.test.mjs
      - name: Install W5 isolated Electron and MP3 fixture dependencies
        working-directory: windows-companion/w5
        run: npm install --no-audit --no-fund --no-package-lock
      - name: W9 real generated ASAR integrity, fail-closed copy and crash recovery tests
        run: node --test windows-companion/w9/asar-copy-lab.test.mjs
      - name: W9 genuine Electron boots original, isolated modified copy and byte-restored original
        working-directory: windows-companion/w5
        run: npm run w9
      - name: Prepare hash-pinned public Yandex source classes (test-only)
        working-directory: windows-companion/w5
        run: node prepare-fixture.mjs out
      - name: W5 genuine Yandex public resource classes inside isolated Electron
        working-directory: windows-companion/w5
        run: npm run e2e
      - name: W7 external sidecar attach inside disposable local Electron (not official Yandex)
        working-directory: windows-companion/w5
        run: npm run w7
      - name: W12 genuine generic Electron single-instance collision with isolated temp profiles
        working-directory: windows-companion/w5
        run: npm run w12
      - name: W11 external private pipe to disposable synthetic Electron, W4-W8 live media regression
        working-directory: windows-companion/w5
        run: npm run w11
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build with warnings as errors
        run: dotnet build windows-companion/Celikom.Core.Tests/Celikom.Core.Tests.csproj -c Release
      - name: Run isolated safety checks
        run: dotnet run --project windows-companion/Celikom.Core.Tests/Celikom.Core.Tests.csproj -c Release --no-build
      - name: Publish read-only Windows executable
        run: dotnet publish windows-companion/Celikom.Probe/Celikom.Probe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o ./windows-companion/out
      - name: Add one-click report launcher
        shell: pwsh
        run: Copy-Item windows-companion/START-CELIKOM-PROBE.cmd windows-companion/out/START-CELIKOM-PROBE.cmd
      - name: Publish standalone W15 CELIKOM Companion for isolated PREVIEW (no Yandex modification)
        run: dotnet publish windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o windows-companion/w15/publish
      - name: "Assemble W15 preview ZIP: EXE + PulseSync add-on only"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'windows-companion/w15'
          $pack = Join-Path $base 'bundle'
          New-Item -ItemType Directory -Path $pack -Force | Out-Null
          Copy-Item -Path (Join-Path $base 'publish/CELIKOM.Companion.exe') -Destination $pack
          Copy-Item -Path (Join-Path $base 'PREVIEW-README.txt') -Destination $pack
          Copy-Item -Path (Join-Path $base 'addon/dist') -Destination (Join-Path $pack 'addon') -Recurse -Force
          $exe = Join-Path $pack 'CELIKOM.Companion.exe'
          if (-not (Test-Path $exe) -or (Get-Item $exe).Length -lt 500000) { throw 'W15_EXE_MISSING' }
          $addon = Get-ChildItem -Path (Join-Path $pack 'addon') -Filter script.js -Recurse
          if ($addon.Count -ne 1 -or $addon[0].Length -lt 1000) { throw 'W15_ADDON_MISSING' }
          (Get-FileHash $exe -Algorithm SHA256).Hash | Out-File (Join-Path $pack 'EXE-SHA256.txt') -Encoding ascii
          (Get-FileHash $addon[0].FullName -Algorithm SHA256).Hash | Out-File (Join-Path $pack 'ADDON-SHA256.txt') -Encoding ascii
          Compress-Archive -Path (Join-Path $pack '*') -DestinationPath (Join-Path $base 'CELIKOM-Windows-W15-PREVIEW.zip') -CompressionLevel Optimal -Force
      - name: Upload W15 test preview artifact (not public release)
        uses: actions/upload-artifact@v4
        with:
          name: CELIKOM-Windows-W15-PREVIEW
          path: windows-companion/w15/CELIKOM-Windows-W15-PREVIEW.zip
          if-no-files-found: error
          retention-days: 14
      - name: Artifact (test only, no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: celikom-windows-w10-integrity-readonly
          path: |
            windows-companion/out/CELIKOM-Windows-Probe.exe
            windows-companion/out/START-CELIKOM-PROBE.cmd
          if-no-files-found: error
          retention-days: 7
