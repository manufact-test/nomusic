name: CELIKOM A1 clone-alone differential ARM13 not product acceptance
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - 'android/native-yandex-hooklab/ci/owner_2025_lspatch2_namespaced_clone_arm13.py'
      - 'android/native-yandex-hooklab/clone_main_crash_buffer.py'
      - 'android/native-yandex-hooklab/ci/test_metrica_manifest_preserved_detail_control.py'
      - 'android/native-yandex-hooklab/ci/a1_metrica_witness_private_parser.py'
      - 'android/native-yandex-hooklab/ci/owner_2025_lspatch2_namespaced_clone_arm13.py'
      - 'android/native-yandex-hooklab/ci/a1_metrica_service_snapshot.py'
      - 'android/native-yandex-hooklab/ci/test_a1_metrica_service_snapshot.py'
      - 'android/native-yandex-hooklab/ci/test_a1_metrica_witness_private_parser.py'
      - 'android/native-yandex-hooklab/ci/owner_2025_lspatch2_resigned_native_arm13.py'
      - 'android/native-yandex-hooklab/exit-callsite-witness-module/**'
      - 'android/native-yandex-hooklab/ci/test_native_clone_java_rootcause_triage.py'
      - '.github/workflows/android-a1-clone-alone-differential-arm13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-2025-own-lspatch2-disposable-native-arm13:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 80
    env:
      CELIKOM_CLEAN_ANDROID_NATIVE_REDDROID: '1'
      CELIKOM_A1_CLONE_ONLY_CONTROL: '1'
      CELIKOM_A1_RESOURCE_NAMESPACE_TRIAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Prepare Android 35 platform and native ARM aapt2 for own module only
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          mkdir -p "$RUNNER_TEMP/celikom-native-aapt2"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            https://github.com/Commit451/android-arm-build-tools/releases/download/platform-tools-35.0.1/aapt2 \
            --output "$RUNNER_TEMP/celikom-native-aapt2/aapt2"
          echo "c57d02d2986d7d68147d74525ad8a5fbb105f12723b33f1ce9eab12acd238cf0  $RUNNER_TEMP/celikom-native-aapt2/aapt2" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/celikom-native-aapt2/aapt2"
          "$RUNNER_TEMP/celikom-native-aapt2/aapt2" version
          mkdir -p "$HOME/.gradle"
          echo "android.aapt2FromMavenOverride=$RUNNER_TEMP/celikom-native-aapt2/aapt2" >> "$HOME/.gradle/gradle.properties"
      - name: Build scoped module privately without uploading binary artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = experiment/android-a1-metrica-init-state-observer-arm13-20261112
          test "$(cat android/native-yandex-hooklab/exit-callsite-witness-module/app/src/main/resources/META-INF/xposed/scope.list)" = pro.celikom.yandex.nativeclonelab
          gradle -p android/native-yandex-hooklab/exit-callsite-witness-module :app:assembleDebug --no-daemon
          mkdir -p "$RUNNER_TEMP/celikom-own-metrica-module"
          cp android/native-yandex-hooklab/exit-callsite-witness-module/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/celikom-own-metrica-module/app-debug.apk"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check exact isolated CI and own research code before any vendor input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = manufact-test/nomusic
          test "$GITHUB_REF_NAME" = experiment/android-a1-metrica-init-state-observer-arm13-20261112
          python3 -B -m py_compile android/native-yandex-hooklab/ci/owner_2025_lspatch2_namespaced_clone_arm13.py
          python3 -B -m py_compile android/native-yandex-hooklab/ci/owner_2025_lspatch2_resigned_native_arm13.py
          python3 -B -m py_compile android/native-yandex-hooklab/clone_lspatch_loader_zero.py android/native-yandex-hooklab/merge_lab_splits_ephemeral.py android/native-yandex-hooklab/clone_main_crash_buffer.py
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_metrica_manifest_preserved_detail_control.py -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_a1_metrica_witness_private_parser.py -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_a1_private_2025_audio_entrypoints.py -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_a1_metrica_service_snapshot.py -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_a1_private_push_dex_method.py -v
          python3 -B -m py_compile android/native-yandex-hooklab/ci/a1_private_push_dex_method.py
          python3 -B -m py_compile android/native-yandex-hooklab/ci/a1_metrica_witness_private_parser.py
          python3 -B -m py_compile android/native-yandex-hooklab/ci/a1_resource_package_rename.py
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_a1_resource_package_rename.py -v
          python3 -B -m py_compile android/a1-permission-catch-sourcecheck/permission_catch.py
          python3 -B -m unittest discover -s android/a1-permission-catch-sourcecheck -p test_permission_catch.py -v
          test -s "$RUNNER_TEMP/celikom-own-metrica-module/app-debug.apk"
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_native_clone_java_rootcause_triage.py -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_main_crash_buffer.py -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_lspatch_loader_zero.py -v
      - name: Verify and privately reuse user-uploaded issuer signed 2025 XAPK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/celikom-lspatch2-private"
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" --pattern yandex-music-2025-10-4-120-1gpr.xapk --dir "$RUNNER_TEMP/celikom-lspatch2-private" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-lspatch2-private/yandex-music-2025-10-4-120-1gpr.xapk"
          test "$(stat -c %s "$f")" = 45961661
          test "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053
      - name: Private offline exact 2025 XAPK DEX method classifier (no code disclosure)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/a1_private_push_dex_method.py --xapk "$RUNNER_TEMP/celikom-lspatch2-private/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Generate exact private Push targets and rebuild own read-only observer
        shell: bash
        run: |
          set -euo pipefail
          target="android/native-yandex-hooklab/exit-callsite-witness-module/app/src/main/java/pro/celikom/a1exitwitness/PrivatePushTargets.java"
          test ! -e "$target"
          python3 -B android/native-yandex-hooklab/ci/a1_private_push_dex_method.py --xapk "$RUNNER_TEMP/celikom-lspatch2-private/yandex-music-2025-10-4-120-1gpr.xapk" --private-java "$target"
          test -s "$target"
          provider_target="android/native-yandex-hooklab/exit-callsite-witness-module/app/src/main/java/pro/celikom/a1exitwitness/PrivatePostTrueProviderTarget.java"
          test ! -e "$provider_target"
          python3 -B android/a1-permission-catch-sourcecheck/permission_catch.py --xapk "$RUNNER_TEMP/celikom-lspatch2-private/yandex-music-2025-10-4-120-1gpr.xapk" --provider-java "$provider_target"
          test -s "$provider_target"
          gradle -p android/native-yandex-hooklab/exit-callsite-witness-module :app:assembleDebug --no-daemon
          cp android/native-yandex-hooklab/exit-callsite-witness-module/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/celikom-own-metrica-module/app-debug.apk"
      - name: Generate exact owned 2025 MediaDataSource read-only targets; private CI only
        shell: bash
        run: |
          set -euo pipefail
          media_target="android/native-yandex-hooklab/exit-callsite-witness-module/app/src/main/java/pro/celikom/a1exitwitness/PrivateMediaDataSourceTargets.java"
          test ! -e "$media_target"
          python3 -B android/native-yandex-hooklab/ci/a1_private_2025_audio_entrypoints.py \
            --xapk "$RUNNER_TEMP/celikom-lspatch2-private/yandex-music-2025-10-4-120-1gpr.xapk" \
            --private-java "$media_target"
          test -s "$media_target"
          gradle -p android/native-yandex-hooklab/exit-callsite-witness-module :app:assembleDebug --no-daemon
          cp android/native-yandex-hooklab/exit-callsite-witness-module/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/celikom-own-metrica-module/app-debug.apk"
      - name: Prepare exact separate own signature and test-only native tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 120 apt-get update -qq
          sudo timeout 120 env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner zipalign
          sdk="$RUNNER_TEMP/celikom-2025-lspatch2-sdk"
          mkdir -p "$sdk/build-tools/35.0.0"
          for tool in aapt apksigner zipalign; do
            ln -sf "$(command -v "$tool")" "$sdk/build-tools/35.0.0/$tool"
          done
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Boot fresh native ARM64 plus ARMv7 Android13 guest
        timeout-minutes: 16
        shell: bash
        run: bash android/native-yandex-hooklab/ci/native_arm_redroid_boot_only.sh
      - name: No-suppression fresh Android13 standalone clone only 75s differential
        timeout-minutes: 42
        shell: bash
        env:
          CELIKOM_A1_METRICA_OWN_MODULE_PATH: ${{ runner.temp }}/celikom-own-metrica-module/app-debug.apk
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/owner_2025_lspatch2_namespaced_clone_arm13.py --xapk "$RUNNER_TEMP/celikom-lspatch2-private/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Remove all original/clone private files, signing keys and native guest
        if: always()
        shell: bash
        run: |
          docker stop celikom-native-arm-android13 >/dev/null 2>&1 || true
          sudo umount /dev/binderfs >/dev/null 2>&1 || true
          sudo modprobe -r binder_linux >/dev/null 2>&1 || true
          sudo rm -rf -- "$RUNNER_TEMP/celikom-redroid-data"
          rm -rf -- "$RUNNER_TEMP/celikom-lspatch2-private" "$RUNNER_TEMP/celikom-2025-lspatch2-sdk" "$RUNNER_TEMP/celikom-own-metrica-module" "$RUNNER_TEMP/celikom-native-aapt2"
          rm -f -- android/native-yandex-hooklab/exit-callsite-witness-module/app/src/main/java/pro/celikom/a1exitwitness/PrivatePushTargets.java
          rm -f -- android/native-yandex-hooklab/exit-callsite-witness-module/app/src/main/java/pro/celikom/a1exitwitness/PrivatePostTrueProviderTarget.java
          rm -f -- android/native-yandex-hooklab/exit-callsite-witness-module/app/src/main/java/pro/celikom/a1exitwitness/PrivateMediaDataSourceTargets.java
          echo '{"publisher_source_published":false,"own_lab_apk_published":false,"owner_handset_touched":false,"acoustic_product_proven":false}'
