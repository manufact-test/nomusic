name: CELIKOM A1 public MediaBrowserService live native Android13 IPC witness (NO source swap)
on:
  push:
    branches: [experiment/android-a1-2025-native-bridge-manifest-witness-20261112]
    paths:
      - '.github/workflows/android-a1-2025-real-public-browser-native-arm13.yml'
      - 'android/native-yandex-hooklab/owned-public-browser-probe/**'
      - 'android/native-yandex-hooklab/ci/owner_2025_real_public_browser_ipc_arm13.py'
permissions:
  contents: write
jobs:
  build-owned-unprivileged-browser-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile only independent CELIKOM read-only MediaBrowser client (no third-party code)
        run: gradle -p android/native-yandex-hooklab/owned-public-browser-probe :app:assembleDebug --no-daemon
      - name: Retain only OWN diagnostic APK between isolated CI runners (not user release)
        uses: actions/upload-artifact@v4
        with:
          name: CELIKOM-A1-OWN-READONLY-PUBLIC-BROWSER-EPHEMERAL
          path: android/native-yandex-hooklab/owned-public-browser-probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error
  verify-native-publisher-plus-independent-public-browser:
    needs: build-owned-unprivileged-browser-client
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CELIKOM_CLEAN_ANDROID_NATIVE_REDDROID: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CELIKOM-A1-OWN-READONLY-PUBLIC-BROWSER-EPHEMERAL
          path: ${{ runner.temp }}/celikom-owned-public-browser-apk
      - name: Set up Android signature and manifest verification tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 130 apt-get update -qq
          sudo timeout 120 env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner unzip
          python3 -B -m py_compile android/native-yandex-hooklab/ci/owner_2025_real_public_browser_ipc_arm13.py
          test -f "$RUNNER_TEMP/celikom-owned-public-browser-apk/app-debug.apk"
      - name: Reuse existing original exact unpublished 2025 GPR draft privately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = manufact-test/nomusic ]
          [ "$GITHUB_REF_NAME" = experiment/android-a1-2025-native-bridge-manifest-witness-20261112 ]
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/celikom-owned-public-browser-apk/source"
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" --pattern yandex-music-2025-10-4-120-1gpr.xapk --dir "$RUNNER_TEMP/celikom-owned-public-browser-apk/source" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-owned-public-browser-apk/source/yandex-music-2025-10-4-120-1gpr.xapk"
          [ "$(stat -c %s "$f")" = 45961661 ]
          [ "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053 ]
      - name: Boot genuine native ARM64 plus ARMv7 Android13 isolated guest
        timeout-minutes: 16
        shell: bash
        run: bash android/native-yandex-hooklab/ci/native_arm_redroid_boot_only.sh
      - name: Install immutable original, start actual native UI, connect OWN client to public MediaBrowserService only
        timeout-minutes: 13
        shell: bash
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/owner_2025_real_public_browser_ipc_arm13.py \
            --xapk "$RUNNER_TEMP/celikom-owned-public-browser-apk/source/yandex-music-2025-10-4-120-1gpr.xapk" \
            --own "$RUNNER_TEMP/celikom-owned-public-browser-apk/app-debug.apk"
      - name: Erase the full Android guest, original bytes and own probe (no releases)
        if: always()
        shell: bash
        run: |
          docker stop celikom-native-arm-android13 >/dev/null 2>&1 || true
          sudo umount /dev/binderfs >/dev/null 2>&1 || true
          sudo modprobe -r binder_linux >/dev/null 2>&1 || true
          sudo rm -rf -- "$RUNNER_TEMP/celikom-redroid-data"
          rm -rf -- "$RUNNER_TEMP/celikom-owned-public-browser-apk"
          echo '{"vendor_apks_distributed":false,"owned_probe_user_released":false,"owner_phone_touched":false,"native_audio_swap_proven":false,"stage_a":"NO_GO"}'
