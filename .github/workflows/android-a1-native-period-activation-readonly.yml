name: CELIKOM A1 exact Lo96 native period activation callers (READ ONLY)
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - 'android/native-yandex-hooklab/ci/native_period_activation_handoff_exact.py'
      - 'android/native-yandex-hooklab/ci/test_native_period_activation_handoff_exact.py'
      - 'android/native-yandex-hooklab/ci/a1_exact_datasource_loadable_owner.py'
      - 'android/native-yandex-hooklab/ci/test_a1_exact_datasource_loadable_owner.py'
      - '.github/workflows/android-a1-native-period-activation-readonly.yml'
  workflow_dispatch:
permissions:
  # Private draft release inspection requires the same access as the verified LfT2 workflow.
  contents: write
jobs:
  direct-media-source-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only pinned signed APK metadata tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner
      - name: Validate bounded direct-source parser and fail-closed fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile android/native-yandex-hooklab/ci/native_period_activation_handoff_exact.py
          python3 -B -m py_compile android/native-yandex-hooklab/ci/a1_exact_datasource_loadable_owner.py
          PYTHONPATH=android/native-yandex-hooklab/ci:android/native-yandex-hooklab \
            python3 -B -m unittest discover \
              -s android/native-yandex-hooklab/ci \
              -p 'test_native_period_activation_handoff_exact.py' -v
          PYTHONPATH=android/native-yandex-hooklab/ci:android/native-yandex-hooklab \
            python3 -B -m unittest discover \
              -s android/native-yandex-hooklab/ci \
              -p 'test_a1_exact_datasource_loadable_owner.py' -v
      - name: Download exact private signed 2025 Yandex research input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' \
            | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/celikom-activation-period-input"
          gh release download a1-yandex-2025-gpr-private-test \
            --repo "$GITHUB_REPOSITORY" \
            --pattern yandex-music-2025-10-4-120-1gpr.xapk \
            --dir "$RUNNER_TEMP/celikom-activation-period-input" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-activation-period-input/yandex-music-2025-10-4-120-1gpr.xapk"
          test "$(stat -c %s "$f")" = 45961661
          test "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053
      - name: Inspect exact Lo96 native period to native holder caller contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/native_period_activation_handoff_exact.py \
            --xapk "$RUNNER_TEMP/celikom-activation-period-input/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Trace exact DataSource open to its signed Loadable owner (sanitized proof)
        shell: bash
        run: |
          set -euo pipefail
          report="$(python3 -B android/native-yandex-hooklab/ci/a1_exact_datasource_loadable_owner.py \
            --xapk "$RUNNER_TEMP/celikom-activation-period-input/yandex-music-2025-10-4-120-1gpr.xapk")"
          printf '%s' "$report" | python3 -c '
          import json, sys
          d=json.load(sys.stdin)
          calls=d.get("exact_open_direct_callers", [])
          loadables=[r for r in calls if r.get("method_matches_exact_loader_contract")]
          owner=loadables[0].get("method", [None])[0] if len(loadables)==1 else None
          periods=set(d.get("signed_media_period_implementers", []))
          lo96_sites=[x for x in d.get("candidate_constructor_callsites", [])
                      if owner is not None and x.get("constructed_owner")==owner
                      and x.get("caller_is_exact_Lo96_method")]
          print("A1_EXACT_OPEN_DIRECT_CALLER_COUNT="+str(len(calls)))
          print("A1_EXACT_LOADABLE_OWNER_COUNT="+str(len(loadables)))
          print("A1_SIGNED_MEDIA_PERIOD_IMPLEMENTER_COUNT="+str(len(periods)))
          print("A1_LOADABLE_HAS_EXACT_LO96_REFERENCE="+str(bool(d.get("loadable_owner_has_exact_Lo96_reference_proven"))).upper())
          print("A1_LOADABLE_CONSTRUCTED_INSIDE_EXACT_LO96="+str(bool(d.get("loadable_owner_constructed_inside_exact_Lo96_method"))).upper())
          print("A1_LOADABLE_CONSTRUCTED_INSIDE_ANY_MEDIA_PERIOD="+str(bool(d.get("loadable_owner_constructed_inside_any_signed_MediaPeriod"))).upper())
          print("A1_EXACT_LO96_LOADABLE_CONSTRUCTOR_SITE_COUNT="+str(len(lo96_sites)))
          print("A1_ACTIVE_PERIOD_SAMPLE_STREAM_LINK_STATIC="+str(bool(d.get("active_period_sample_stream_renderer_link_proven"))).upper())
          print("A1_VERDICT="+str(d.get("verdict", "MISSING")))
          for i, row in enumerate(calls, 1):
              method=row.get("method", [None])
              owner=method[0] if method else None
              prefix="A1_OPEN_CALLER_"+str(i)+"_"
              print(prefix+"IS_EXACT_LO96="+str(owner=="Lo96;").upper())
              print(prefix+"IS_MEDIA_PERIOD="+str(owner in periods).upper())
              print(prefix+"LOADABLE_CONTRACT="+str(bool(row.get("method_matches_exact_loader_contract"))).upper())
              print(prefix+"NESTED_UNDER_LO96="+str(bool(row.get("nested_under_exact_Lo96"))).upper())
              for key in ("owner_period_field_count", "owner_source_field_count", "owner_wrapper_field_count", "owner_media_period_field_count", "owner_constructor_count"):
                  print(prefix+key.upper()+"="+str(row.get(key, 0)))
              print(prefix+"OPEN_READ_SAME_METHOD="+str(bool(row.get("exact_open_and_read_same_method"))).upper())
              print(prefix+"OPEN_CLOSE_SAME_METHOD="+str(bool(row.get("exact_open_and_close_same_method"))).upper())
          ' 
      - name: Delete the original research input and guard untouched products
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/celikom-activation-period-input"
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo '{"original_binary_modified":false,"original_binary_exported":false,"user_login_or_media_accessed":false,"runtime_hooks_changed":false,"decoder_source_changed":false}'
