name: CELIKOM A1 signed native selected-item to Exo descriptor audit (READ ONLY)
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - 'android/native-yandex-hooklab/audit_native_selected_item_handoff.py'
      - 'android/native-yandex-hooklab/tests/test_audit_native_selected_item_handoff.py'
      - '.github/workflows/android-a1-selected-item-handoff-readonly.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-native-selected-item-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only signature and package metadata tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner
      - name: Validate bounded parser and static role tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile android/native-yandex-hooklab/audit_native_selected_item_handoff.py
          PYTHONPATH=android/native-yandex-hooklab python3 -B -m unittest discover \
            -s android/native-yandex-hooklab/tests -p 'test_audit_native_selected_item_handoff.py' -v
      - name: Download exact private issuer-signed 2025 owner XAPK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/celikom-a1-selected-item-private"
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" \
            --pattern yandex-music-2025-10-4-120-1gpr.xapk \
            --dir "$RUNNER_TEMP/celikom-a1-selected-item-private" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-a1-selected-item-private/yandex-music-2025-10-4-120-1gpr.xapk"
          test "$(stat -c %s "$f")" = 45961661
          test "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053
      - name: Inspect exact signed 2025 DEX, bounded Media3 Player ancestry and exact inherited interface contracts in memory
        shell: bash
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/audit_native_selected_item_handoff.py \
            --xapk "$RUNNER_TEMP/celikom-a1-selected-item-private/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Enforce no APK, login, media, or persistent output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          rm -rf -- "$RUNNER_TEMP/celikom-a1-selected-item-private"
          echo '{"original_binary_modified":false,"original_binary_exported":false,"user_login_or_media_accessed":false,"decoder_source_changed":false}'
