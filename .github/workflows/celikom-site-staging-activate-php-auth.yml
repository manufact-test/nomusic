name: CELIKOM staging activate PHP-level private authentication
on:
  push:
    branches: [feature/api-range]
    paths:
      - .github/workflows/celikom-site-staging-activate-php-auth.yml
permissions:
  contents: read
concurrency:
  group: celikom-website-staging
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply narrow staging PHP access fix
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = manufact-test/nomusic
          test "$GITHUB_REF" = refs/heads/feature/api-range
          grep -Fq '&& false' .github/workflows/deploy-celikom-website.yml
          php -l website/app/src/CmsStagingHttpAuth.php
          php -l website/public/index.php
          php -l website/public/admin/index.php
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$SSH_KEY" > "$scratch/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$scratch/known"
          chmod 600 "$scratch/key" "$scratch/known"
          opts=(-T -p 65002 -i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$scratch/known")
          scpopts=(-P 65002 -i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$scratch/known")
          target=u235811320@92.113.19.189
          root=/home/u235811320/domains/lemonchiffon-narwhal-791953.hostingersite.com
          ssh "${opts[@]}" "$target" "test -f '$root/celikom-private/staging-approval-paused' && test ! -e '$root/celikom-private/app/staging-approved.php' && test -f '$root/celikom-private/.htpasswd'"
          scp "${scpopts[@]}" website/app/src/CmsStagingHttpAuth.php "$target:$root/celikom-private/app/src/CmsStagingHttpAuth.php"
          scp "${scpopts[@]}" website/public/index.php "$target:$root/public_html/index.php"
          scp "${scpopts[@]}" website/public/admin/index.php "$target:$root/public_html/admin/index.php"
          ssh "${opts[@]}" "$target" "mv '$root/celikom-private/staging-approval-paused' '$root/celikom-private/app/staging-approved.php'"
          site=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://lemonchiffon-narwhal-791953.hostingersite.com/?accesscheck=$GITHUB_SHA")
          admin=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://lemonchiffon-narwhal-791953.hostingersite.com/admin/?accesscheck=$GITHUB_SHA")
          if [[ "$site" != 401 || "$admin" != 401 ]]; then
            ssh "${opts[@]}" "$target" "mv '$root/celikom-private/app/staging-approved.php' '$root/celikom-private/staging-approval-paused'"
            echo "Staging closed again: unexpected access status site=$site admin=$admin"
            exit 1
          fi
          echo "STAGING_PROTECTED: both website and CMS require credentials over HTTPS (401 verified)."
