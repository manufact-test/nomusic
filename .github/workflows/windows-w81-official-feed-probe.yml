name: Windows W81 probe official Yandex updater metadata

on:
  push:
    branches:
      - experiment/windows-w81-vendor-monitor-compat-visibility-20261112
    paths:
      - .github/workflows/windows-w81-official-feed-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - name: Check official small updater manifests, no downloads or installations
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $base='https://music-desktop-application.s3.yandex.net/stable/'
          foreach($name in @('latest.yml','latest-win.yml','latest-linux.yml','latest-mac.yml','release-notes/ru.json')) {
            try {
              $r=Invoke-WebRequest -Uri ($base+$name) -TimeoutSec 15 -MaximumRedirection 0
              Write-Host "YANDEX_FEED $name STATUS=$([int]$r.StatusCode) BYTES=$($r.RawContentLength)"
              if($name.EndsWith('.yml')) {
                $match=[regex]::Match($r.Content,'(?m)^version:\s*([^\s]+)')
                if($match.Success){Write-Host "YANDEX_FEED_VERSION $name $($match.Groups[1].Value)"}
                Write-Host "YANDEX_FEED_PATH_HINT $name $([regex]::Match($r.Content,'Yandex_Music_x64_[0-9.]+\.exe').Value)"
              }
            } catch {
              Write-Host "YANDEX_FEED $name UNAVAILABLE"
            }
          }
