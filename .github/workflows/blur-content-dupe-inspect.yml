name: CELIKOM Blur — inspect two identical-source MP3 IDs read-only
on:
  push:
    branches: [feature/blur-batch1000-20261108]
    paths: ['.github/workflows/blur-content-dupe-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure ffprobe is installed
        run: command -v ffprobe || { sudo apt-get update -qq; sudo apt-get install -y ffmpeg; }
      - name: Download exact two pinned source bytes and print embedded title tags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,tempfile,pathlib,urllib.request,subprocess
          src='10187b7af56f311fe141a3c9b75483798bf0f589'
          p=json.load(open('tools/blur-batch1000/fixed-plan1000.json'))
          expect={x['id']:x for x in p['selected'] if x['id'] in ('29508047','29508038')}
          assert len(expect)==2
          with tempfile.TemporaryDirectory() as tmp:
              for tid in ('29508047','29508038'):
                  path=pathlib.Path(tmp)/(tid+'.mp3')
                  data=urllib.request.urlopen(urllib.request.Request(f'https://raw.githubusercontent.com/Hazzz895/FckCensorData/{src}/tracks/{tid}',headers={'User-Agent':'CELIKOM-dupe-readonly'}),timeout=30).read()
                  item=expect[tid]
                  got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  assert len(data)==item['size'] and got==item['blob']
                  path.write_bytes(data)
                  o=subprocess.run(['ffprobe','-v','error','-show_entries','format_tags=title,artist,album','-of','json',str(path)],check=True,text=True,capture_output=True)
                  print('SOURCE_DUPLICATE_TAGS '+json.dumps({'id':tid,'source_title':item['title'],'source_artist':item['artist'],'git_blob':got,'tags':json.loads(o.stdout).get('format',{}).get('tags',{})},ensure_ascii=False),flush=True)
          PY
