name: CELIKOM coordinated Hostinger freeze and FlokiNET production cutover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/floki-final-live-cutover.yml'
  workflow_dispatch:
    inputs:
      execute_final_cutover:
        description: Requires approved completed preflight and manual explicit opt-in
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: celikom-floki-deploy
  cancel-in-progress: false
jobs:
  validate-scripts:
    if: github.repository == 'manufact-test/nomusic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate all production scripts before any credential or freeze
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/floki-cutover-source-freeze.sh
          bash -n .github/scripts/floki-cutover-target-activate.sh
          bash -n .github/scripts/floki-cutover-runner.sh
          bash -n .github/scripts/floki-final-db-dump.sh
          bash -n .github/scripts/floki-final-db-intake.sh
          bash -n .github/scripts/floki-final-db-verify.sh
          bash -n .github/scripts/floki-final-db-cleanup.sh
          echo CELIKOM_ALL_FINAL_CUTOVER_SCRIPTS_SYNTAX_OK
  final-cutover:
    needs: validate-scripts
    if: >-
      github.repository == 'manufact-test/nomusic' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[celikom-final-go]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.execute_final_cutover == true))
    runs-on: ubuntu-latest
    environment: floki-deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Freeze only two old CELIKOM write surfaces, transfer final SQL and activate with rollback
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          FLOKI_DEPLOY_CONNECTION: ${{ secrets.FLOKI_DEPLOY_CONNECTION }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/floki-cutover-runner.sh
# Execute after validated signed clients, fresh isolated CRUD/HTTP acceptance, current source-to-target media parity, and tested rollback.
# Retry only after correcting the source tempfile path; live source hashes were unchanged after aborted pre-freeze setup.
