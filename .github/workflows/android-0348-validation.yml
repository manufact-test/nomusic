name: Android 0.3.55 architecture and release contract verification

on:
  push:
    branches:
      - feature/android-0348-audio-ownership-stabilization
      - feature/android-unified-preparation-seek-gate
      - feature/android-0370-honor-join-pause-updater-staging
      - feature/android-0371-rollback-0369-staging
      - feature/android-0371-honor-diagnostic-audit-staging
    paths:
      - 'android/native-companion/**'
      - '.github/workflows/android-0348-validation.yml'
      - '.github/workflows/android-auto-publish-hostinger.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 and D8 build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SM"
          "$SM" --version
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch exactly pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd android/native-companion
          mkdir -p deps
          curl --fail --location --retry 4 --silent --show-error -o deps/annotation.jar 'https://dl.google.com/dl/android/maven2/androidx/annotation/annotation-jvm/1.9.1/annotation-jvm-1.9.1.jar'
          curl --fail --location --retry 4 --silent --show-error -o deps/common.jar 'https://dl.google.com/dl/android/maven2/androidx/media3/media3-common/1.8.0/media3-common-1.8.0.aar'
          curl --fail --location --retry 4 --silent --show-error -o deps/session.jar 'https://dl.google.com/dl/android/maven2/androidx/media3/media3-session/1.8.0/media3-session-1.8.0.aar'
          # AARs have classes.jar inside; preserve Maven's original extracted JAR bytes.
          for n in common session; do
            mv "deps/$n.jar" "deps/$n.aar"
            unzip -p "deps/$n.aar" classes.jar >"deps/$n.jar"
            rm "deps/$n.aar"
          done
          curl --fail --location --retry 4 --silent --show-error -o deps/guava.jar 'https://repo.maven.apache.org/maven2/com/google/guava/guava/33.3.1-android/guava-33.3.1-android.jar'
          curl --fail --location --retry 4 --silent --show-error -o deps/json.jar 'https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar'
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("."); manifest=json.loads((root/"build-inputs.json").read_text())
          for name,want in manifest["dependencies"].items():
              got=hashlib.sha256((root/"deps"/name).read_bytes()).hexdigest()
              print(name, "MATCH" if got==want else "MISMATCH",got)
              if got!=want: raise SystemExit("Dependency checksum mismatch: "+name)
          PY
      - name: Verify Android 0.3.52 release-contract negative cases
        shell: bash
        run: python3 android/native-companion/tests/check_release_contract.py
      - name: Audit combined-journal semantics using only synthetic events
        shell: bash
        run: python3 android/native-companion/tests/check_honor_journal_audit.py
      - name: Reject altered or injected APK structures (negative regression cases)
        shell: bash
        run: python3 android/native-companion/tests/check_release_archive.py
      - name: Reject stale or forged CI source-to-DEX provenance
        shell: bash
        run: python3 android/native-companion/tests/check_ci_provenance.py
      - name: Assert unsigned inspection can never bypass signing
        shell: bash
        run: python3 android/native-companion/tests/check_release_modes.py
      - name: Run full Android native host regression suite
        shell: bash
        run: python3 android/native-companion/tests/run_engine.py
      - name: Compile native sources and run D8
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android/native-companion
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CP="$SDK/platforms/android-36/android.jar"
          for name in annotation common guava session; do CP="$CP:$ROOT/deps/$name.jar"; done
          mkdir -p "$RUNNER_TEMP/classes" "$RUNNER_TEMP/dex"
          find "$ROOT/addon/src" -type f -name '*.java' | sort > "$RUNNER_TEMP/sources.txt"
          javac -encoding UTF-8 -source 8 -target 8 -cp "$CP" -d "$RUNNER_TEMP/classes" @"$RUNNER_TEMP/sources.txt"
          jar cf "$RUNNER_TEMP/addon.jar" -C "$RUNNER_TEMP/classes" .
          BT="$SDK/build-tools/36.0.0"
          D8=(java -Xmx1500m -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 --min-api 28 --lib "$SDK/platforms/android-36/android.jar" --output "$RUNNER_TEMP/dex")
          for n in annotation common guava session; do D8+=(--classpath "$ROOT/deps/$n.jar"); done
          "${D8[@]}" "$RUNNER_TEMP/addon.jar"
          test -s "$RUNNER_TEMP/dex/classes.dex"
          cp "$RUNNER_TEMP/dex/classes.dex" "$ROOT/android-native-classes2.dex"
          sha256sum "$ROOT/android-native-classes2.dex"
      - name: Record JDK17 CI Java-source and DEX provenance
        shell: bash
        run: python3 android/native-companion/tests/write_ci_provenance.py
      - name: Stage portable offline APK packaging toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/36.0.0"
          OUT=android-native-offline-kit
          ROOT=android/native-companion
          mkdir -p "$OUT/sdk/platforms/android-36" "$OUT/build-tools/36.0.0/lib" "$OUT/build-tools/36.0.0/lib64" "$OUT/native-companion"
          cp "$SDK/platforms/android-36/android.jar" "$OUT/sdk/platforms/android-36/android.jar"
          cp "$BT/lib/d8.jar" "$OUT/build-tools/36.0.0/lib/d8.jar"
          cp "$BT/lib/apksigner.jar" "$OUT/build-tools/36.0.0/lib/apksigner.jar"
          cp "$BT/zipalign" "$OUT/build-tools/36.0.0/zipalign"
          cp "$BT/aapt" "$OUT/build-tools/36.0.0/aapt"
          chmod +x "$OUT/build-tools/36.0.0/aapt"
          if [ -d "$BT/lib64" ]; then cp -a "$BT/lib64/." "$OUT/build-tools/36.0.0/lib64/"; fi
          if ! [ -e "$OUT/build-tools/36.0.0/lib64/libc++.so" ]; then
            CXX="$(find "$BT" /usr/lib /lib -type f -name 'libc++.so*' 2>/dev/null | head -1)"
            test -n "$CXX"
            cp "$CXX" "$OUT/build-tools/36.0.0/lib64/libc++.so"
          fi
          LD_LIBRARY_PATH="$OUT/build-tools/36.0.0/lib64" ldd "$OUT/build-tools/36.0.0/zipalign" | tee "$OUT/zipalign-dependencies.txt"
          ! grep -q 'not found' "$OUT/zipalign-dependencies.txt"
          chmod +x "$OUT/build-tools/36.0.0/zipalign"
          curl --fail --location --retry 4 --silent --show-error -o "$OUT/apktool_2.11.1.jar" 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar'
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  android-native-offline-kit/apktool_2.11.1.jar' | sha256sum -c -
          cp -a "$ROOT/addon" "$ROOT/tests" "$ROOT/deps" "$OUT/native-companion/"
          cp "$ROOT/build-inputs.json" "$ROOT/release-spec.json" "$ROOT/release_contract.py" "$ROOT/release_archive.py" "$ROOT/ci_provenance.py" "$ROOT/ci-dex-provenance.json" "$ROOT/build_release.py" "$ROOT/verify_release.py" "$ROOT/verify_unsigned_inspection.py" "$OUT/native-companion/"
          # upload-artifact excludes hidden dotfiles; preserve only the SAFE ignore policy.
          cp "$ROOT/.gitignore" "$OUT/native-companion/source-gitignore.txt"
          cp .github/workflows/android-0348-validation.yml "$OUT/native-companion/ci-android-validation-workflow.yml"
          cp "$ROOT/android-native-classes2.dex" "$OUT/native-companion/"
          printf '%s\\n' "Expected base APK: 170b1883e292570d28a3b5c619cf000eaccd9d11ee85ca6f6c08f7b50e5f72c9" > "$OUT/BUILD-KIT-NO-SIGNING-SECRETS.txt"
      - name: Stage public JDK17 runtime for isolated offline signing
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME/bin/javac"
          tar -C "$JAVA_HOME" -czf android-native-offline-kit/jdk17-linux-x64.tar.gz .
          test -s android-native-offline-kit/jdk17-linux-x64.tar.gz
          tar -tzf android-native-offline-kit/jdk17-linux-x64.tar.gz | grep -F './bin/java'
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-android-offline-kit
          path: android-native-offline-kit/
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-android-0355-dex-unsigned
          path: android/native-companion/android-native-classes2.dex
          if-no-files-found: error
          retention-days: 7


  build-honor-seek-test-apk:
    needs: native-android
    if: github.ref == 'refs/heads/feature/android-0371-honor-diagnostic-audit-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified offline packaging kit from this run
        uses: actions/download-artifact@v4
        with:
          name: celikom-android-offline-kit
          path: ${{ runner.temp }}/kit

      - name: Fetch pinned original Android baseline from private Hostinger inputs
        env:
          HOST_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/private/id_host"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/private/known_hosts"
          chmod 600 "$RUNNER_TEMP/private/id_host" "$RUNNER_TEMP/private/known_hosts"
          scp -P 65002 -i "$RUNNER_TEMP/private/id_host" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/private/known_hosts" \
            u235811320@92.113.19.189:/home/u235811320/domains/lemonchiffon-narwhal-791953.hostingersite.com/celikom-private/android-build-inputs/CELIKOM-0.3.22-install.apk \
            "$RUNNER_TEMP/private/base.apk"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("android/native-companion")
          expected=json.loads((root/"build-inputs.json").read_text())["base_apk_sha256"]
          actual=hashlib.file_digest(pathlib.Path(os.environ["RUNNER_TEMP"],"private/base.apk").open("rb"),"sha256").hexdigest()
          if actual!=expected: raise SystemExit("Private baseline checksum mismatch")
          print("Pinned original Android baseline verified")
          PY

      - name: Reconstruct original signing identity in isolated private storage
        env:
          P12_B64: ${{ secrets.CELIKOM_ANDROID_SIGNING_P12_B64 }}
          SIGN_JSON_B64: ${{ secrets.CELIKOM_ANDROID_SIGNING_JSON_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$P12_B64" && test -n "$SIGN_JSON_B64"
          umask 077
          mkdir -p "$RUNNER_TEMP/private/signing"
          printf %s "$P12_B64" | base64 -d > "$RUNNER_TEMP/private/signing/celikom-native-probe.p12"
          printf %s "$SIGN_JSON_B64" | base64 -d > "$RUNNER_TEMP/private/signing/signing.json"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"],"private/signing")
          if not 1000<(root/"celikom-native-probe.p12").stat().st_size<65536:
              raise SystemExit("Unexpected signing key size")
          data=json.loads((root/"signing.json").read_text())
          if not all(isinstance(data.get(k),str) and data[k] for k in ("alias","store_password","key_password")):
              raise SystemExit("Signing metadata incomplete")
          PY

      - name: Build and independently verify signed HONOR seek-test APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android/native-companion
          SDK="$RUNNER_TEMP/kit/sdk"
          BT="$RUNNER_TEMP/kit/build-tools/36.0.0"
          test -s "$SDK/platforms/android-36/android.jar"
          test -s "$BT/lib/d8.jar"
          test -s "$BT/lib/apksigner.jar"
          test -s "$RUNNER_TEMP/kit/apktool_2.11.1.jar"
          mkdir -p "$ROOT/deps"
          cp "$RUNNER_TEMP/kit/native-companion/deps/"*.jar "$ROOT/deps/"
          OUT="$RUNNER_TEMP/CELIKOM-Android-0.3.71-SEEK-TEST-SIGNED.apk"
          python3 "$ROOT/build_release.py" \
            --sdk "$SDK" \
            --build-tools "$BT" \
            --apktool "$RUNNER_TEMP/kit/apktool_2.11.1.jar" \
            --base-apk "$RUNNER_TEMP/private/base.apk" \
            --signing-dir "$RUNNER_TEMP/private/signing" \
            --deps-dir "$ROOT/deps" \
            --output "$OUT"
          test -s "$OUT"
          test -s "${OUT%.apk}.verification.json"
          sha256sum "$OUT" "${OUT%.apk}.verification.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          apk=root/"CELIKOM-Android-0.3.71-SEEK-TEST-SIGNED.apk"
          proof=json.loads(apk.with_suffix(".verification.json").read_text())
          if proof.get("signing_continuity") is not True or proof.get("signer_matches_pinned_identity") is not True:
              raise SystemExit("Signed test APK did not retain the pinned CELIKOM signing identity")
          if proof.get("physical_phone_playback_verified") is not False:
              raise SystemExit("Unexpected physical-device claim in build receipt")
          receipt={
            "purpose":"Non-publishing HONOR seek-baseline test build",
            "branch":os.environ.get("GITHUB_REF_NAME"),
            "commit":os.environ.get("GITHUB_SHA"),
            "version":proof["version"],
            "version_code":proof["version_code"],
            "apk_sha256":hashlib.file_digest(apk.open("rb"),"sha256").hexdigest(),
            "signer_sha256":proof["signer_sha256"],
            "stable_publish":"SKIPPED",
            "physical_phone_playback_verified":False
          }
          (root/"CELIKOM-Android-0.3.71-SEEK-TEST-RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("PASS: signed non-publishing test APK verified; no deployment step exists in this job")
          PY

      - name: Upload signed HONOR seek-test APK and verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: celikom-android-0371-honor-seek-test-signed
          path: |
            ${{ runner.temp }}/CELIKOM-Android-0.3.71-SEEK-TEST-SIGNED.apk
            ${{ runner.temp }}/CELIKOM-Android-0.3.71-SEEK-TEST-SIGNED.verification.json
            ${{ runner.temp }}/CELIKOM-Android-0.3.71-SEEK-TEST-RECEIPT.json
          if-no-files-found: error
          retention-days: 7


  publish-stable:
    needs: native-android
    if: vars.CELIKOM_ANDROID_AUTO_PUBLISH == 'true' && github.ref == 'refs/heads/feature/android-unified-preparation-seek-gate'
    uses: ./.github/workflows/android-auto-publish-hostinger.yml
    secrets: inherit
