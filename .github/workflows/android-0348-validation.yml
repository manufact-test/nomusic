name: Android 0.3.48 diagnostics and reproducible compilation

on:
  push:
    branches:
      - feature/android-0348-audio-ownership-stabilization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 and D8 build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SM"
          "$SM" --version
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch exactly pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd android/native-companion
          mkdir -p deps
          curl --fail --location --retry 4 --silent --show-error -o deps/annotation.jar 'https://dl.google.com/dl/android/maven2/androidx/annotation/annotation-jvm/1.9.1/annotation-jvm-1.9.1.jar'
          curl --fail --location --retry 4 --silent --show-error -o deps/common.jar 'https://dl.google.com/dl/android/maven2/androidx/media3/media3-common/1.8.0/media3-common-1.8.0.aar'
          curl --fail --location --retry 4 --silent --show-error -o deps/session.jar 'https://dl.google.com/dl/android/maven2/androidx/media3/media3-session/1.8.0/media3-session-1.8.0.aar'
          # AARs have classes.jar inside; preserve Maven's original extracted JAR bytes.
          for n in common session; do
            mv "deps/$n.jar" "deps/$n.aar"
            unzip -p "deps/$n.aar" classes.jar >"deps/$n.jar"
            rm "deps/$n.aar"
          done
          curl --fail --location --retry 4 --silent --show-error -o deps/guava.jar 'https://repo.maven.apache.org/maven2/com/google/guava/guava/33.3.1-android/guava-33.3.1-android.jar'
          curl --fail --location --retry 4 --silent --show-error -o deps/json.jar 'https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar'
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("."); manifest=json.loads((root/"build-inputs.json").read_text())
          for name,want in manifest["dependencies"].items():
              got=hashlib.sha256((root/"deps"/name).read_bytes()).hexdigest()
              print(name, "MATCH" if got==want else "MISMATCH",got)
              if got!=want: raise SystemExit("Dependency checksum mismatch: "+name)
          PY
      - name: Run full Android native host regression suite
        shell: bash
        run: python3 android/native-companion/tests/run_engine.py
      - name: Compile native sources and run D8
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android/native-companion
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CP="$SDK/platforms/android-36/android.jar"
          for name in annotation common guava session; do CP="$CP:$ROOT/deps/$name.jar"; done
          mkdir -p "$RUNNER_TEMP/classes" "$RUNNER_TEMP/dex"
          find "$ROOT/addon/src" -type f -name '*.java' | sort > "$RUNNER_TEMP/sources.txt"
          javac -encoding UTF-8 -source 8 -target 8 -cp "$CP" -d "$RUNNER_TEMP/classes" @"$RUNNER_TEMP/sources.txt"
          jar cf "$RUNNER_TEMP/addon.jar" -C "$RUNNER_TEMP/classes" .
          BT="$SDK/build-tools/36.0.0"
          D8=(java -Xmx1500m -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 --min-api 28 --lib "$SDK/platforms/android-36/android.jar" --output "$RUNNER_TEMP/dex")
          for n in annotation common guava session; do D8+=(--classpath "$ROOT/deps/$n.jar"); done
          "${D8[@]}" "$RUNNER_TEMP/addon.jar"
          test -s "$RUNNER_TEMP/dex/classes.dex"
          cp "$RUNNER_TEMP/dex/classes.dex" "$ROOT/android-native-classes2.dex"
          sha256sum "$ROOT/android-native-classes2.dex"
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-android-0348-dex-unsigned
          path: android/native-companion/android-native-classes2.dex
          if-no-files-found: error
          retention-days: 7
