name: CELIKOM 0.4.52 background upload verification
on:
  push:
    branches: [fix/upload-popup-background-20261018]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm --prefix extension test
      - run: npm --prefix extension run validate
      - run: npm run security
      - name: Build only the approved configured extension package
        env:
          CELIKOM_API_BASE_URL: https://darkred-camel-588676.hostingersite.com
        run: npm --prefix extension run build
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-0.4.52-background-upload
          path: |
            extension/dist/celikom-extension-0.4.52.zip
            extension/dist/celikom-extension-0.4.52.zip.sha256
          if-no-files-found: error
          retention-days: 14
