name: CELIKOM final database transfer rehearsal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/floki-final-db-snapshot.yml'
      - '.github/scripts/floki-final-db-*.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: celikom-floki-deploy
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.repository == 'manufact-test/nomusic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: floki-deploy
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rehearse encrypted database transfer and isolated restore
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          FLOKI_DEPLOY_CONNECTION: ${{ secrets.FLOKI_DEPLOY_CONNECTION }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          [[ -n "$HOSTINGER_SSH_KEY" && -n "$FLOKI_DEPLOY_CONNECTION" ]]
          tmp=$(mktemp -d)
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$tmp/source-key"
          unset HOSTINGER_SSH_KEY
          printf '%s\n' "$FLOKI_DEPLOY_CONNECTION" | tr -d '\r' > "$tmp/bundle"
          unset FLOKI_DEPLOY_CONNECTION
          head -n 1 "$tmp/bundle" > "$tmp/target-known"
          tail -n +2 "$tmp/bundle" > "$tmp/target-key"
          rm "$tmp/bundle"
          grep -Eq '^95\.133\.160\.111 ssh-ed25519 [A-Za-z0-9+/=]+$' "$tmp/target-known"
          ssh-keygen -y -P '' -f "$tmp/target-key" >/dev/null
          ssh-keygen -y -P '' -f "$tmp/source-key" > "$tmp/source.pub"
          test "$(ssh-keygen -lf "$tmp/source.pub" | awk '{print $2}')" = 'SHA256:Q6FyifXRq6garceQdIIjBmXhkk81Ic1p/x9JTSYHWUk'
          printf '%s\n' '[92.113.19.189]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAf8M2EVwq0oJI8I9KZ0NFE8P8yDOvDATEhkQti/Kk/0' > "$tmp/source-known"
          src=(-T -p 65002 -i "$tmp/source-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$tmp/source-known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ClearAllForwardings=yes)
          dst=(-T -i "$tmp/target-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$tmp/target-known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ClearAllForwardings=yes)
          installed=0
          cleanup(){
            rc=$?
            if [[ "$installed" == 1 ]]; then
              ssh "${dst[@]}" celikom-deploy@95.133.160.111 maintenance < .github/scripts/floki-final-db-cleanup.sh || rc=1
            fi
            rm -rf -- "$tmp"
            exit "$rc"
          }
          trap cleanup EXIT
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
          unset GH_TOKEN
          for kind in api cms; do
            ssh "${src[@]}" u235811320@92.113.19.189 "bash -s -- $kind" < .github/scripts/floki-final-db-dump.sh > "$tmp/$kind.sql.gz"
            gzip -t "$tmp/$kind.sql.gz"
            test "$(stat -c %s "$tmp/$kind.sql.gz")" -gt 100
          done
          ssh "${dst[@]}" celikom-deploy@95.133.160.111 maintenance < .github/scripts/floki-final-db-intake.sh
          installed=1
          for kind in api cms; do
            expected=$(sha256sum "$tmp/$kind.sql.gz" | cut -d' ' -f1)
            actual=$(ssh "${dst[@]}" celikom-deploy@95.133.160.111 "receive-cutover-$kind" < "$tmp/$kind.sql.gz")
            [[ "$actual" == "$expected" ]]
            echo "SQL_SNAPSHOT_HASH_MATCH $kind $expected"
          done
          ssh "${dst[@]}" celikom-deploy@95.133.160.111 maintenance < .github/scripts/floki-final-db-verify.sh
          echo CELIKOM_DB_TRANSFER_REHEARSAL_OK
