name: CELIKOM A1 experimental resource package name synthetic unit tests
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - '.github/workflows/android-a1-resource-package-synthetic.yml'
      - 'android/native-yandex-hooklab/ci/a1_resource_package_rename.py'
      - 'android/native-yandex-hooklab/ci/test_a1_resource_package_rename.py'
permissions:
  contents: read
jobs:
  synthetic-only-no-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run immutable resource-name field tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile android/native-yandex-hooklab/ci/a1_resource_package_rename.py
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_a1_resource_package_rename.py -v
          echo '{"signed_apks_modified":false,"publisher_binaries_used":false,"stage_a":"NO_GO"}'
