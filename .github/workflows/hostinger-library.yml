name: CELIKOM Stage 6 restricted library operations

on:
  workflow_dispatch:
  push:
    branches: [feature/api-range]
    paths:
      - .github/deploy/hostinger-library-request.json

permissions:
  contents: read

concurrency:
  group: celikom-hostinger-private-test
  cancel-in-progress: false

jobs:
  controlled-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Validate request and static helper contracts
        run: |
          node --test .github/scripts/tests/hostinger-library-contract.test.mjs
          node .github/scripts/hostinger-library-contract.mjs
          bash -n .github/scripts/hostinger-library.sh
          php -l .github/scripts/hostinger-library-remote.php
          php -l server/src/Application/LibraryManagementService.php
      - name: Restricted Hostinger library action (validate is local-only)
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: bash .github/scripts/hostinger-library.sh
