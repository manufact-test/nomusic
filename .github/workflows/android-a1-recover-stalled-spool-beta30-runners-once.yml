name: CELIKOM A1 one-shot stuck Floki runner recovery BETA33
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-a1-recover-stalled-spool-beta30-runners-once.yml'
permissions:
  contents: read
jobs:
  cancel-exact-stalled-runner-job:
    if: github.repository == 'manufact-test/nomusic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel only the exact no-step BETA33 CI01 spool job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=manufact-test/nomusic
          run_id=46133474118
          attempt=1
          sha=51a2f0b5ea305108137a65aa74076e14615b959b
          workflow_path=.github/workflows/android-a1-owner-floki-spool.yml
          job_name=stage-verified-signed-apk
          runner_name=celikom-floki-ci01
          run_json="$RUNNER_TEMP/a1-b33-run.json"
          jobs_json="$RUNNER_TEMP/a1-b33-jobs.json"
          gh api "repos/$repo/actions/runs/$run_id/attempts/$attempt" > "$run_json"
          jq -e --arg sha "$sha" --arg path "$workflow_path" --argjson attempt "$attempt" --argjson run_id "$run_id" '
            .id == $run_id and .run_attempt == $attempt
            and .head_sha == $sha and .head_branch == "main" and .path == $path
          ' "$run_json" >/dev/null
          status=$(jq -r .status "$run_json")
          if [[ "$status" == completed ]]; then
            echo "A1_BETA33_RUN_ALREADY_COMPLETED $run_id"
            exit 0
          fi
          [[ "$status" == in_progress ]] || { echo "A1_BETA33_RUN_NOT_IN_PROGRESS $run_id" >&2; exit 1; }
          gh api "repos/$repo/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" > "$jobs_json"
          jq -e --arg name "$job_name" --arg runner "$runner_name" '
            .total_count == 1
            and .jobs[0].name == $name
            and .jobs[0].status == "in_progress"
            and .jobs[0].runner_name == $runner
            and (.jobs[0].steps | length) == 0
          ' "$jobs_json" >/dev/null
          gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" >/dev/null
          for i in {1..6}; do
            sleep 4
            status=$(gh api "repos/$repo/actions/runs/$run_id/attempts/$attempt" --jq .status)
            [[ "$status" == completed ]] && break
          done
          if [[ "$status" != completed ]]; then
            gh api --method POST "repos/$repo/actions/runs/$run_id/force-cancel" >/dev/null
          fi
          echo "A1_EXACT_BETA33_CI01_NO_STEP_JOB_CANCELLED_OR_FORCE_REQUESTED $run_id"
