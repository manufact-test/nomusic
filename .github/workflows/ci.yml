name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      # Android has its own dedicated checks; generic PHP/Node CI cannot validate Android.
      # Do not spawn a doomed GitHub-hosted job for every Android-only commit.
      - 'android/**'
      - '.github/workflows/android-*.yml'
      - '.github/workflows/floki-android-*.yml'
      - '.github/workflows/celikom-a1-*.yml'
      - '.github/scripts/floki-android-*.py'
      - '.github/scripts/floki-android-*.sh'
      - '.github/scripts/tests/floki-android-*.py'
      - '.github/release/android-*.json'
      - '.github/ci/android-*'
      - '.github/ci/celikom-runner-smoke-trigger.txt'
      - '.github/ci/celikom-win-crossbuild-trigger.txt'
      - '.github/workflows/celikom-win-crossbuild-floki.yml'
      - '.github/ci/celikom-win-portable-trigger.txt'
      - '.github/ci/celikom-extension-build-trigger.txt'
      - '.github/deploy/floki-maintenance-request.sh'
      - '.github/workflows/celikom-win-portable-floki-preflight.yml'
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-mysql
          MYSQL_DATABASE: celikom_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-mysql"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: celikom_test
      DB_USER: root
      DB_PASSWORD: ci-disposable-mysql
      STORAGE_PATH: /tmp/celikom-ci-private-audio
      REQUIRE_BROWSER_AUDIO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install JavaScript workspace
        run: npm ci

      - name: Validate Composer package
        run: |
          composer --working-dir=server validate --strict
          composer --working-dir=server dump-autoload --no-interaction

      - name: Validate W155 final owner EXE and ZIP package contract
        run: node --test .github/scripts/tests/windows-stable-owner-package-contract.test.mjs

      - name: Validate Stage 6 restricted library workflow
        run: |
          node --test .github/scripts/tests/hostinger-library-contract.test.mjs
          node .github/scripts/hostinger-library-contract.mjs
          bash -n .github/scripts/hostinger-library.sh
          php -l .github/scripts/hostinger-library-remote.php
      - name: Install CI-only synthetic MP3 encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -F libmp3lame

      - name: Verify repository
        run: |
          php scripts/test-extension-cors.php
          npm run ci

      # Trusted main deliverables are independently built and checked in the
      # FlokiNET portable job of windows-w98-integration-ci.yml. The generic
      # repository CI build is NOT the release delivery path; keep legacy
      # Actions uploads for PR/develop only, without weakening npm run ci.
      - name: Upload extension artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: celikom-extension-${{ github.sha }}
          path: |
            extension/dist/celikom-extension-*.zip
            extension/dist/celikom-extension-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload private-test server package
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: celikom-server-${{ github.sha }}
          path: |
            dist/celikom-server-*.zip
            dist/celikom-server-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload disposable UI layout proof
        if: always() && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: celikom-layout-${{ github.sha }}
          path: dist/layout-proof/*.png
          if-no-files-found: ignore
          retention-days: 7
