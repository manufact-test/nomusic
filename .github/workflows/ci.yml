name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install JavaScript workspace
        run: npm ci

      - name: Validate Composer package
        run: |
          composer --working-dir=server validate --strict
          composer --working-dir=server dump-autoload --no-interaction

      - name: Verify repository
        run: npm run ci

      - name: Verify PHP runtime
        run: composer --working-dir=server test

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: celikom-extension-${{ github.sha }}
          path: |
            extension/dist/celikom-extension-*.zip
            extension/dist/celikom-extension-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
