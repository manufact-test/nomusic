name: Android A1 metaloader-0 versus direct clone MAIN A/B, isolated
on:
  push:
    branches:
      - experiment/android-native-a1-lspatch-clone-loader0-20261111
    paths:
      - 'android/native-yandex-hooklab/clone_lspatch_loader_zero.py'
      - 'android/native-yandex-hooklab/clone_main_crash_buffer.py'
      - 'android/native-yandex-hooklab/tests/test_clone_main_crash_buffer.py'
      - 'android/native-yandex-hooklab/recover_stored_origin_crc.py'
      - 'android/native-yandex-hooklab/tests/test_recover_stored_origin_crc.py'
      - 'android/native-yandex-hooklab/tests/test_clone_lspatch_loader_zero.py'
      - 'android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py'
      - '.github/workflows/android-native-a1-clone-lspatch-loader-zero.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-private-no-bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Static signature/config/media isolation tests
        run: |
          python3 -m py_compile android/native-yandex-hooklab/clone_main_crash_buffer.py android/native-yandex-hooklab/recover_stored_origin_crc.py android/native-yandex-hooklab/clone_lspatch_loader_zero.py android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_main_crash_buffer.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_recover_stored_origin_crc.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_lspatch_loader_zero.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_merge_lab_splits_ephemeral.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_crash_classification.py -v
      - name: Enable disposable emulator KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Compare zero-bypass LSPatch metaloader clone boot before and after original
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_5
          emulator-boot-timeout: 480
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: >
            CELIKOM_CLEAN_ANDROID_ARMV7_TRANSLATION=1
            CELIKOM_MANIFEST_ONLY_ORIGINAL_DEX=1
            CELIKOM_OMIT_SHADOWED_SIGNATURE_DECLS=1
            CELIKOM_ORIGINAL_CONTROL_LAUNCH=1
            CELIKOM_MERGE_PARALLEL_SINGLE_APK=1
            CELIKOM_CLONE_FIRST_AB=1
            CELIKOM_CLONE_LSPATCH_LOADER_ZERO=1
            python3 android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py
      - name: Confirm absence of persisted third-party APKs and keys
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo "LSPatch jar, clone, original APK and keys confined to deleted CI tempdir"
