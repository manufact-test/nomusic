name: CELIKOM 0.4.60 install archive
on:
  push:
    branches: [feature/api-range]
    paths: [.github/workflows/desktop-owner-archive-060.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CELIKOM_API_BASE_URL: https://darkred-camel-588676.hostingersite.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2fd587cfccc7424e755797be3f072771b4497805
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the exact source validated by private Chrome run39488675297
        run: |
          npm ci
          npm --prefix extension run build
          node extension/scripts/validate-manifest.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          assert.equal(JSON.parse(await readFile('extension/dist/unpacked/manifest.json','utf8')).version,'0.4.60');
          assert.equal(JSON.parse(await readFile('extension/dist/unpacked/api/config.json','utf8')).baseUrl,'https://darkred-camel-588676.hostingersite.com');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: CELIKOM-0.4.60
          path: extension/dist/unpacked/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: actions/download-artifact@v4
        with:
          name: CELIKOM-0.4.60
          path: dist/install-archive-check
      - name: Verify downloadable archive is the complete extension at its root
        run: |
          test -f dist/install-archive-check/manifest.json
          diff -qr extension/dist/unpacked dist/install-archive-check
          echo 'DIRECT_INSTALL_ARCHIVE_PASS: manifest at root and all files equal the validated package'
