name: Private read-only upload receipt check
on:
  push:
    branches: [feature/upload-auto-cleanup-20261121]
    paths: ['.github/workflows/upload-receipts-20261121.yml', '.github/scripts/upload-receipts/**']
permissions:
  contents: read
concurrency:
  group: celikom-hostinger-private-test
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check recent staged files without changing moderation or catalog
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f report.json' EXIT
          bash .github/scripts/upload-receipts/check.sh > report.json
          openssl cms -encrypt -binary -aes-256-cbc -in report.json -out report.cms -outform DER .github/scripts/upload-receipts/report-cert.pem
          php -r '$r=json_decode(file_get_contents("report.json"),true,512,JSON_THROW_ON_ERROR); $s=$r["summary"]; printf("UPLOAD_CLEANUP_AGGREGATE release=%s total=%d checked=%d hash_ok=%d size_ok=%d duration_ok=%d canonical=%d full_decode=%d pending=%d approved=%d failed=%d\\n", $r["active_release"], $s["total"], $s["checked"], $s["stored_hash_ok"], $s["stored_size_ok"], $s["duration_ok"], $s["already_canonical"], $s["full_decode_ok"], $s["pending"], $s["approved"], $s["failed_checks"]);'
          echo 'PRIVATE_READ_ONLY_CHECK_COMPLETE'
      - uses: actions/upload-artifact@v4
        with:
          name: private-upload-receipts
          path: report.cms
          retention-days: 3
