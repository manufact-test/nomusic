name: CELIKOM Windows portable checks on FlokiNET

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ci/celikom-win-portable-trigger.txt'

permissions:
  contents: read

concurrency:
  group: celikom-win-portable-floki
  cancel-in-progress: true

jobs:
  portable-build-ci:
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[windows-feed-transfer]') && !contains(github.event.head_commit.message, '[android-feed-prepare]') && !contains(github.event.head_commit.message, '[android-legacy-signature]') && !contains(github.event.head_commit.message, '[windows-protected-source]') && !contains(github.event.head_commit.message, '[windows-private-handoff-quota]'))
    name: Linux extension and server package build
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Detect minimal portable tooling on official self-hosted image
        shell: bash
        run: |
          set -euo pipefail
          for tool in node ruby php zip; do
            if command -v "$tool" >/dev/null; then
              echo "FOUND: $tool"
            else
              echo "MISSING: $tool"
            fi
          done
          command -v php
          command -v ruby
      - name: W113/W148 signed stable release and production trust contract
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/windows-stable-signed-release.yml"); puts "W155_RELEASE_WORKFLOW_YAML_PASS"'
          node --test .github/scripts/tests/windows-stable-manifest.test.mjs .github/scripts/tests/windows-stable-trust-embed.test.mjs .github/scripts/tests/windows-stable-release-verify.test.mjs .github/scripts/tests/windows-stable-keygen.test.mjs .github/scripts/tests/windows-stable-provision-key.test.mjs .github/scripts/tests/windows-stable-key-public.test.mjs .github/scripts/tests/windows-stable-owner-package-contract.test.mjs
          bash -n .github/scripts/windows-stable-publish-hostinger.sh
      - name: Validate Hostinger workflow YAML and owner-scoped private gain staging scripts
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/hostinger-deploy.yml"); puts "W98_HOSTINGER_WORKFLOW_YAML_PASS"'
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/windows-w98-private-gain-reconcile.yml"); puts "W98_PRIVATE_GAIN_RECONCILE_WORKFLOW_YAML_PASS"'
          bash -n .github/scripts/hostinger-windows-gain-stage.sh
          grep -F 'W98_COPY_TARGET_ALREADY_PREFIXED' .github/scripts/hostinger-windows-gain-stage.sh
          grep -F 'copy_to_remote "$work/manifest.json" "$manifest_remote"' .github/scripts/hostinger-windows-gain-stage.sh
          bash -n .github/scripts/hostinger-windows-qa-publish.sh
          php -l .github/scripts/hostinger-windows-gain-remote.php
          node --check .github/scripts/hostinger-windows-gain-verify.mjs
          node --test .github/scripts/tests/hostinger-windows-gain-verify.test.mjs
          grep -F "sidecar_sha256" .github/scripts/hostinger-windows-gain-remote.php
          grep -F "explicit_owner_email_required" .github/scripts/hostinger-windows-gain-remote.php
          grep -F "WHERE u.email = ?" .github/scripts/hostinger-windows-gain-remote.php
          grep -F "CELIKOM_W98_TEST_EMAIL" .github/scripts/hostinger-windows-gain-stage.sh
      - name: Build browser extension and private server package on supported ZIP runner
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run security

  private-feed-transfer:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[windows-feed-transfer]')
    name: Read-only Windows draft transfer to FlokiNET
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact existing signed candidate without publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          api="https://api.github.com/repos/manufact-test/nomusic"
          get() {
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 --max-filesize "$4" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: $3" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/$1" -o "$2"
          }
          get releases/457091607 "$tmp/owner.json" application/vnd.github+json 1000000
          get releases/457092651 "$tmp/feed.json" application/vnd.github+json 1000000
          node - "$tmp" <<'NODE'
          const fs=require('fs'), assert=require('assert/strict'), p=process.argv[2];
          for(const [file,id,tag,assets] of [
            ['owner.json',457091607,'celikom-windows-v0.24.55-owner-bootstrap',[[788114886,'CELIKOM-Windows-0.24.55.exe',85145078]]],
            ['feed.json',457092651,'celikom-windows-v0.24.55-floki-feed-candidate',[[788118277,'latest.json',851],[788118273,'latest.json.sig',71],[788118274,'manifest-public-key.der',91],[788118276,'manifest.json',851],[788118267,'manifest.json.sig',71]]]
          ]) {
            const x=JSON.parse(fs.readFileSync(p+'/'+file));
            assert.equal(x.id,id);assert.equal(x.tag_name,tag);assert.equal(x.draft,true);assert.equal(x.target_commitish,'61d17d9eb97f3db5c58c906e30da6c19ee737090');
            for(const [id,name,size] of assets)assert(x.assets.some(a=>a.id===id&&a.name===name&&a.size===size));
          }
          NODE
          get releases/assets/788114886 "$tmp/CELIKOM-Windows-0.24.55.exe" application/octet-stream 85145078
          get releases/assets/788118277 "$tmp/latest.json" application/octet-stream 851
          get releases/assets/788118273 "$tmp/latest.json.sig" application/octet-stream 71
          get releases/assets/788118274 "$tmp/manifest-public-key.der" application/octet-stream 91
          get releases/assets/788118276 "$tmp/manifest.json" application/octet-stream 851
          get releases/assets/788118267 "$tmp/manifest.json.sig" application/octet-stream 71
          unset GH_TOKEN
          cd "$tmp"
          printf '%s\n' 'f4c9a7881164ac7a9b5681d9f3568e5cbd3a9915c9e1da7b475caa20d3fb6487  CELIKOM-Windows-0.24.55.exe' '9601539c709a554ec7e1f774756c78e2bfdda148d11ea7dd11946a9a5ec66d1a  latest.json' 'a5974b77e7df9a4fb148445c66fed7ca9ed6f3282b398838991fba8b9efb25c9  latest.json.sig' '46b36bb222154316f2229c35cf65e6c953e0b6524dfb0aad8de05949dc143a95  manifest-public-key.der' | sha256sum -c
          cmp latest.json manifest.json
          cmp latest.json.sig manifest.json.sig
          echo CELIKOM_WINDOWS_PRIVATE_DRAFT_TRANSFER_OK
  android-private-feed-contract:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[android-feed-prepare]')
    name: Android private stable candidate contract
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test strict candidate identity and version without signing secrets
        run: python3 .github/scripts/tests/android-stable-prepare-floki.test.py

  android-legacy-signature-audit:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[android-legacy-signature]')
    name: Verify original legacy Android 0.3.92 signed APK
    # Official Android SDK tools already provided on the hosted build runner.
    # Only the exact existing legacy updater's public APK is read. No secrets,
    # production access, build, upload, signature change or release publication.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned legacy bytes and APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d "$RUNNER_TEMP/celikom-legacy-apk.XXXXXXXX")
          trap 'rm -rf -- "$tmp"' EXIT
          sha=5ceb9db20d47390e88cd316c3f74c1928534b35bc54e316f5b841f49b951ff6a
          url="https://lemonchiffon-narwhal-791953.hostingersite.com/releases/android/93-$sha.apk"
          code=$(curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 90 \
            --max-filesize 8845385 --output "$tmp/legacy.apk" --write-out '%{http_code}' "$url")
          test "$code" = 200
          test "$(stat -c %s "$tmp/legacy.apk")" = 8845385
          printf '%s  %s\n' "$sha" "$tmp/legacy.apk" | sha256sum -c -
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          tools="$sdk/build-tools/36.0.0"
          if [[ ! -x "$tools/apksigner" || ! -x "$tools/aapt" ]]; then
            tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          fi
          test -x "$tools/apksigner" && test -x "$tools/aapt"
          # These are the known identity fields of the separately preserved
          # Floki candidate; the private manifest is not read or exported here.
          python3 - "$tmp/identity.json" <<'PY'
          import json,sys
          h="5ceb9db20d47390e88cd316c3f74c1928534b35bc54e316f5b841f49b951ff6a"
          m=dict(schemaVersion=1,enabled=True,channel="stable",packageName="pro.celikom.nativeprobe",
                 versionCode=93,versionName="0.3.92",signerSha256="67fe81c56fac1c1d145344b69a0e3faf9005cf6607f4e26ca27d5926c3eefc4f",
                 apkSha256=h,sizeBytes=8845385,minSdk=28,
                 apkUrl="https://celikom.com/releases/android/93-"+h+".apk",notesRu="")
          with open(sys.argv[1],"w") as f:json.dump(m,f)
          PY
          python3 .github/scripts/android-stable-prepare-floki.py verify --manifest "$tmp/identity.json" \
            --apk "$tmp/legacy.apk" --apksigner "$tools/apksigner" --aapt "$tools/aapt"
          echo CELIKOM_LEGACY_ANDROID_APK_IDENTITY_OK

  protected-windows-source-rehearsal:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[windows-protected-source]')
    name: Protected Windows signed source rehearsal (no deploy)
    # The original signing environment already has draft access. GitHub
    # requires push permission for private draft assets. Never give this job
    # to the isolated Floki runner or inject deployment/signing secrets here.
    permissions:
      contents: write
    environment: windows-stable-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact existing signed candidate without publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          api="https://api.github.com/repos/manufact-test/nomusic"
          get() {
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 --max-filesize "$4" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: $3" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/$1" -o "$2"
          }
          get releases/457091607 "$tmp/owner.json" application/vnd.github+json 1000000
          get releases/457092651 "$tmp/feed.json" application/vnd.github+json 1000000
          node - "$tmp" <<'NODE'
          const fs=require('fs'), assert=require('assert/strict'), p=process.argv[2];
          for(const [file,id,tag,assets] of [
            ['owner.json',457091607,'celikom-windows-v0.24.55-owner-bootstrap',[[788114886,'CELIKOM-Windows-0.24.55.exe',85145078]]],
            ['feed.json',457092651,'celikom-windows-v0.24.55-floki-feed-candidate',[[788118277,'latest.json',851],[788118273,'latest.json.sig',71],[788118274,'manifest-public-key.der',91],[788118276,'manifest.json',851],[788118267,'manifest.json.sig',71]]]
          ]) {
            const x=JSON.parse(fs.readFileSync(p+'/'+file));
            assert.equal(x.id,id);assert.equal(x.tag_name,tag);assert.equal(x.draft,true);assert.equal(x.target_commitish,'61d17d9eb97f3db5c58c906e30da6c19ee737090');
            for(const [id,name,size] of assets)assert(x.assets.some(a=>a.id===id&&a.name===name&&a.size===size));
          }
          NODE
          get releases/assets/788114886 "$tmp/CELIKOM-Windows-0.24.55.exe" application/octet-stream 85145078
          get releases/assets/788118277 "$tmp/latest.json" application/octet-stream 851
          get releases/assets/788118273 "$tmp/latest.json.sig" application/octet-stream 71
          get releases/assets/788118274 "$tmp/manifest-public-key.der" application/octet-stream 91
          get releases/assets/788118276 "$tmp/manifest.json" application/octet-stream 851
          get releases/assets/788118267 "$tmp/manifest.json.sig" application/octet-stream 71
          unset GH_TOKEN
          cd "$tmp"
          printf '%s\n' 'f4c9a7881164ac7a9b5681d9f3568e5cbd3a9915c9e1da7b475caa20d3fb6487  CELIKOM-Windows-0.24.55.exe' '9601539c709a554ec7e1f774756c78e2bfdda148d11ea7dd11946a9a5ec66d1a  latest.json' 'a5974b77e7df9a4fb148445c66fed7ca9ed6f3282b398838991fba8b9efb25c9  latest.json.sig' '46b36bb222154316f2229c35cf65e6c953e0b6524dfb0aad8de05949dc143a95  manifest-public-key.der' | sha256sum -c
          cmp latest.json manifest.json
          cmp latest.json.sig manifest.json.sig
          mkdir -m 700 0.24.55
          mv CELIKOM-Windows-0.24.55.exe manifest.json manifest.json.sig 0.24.55/
          python3 "$GITHUB_WORKSPACE/.github/scripts/windows-stable-private-import.py" pack \
            --source "$tmp" --output "$tmp/transport.zip" --pin "$tmp/manifest-public-key.der" \
            --version 0.24.55 --sequence 2
          echo CELIKOM_WINDOWS_PROTECTED_SOURCE_BUNDLE_VERIFIED
          # No artifact upload, no server credentials, no release mutation.

  windows-private-handoff-quota-probe:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[windows-private-handoff-quota]')
    name: Check existing private Actions transfer capacity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create nonsecret disposable transfer probe
        run: printf 'CELIKOM private handoff probe v1\n' > "$RUNNER_TEMP/celikom-handoff-probe.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-private-handoff-quota-probe
          path: ${{ runner.temp }}/celikom-handoff-probe.txt
          if-no-files-found: error
          retention-days: 1
  windows-private-handoff-receive-probe:
    needs: windows-private-handoff-quota-probe
    name: Verify separate hosted transfer receiver
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: celikom-private-handoff-quota-probe
          path: ${{ runner.temp }}/handoff
      - name: Verify exact payload without using deployment secrets
        run: |
          printf 'CELIKOM private handoff probe v1\n' | cmp - "$RUNNER_TEMP/handoff/celikom-handoff-probe.txt"
          echo CELIKOM_PRIVATE_ACTIONS_HANDOFF_OK
