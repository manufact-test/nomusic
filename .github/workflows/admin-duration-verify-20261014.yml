name: Verify live admin duration warnings
on:
  push:
    branches: [feature/api-range]
    paths: [.github/workflows/admin-duration-verify-20261014.yml]
permissions:
  contents: read
concurrency:
  group: celikom-hostinger-private-test
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only audio duration and silence audit
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          target=u235811320@92.113.19.189
          remote=/home/u235811320/domains/darkred-camel-588676.hostingersite.com/celikom/incoming/duration-audit-${GITHUB_RUN_ID}.php
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$work/key"
          ssh-keygen -y -P '' -f "$work/key" > "$work/public"
          test "$(ssh-keygen -lf "$work/public" -E sha256 | awk '{print $2}')" = 'SHA256:Q6FyifXRq6garceQdIIjBmXhkk81Ic1p/x9JTSYHWUk'
          printf '%s\n' '[92.113.19.189]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAf8M2EVwq0oJI8I9KZ0NFE8P8yDOvDATEhkQti/Kk/0' > "$work/known_hosts"
          opts=(-i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          trap 'ssh -p 65002 "${opts[@]}" "$target" "rm -f '\''$remote'\''" || true; rm -rf "$work"' EXIT
          cat > "$work/audit.php" <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          try {
          $app='/home/u235811320/domains/darkred-camel-588676.hostingersite.com/celikom';
          $release=realpath($app.'/current');
          if($release!==$app.'/releases/0.4.37-b05ddfc858940c0c86979e3af2056f3cafa7dada')throw new RuntimeException('release');
          require $release.'/bootstrap.php';$config=require $release.'/config/app.php';
          $pdo=Celikom\Database\Connection::open($config);$pdo->exec('SET TRANSACTION READ ONLY');$pdo->beginTransaction();
          $panel=new Celikom\Admin\AdminPanel($pdo,new Celikom\Storage\LocalStorageAdapter($config['storage_path']));
          $warning=new ReflectionMethod($panel,'durationWarning');
          foreach([[187520,189544,'длиннее оригинала на 2,024'],[270480,268826,'короче оригинала на 1,654']] as [$o,$a,$text]){
           if(!str_contains($warning->invoke(null,$o,$a),$text))throw new RuntimeException('warning');
          }
          foreach([1500,-1500] as $delta)if($warning->invoke(null,5000,5000+$delta)!=='')throw new RuntimeException('boundary');
          $uploads=new ReflectionMethod($panel,'uploads');
          foreach(['','mismatch','compatible'] as $filter){
          $html=$uploads->invoke($panel,['role'=>'viewer'],str_repeat('0',64),['duration'=>$filter,'per_page'=>'50']);
          if(!str_contains($html,'name="duration"'))throw new RuntimeException('filter');
          if($filter!==''&&!str_contains($html,'value="'.$filter.'" selected'))throw new RuntimeException('selected');
          if($filter==='compatible' && str_contains($html,'class="duration-warning"'))throw new RuntimeException('false_warning');
          }
          $q=$pdo->query("SELECT t.service_track_id,a.duration_ms AS audio_ms,t.duration_ms AS original_ms,r.version FROM tracks t JOIN track_replacements r ON r.track_id=t.id JOIN audio_assets a ON a.id=r.audio_asset_id WHERE t.service_track_id IN ('50163040','48591588') AND r.is_active=1 AND r.status='approved' AND r.disabled_at IS NULL");
          $fixed=$q->fetchAll(PDO::FETCH_ASSOC);if(count($fixed)!==2)throw new RuntimeException('fixed_count');
          foreach($fixed as $r)if(abs((int)$r['audio_ms']-(int)$r['original_ms'])>1500||(int)$r['version']!==3)throw new RuntimeException('fixed');
          $counts=$pdo->query("SELECT COUNT(*) AS total,SUM(ABS(CAST(a.duration_ms AS SIGNED)-CAST(t.duration_ms AS SIGNED))>1500) AS mismatches FROM track_replacements r JOIN tracks t ON t.id=r.track_id JOIN audio_assets a ON a.id=r.audio_asset_id")->fetch(PDO::FETCH_ASSOC);
          $pdo->commit();
          echo json_encode(['read_only'=>true,'release_verified'=>true,'duration_warning_boundaries'=>'PASS','live_upload_filters'=>'PASS','two_repaired_tracks'=>'preserved','total_versions'=>(int)$counts['total'],'mismatches'=>(int)$counts['mismatches']],JSON_THROW_ON_ERROR),"\n";
          }catch(Throwable $e){fwrite(STDERR,'Read-only admin duration verification failed: '.get_class($e)."\n");exit(1);}
          PHP
          scp -P 65002 "${opts[@]}" "$work/audit.php" "$target:$remote"
          ssh -p 65002 "${opts[@]}" "$target" "/opt/alt/php83/usr/bin/php '$remote'"
