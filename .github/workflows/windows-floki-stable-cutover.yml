name: CELIKOM Windows approved stable route cutover
on:
  push:
    branches: [main]
    paths:
      - '.github/deploy/windows-stable-cutover-trigger.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: celikom-windows-stable-cutover
  cancel-in-progress: false
jobs:
  cutover:
    if: github.repository == 'manufact-test/nomusic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: floki-deploy
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the exact existing production approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46084804919" |
            jq -e '.path==".github/workflows/windows-stable-promote-02463.yml" and .head_branch=="main" and .head_sha=="9abc6e1e0ea9e7c3a398fcc1a2f4271375213c56"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46084804919/approvals" |
            jq -e 'any(.[]; .state=="approved" and any(.environments[]?; .name=="windows-stable-production"))' >/dev/null
          echo W194_EXISTING_PRODUCTION_APPROVAL_VERIFIED
      - name: Apply exact approved Windows-only route through existing Floki maintenance
        env:
          FLOKI_DEPLOY_CONNECTION: ${{ secrets.FLOKI_DEPLOY_CONNECTION }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$FLOKI_DEPLOY_CONNECTION" ]]
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          printf '%s\n' "$FLOKI_DEPLOY_CONNECTION" | tr -d '\r' > "$tmp/bundle"
          unset FLOKI_DEPLOY_CONNECTION
          head -n 1 "$tmp/bundle" > "$tmp/known_hosts"
          tail -n +2 "$tmp/bundle" > "$tmp/key"
          rm "$tmp/bundle"
          chmod 600 "$tmp/key" "$tmp/known_hosts"
          grep -Eq '^95\.133\.160\.111 ssh-ed25519 [A-Za-z0-9+/=]+$' "$tmp/known_hosts"
          ssh-keygen -y -P '' -f "$tmp/key" >/dev/null
          sshargs=(-T -i "$tmp/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$tmp/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=20 -o ClearAllForwardings=yes)
          request=.github/deploy/windows-stable-cutover-request.sh
          trigger=.github/deploy/windows-stable-cutover-trigger.txt
          test -f "$request" && test ! -L "$request"
          test -f "$trigger" && grep -Fxq 'CELIKOM_WINDOWS_STABLE_02463_APPROVED_CUTOVER' "$trigger"
          test "$(wc -c < "$request")" -le 131072
          bash -n "$request"
          ssh "${sshargs[@]}" celikom-deploy@95.133.160.111 maintenance < "$request"
