name: CELIKOM Audio A-B catalog preview check
on:
  push:
    branches: [feature/api-range]
    paths: [.github/workflows/celikom-au-preview-research.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect two official song previews without redistribution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error,subprocess,tempfile,pathlib
          for track in [1747791012,1853026725]:
            url=f'https://itunes.apple.com/lookup?id={track}&country=us&entity=song'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'CELIKOM-Owner-Audio-Research/1.0'})
              with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
              a=(data.get('results') or [{}])[-1]
              print(json.dumps({'trackId':track,'title':a.get('trackName'),'artist':a.get('artistName'),'length_ms':a.get('trackTimeMillis'),'preview_available':bool(a.get('previewUrl'))},ensure_ascii=False))
              preview=a.get('previewUrl')
              if preview and preview.startswith('https://'):
                with tempfile.TemporaryDirectory() as d:
                  out=pathlib.Path(d)/'preview'
                  urllib.request.urlretrieve(preview,out)
                  meta=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size:stream=codec_name','-of','json',str(out)])
                  print(json.dumps({'trackId':track,'downloaded_preview':json.loads(meta)},ensure_ascii=False))
            except Exception as e:print(json.dumps({'trackId':track,'unavailable':type(e).__name__,'detail':str(e)[:180]}))
          PY
