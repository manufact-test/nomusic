name: CELIKOM Audio A-B catalog preview check
on:
  push:
    branches: [feature/api-range]
    paths: [.github/workflows/celikom-au-preview-research.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install media inspection tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check numpy scipy
      - name: Compare official previews to unchanged CELIKOM library source
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          printf '%s\n' "$SSH_KEY" > "$temp/id"
          printf '%s\n' "$KNOWN_HOSTS" > "$temp/known"
          chmod 600 "$temp/id" "$temp/known"
          ssh -T -p 65002 -i "$temp/id" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$temp/known" u235811320@92.113.19.189 /opt/alt/php83/usr/bin/php < website/tools/export-au-restored-readonly.php > "$temp/original-source.mp3"
          echo "5dfdfaa97ee6f1168964a1a49a101bebb20bd5dca7147c41c1d2df366a2a00d8  $temp/original-source.mp3" | sha256sum -c
          python3 website/tools/audio-preview-match.py "$temp/original-source.mp3"
