name: android-yandex-web-oneclock
on:
  push:
    branches:
      - feature/android-yandex-web-oneclock-20261109
    paths:
      - 'android/yandex-web-oneclock/**'
      - '.github/workflows/android-oneclock-yandex-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yandex-web-oneclock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/yandex-web-oneclock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK 35
        run: |
          SDK_MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Exact media source and edition tests
        run: node --test tests/test-source.cjs
      - name: Verify reused real CELIKOM Yandex identity adapter
        run: |
          mkdir -p ../../extension/dist/unpacked/player ../../extension/dist/unpacked/adapters
          for src in ../../extension/src/player/*.ts; do
            cp "$src" "../../extension/dist/unpacked/player/$(basename "$src" .ts).js"
          done
          cp app/src/main/assets/celikom-core.js ../../extension/dist/unpacked/player/core.js
          cp app/src/main/assets/celikom-yandex-adapter.js ../../extension/dist/unpacked/adapters/yandex-music-adapter.js
          node --test ../../extension/tests/yandex-adapter.test.mjs
      - name: RFC7233 audio seek and range tests
        run: |
          mkdir -p build/testclasses
          javac -d build/testclasses app/src/main/java/pro/celikom/yandexweb/RangePolicy.java tests/TestRangePolicy.java
          java -cp build/testclasses TestRangePolicy
      - name: Block inherited second-player architecture
        run: |
          if grep -R -E '(new MediaPlayer\(|new AudioTrack\(|new Audio\(|createElement\(["\x27]audio)' app/src/main/java app/src/main/assets/celikom-web-source.js; then
            echo "Unexpected independent playback engine"; exit 1
          fi
          if grep -R -E '(BIND_ACCESSIBILITY_SERVICE|REQUEST_INSTALL_PACKAGES|BIND_NOTIFICATION_LISTENER_SERVICE|MANAGE_EXTERNAL_STORAGE)' app/src/main/AndroidManifest.xml; then
            echo "Unexpected high risk permission"; exit 1
          fi
      - name: Compile independent rootless Android client
        run: gradle --no-daemon :app:assembleDebug
      - name: Record APK digest
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-yandex-web-oneclock-preview-not-yet-device-validated
          path: android/yandex-web-oneclock/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
