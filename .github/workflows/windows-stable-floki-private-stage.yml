name: CELIKOM Windows private signed FlokiNET handoff
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact signed Windows version
        required: true
        type: string
        default: '0.24.57'
      sequence:
        description: Exact monotonic signed sequence
        required: true
        type: string
        default: '4'
      source_commit:
        description: Exact source commit of the two immutable private drafts
        required: true
        type: string
        default: '28587670e9efda35c73eb3a49d9702d2d72b3b8c'
      send_to_private_intake:
        description: Legacy compatibility input; safe Floki spool only
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sequence:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      send_to_private_intake:
        required: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/ci/celikom-windows-private-stage-trigger.txt'
permissions:
  contents: read
concurrency:
  group: celikom-windows-private-floki-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'manufact-test/nomusic' && github.ref == 'refs/heads/main'
    runs-on: celikom-ci-smoke-only
    # Data-only transfer: no deployment environment, SSH, signing secret or
    # publication permission. The VPS root consumer independently verifies
    # the P-256 signature, sequence and complete payload before owner promotion.
    permissions:
      contents: read
    timeout-minutes: 18
    env:
      RELEASE_VERSION: ${{ inputs.version || '0.24.56' }}
      RELEASE_SEQUENCE: ${{ inputs.sequence || '3' }}
      RELEASE_COMMIT: ${{ inputs.source_commit || '3c743332d134618fd4bba39ee826e833f39aa54c' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact signed drafts and offline extraction/runner spool safety contracts
        run: |
          python3 .github/scripts/tests/windows-stable-floki-draft-source.test.py
          python3 .github/scripts/tests/floki-windows-signed-spool.test.py
          python3 .github/scripts/tests/floki-windows-signed-root-consumer.test.py
          python3 -m py_compile .github/scripts/floki-windows-signed-root-consumer.py
          bash -n .github/scripts/floki-windows-owner-download-bootstrap.sh
          bash -n .github/scripts/floki-windows-root-consumer-install.sh
          node --test .github/scripts/tests/windows-stable-private-import.test.mjs
      - name: Download exact P-256 signed draft and persist in isolated Floki runner spool
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/celikom-windows-private-stage"
          trap 'rm -rf -- "$RUNNER_TEMP/celikom-windows-private-stage"' EXIT
          bundle="$RUNNER_TEMP/celikom-windows-private-stage/transfer.zip"
          python3 .github/scripts/windows-stable-floki-draft-source.py --version "$RELEASE_VERSION" \
            --sequence "$RELEASE_SEQUENCE" --commit "$RELEASE_COMMIT" --output "$bundle"
          unset GH_TOKEN
          python3 .github/scripts/floki-windows-signed-spool.py --bundle "$bundle" \
            --version "$RELEASE_VERSION" --sequence "$RELEASE_SEQUENCE"
          echo CELIKOM_WINDOWS_IMMUTABLE_SIGNED_DATA_STAGED_NO_SSH_NO_PUBLICATION
