name: CELIKOM Windows approval-gated Floki stable promotion
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sequence:
        required: true
        type: string
      source_commit:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: celikom-windows-stable-floki-promotion-${{ inputs.version || '0.24.64' }}
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'manufact-test/nomusic' && github.ref == 'refs/heads/main'
    runs-on: celikom-ci-smoke-only
    environment: windows-stable-production
    # This transfer is consumed by the Floki root timer, which updates the
    # local stable feed and owner download. Public route reach is verified separately.
    # GitHub draft-release asset reads require contents:write for GITHUB_TOKEN.
    # This token is exposed only to the exact-asset GET downloader below; no
    # release mutation, signing secret, SSH credential or production publish.
    permissions:
      contents: write
    timeout-minutes: 18
    env:
      RELEASE_VERSION: ${{ inputs.version || '0.24.64' }}
      RELEASE_SEQUENCE: ${{ inputs.sequence || '11' }}
      RELEASE_COMMIT: ${{ inputs.source_commit || '28587670e9efda35c73eb3a49d9702d2d72b3b8c' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact signed drafts and offline extraction/runner spool safety contracts
        run: |
          python3 .github/scripts/tests/windows-stable-floki-draft-source.test.py
          python3 .github/scripts/tests/floki-windows-signed-spool.test.py
          python3 .github/scripts/tests/floki-windows-signed-root-consumer.test.py
          python3 -m py_compile .github/scripts/floki-windows-signed-root-consumer.py
          bash -n .github/scripts/floki-windows-owner-download-bootstrap.sh
          bash -n .github/scripts/floki-windows-root-consumer-install.sh
          node --test .github/scripts/tests/windows-stable-private-import.test.mjs
      - name: Download exact signed transfer artifact from calling release workflow
        uses: actions/download-artifact@v4
        with:
          name: CELIKOM-Windows-P256-transfer-${{ inputs.version }}-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/celikom-windows-private-stage
      - name: Persist approved signed transfer for Floki root stable promotion
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          bundle="$RUNNER_TEMP/celikom-windows-private-stage/CELIKOM-Windows-P256-transfer.zip"
          test -f "$bundle" && test ! -L "$bundle"
          python3 .github/scripts/floki-windows-signed-spool.py --bundle "$bundle" \
            --version "$RELEASE_VERSION" --sequence "$RELEASE_SEQUENCE"
          echo CELIKOM_WINDOWS_APPROVED_SIGNED_DATA_STAGED_FOR_ROOT_STABLE_PROMOTION
