name: CELIKOM A1 native ARM13 honest OWN source-stamp feasibility (not publisher impersonation)
on:
  push:
    branches: [experiment/android-a1-2025-self-stamp-causal-arm13-20261112]
    paths:
      - '.github/workflows/android-a1-2025-honest-own-source-stamp-arm13.yml'
      - 'android/native-yandex-hooklab/ci/owner_2025_self_stamp_causal_arm13.py'
      - 'android/native-yandex-hooklab/ci/test_owner_2025_self_stamp_causal.py'
      - 'android/native-yandex-hooklab/ci/owner_2025_signature_permission_comparison.py'
      - 'android/native-yandex-hooklab/ci/test_owner_2025_signature_permission_comparison.py'
      - 'android/native-yandex-hooklab/clone_main_crash_buffer.py'
permissions:
  contents: write
jobs:
  honest-own-stamp-vendor-signed-vs-unique-own-stamp:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 46
    env:
      CELIKOM_CLEAN_ANDROID_NATIVE_REDDROID: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic evidence gates, no third-party binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p 'test_owner_2025_self_stamp_causal.py' -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p 'test_owner_2025_signature_permission_comparison.py' -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p 'test_owner_2025_paired_signing_verdict.py' -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p 'test_own_key_full_payload_identity_gate.py' -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_clone_main_crash_buffer.py' -v
          python3 -B -m py_compile android/native-yandex-hooklab/ci/owner_2025_self_stamp_causal_arm13.py
      - name: Obtain preexisting unpublished pinned source and strict authenticity gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = manufact-test/nomusic ]
          [ "$GITHUB_REF_NAME" = experiment/android-a1-2025-self-stamp-causal-arm13-20261112 ]
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' | grep -qx 442137464
          gh api "repos/$GITHUB_REPOSITORY/releases/442137464/assets?per_page=100" --jq '.[] | select(.id == 736739728 and .name == "yandex-music-2025-10-4-120-1gpr.xapk" and .size == 45961661 and .digest == "sha256:8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053") | .id' | grep -qx 736739728
          mkdir -p "$RUNNER_TEMP/celikom-own-source-stamp"
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" --pattern yandex-music-2025-10-4-120-1gpr.xapk --dir "$RUNNER_TEMP/celikom-own-source-stamp" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-own-source-stamp/yandex-music-2025-10-4-120-1gpr.xapk"
          [ "$(stat -c %s "$f")" = 45961661 ]
          [ "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053 ]
      - name: Set up official Google SDK35 Java apksigner SOURCE STAMP with pinned archive hashes
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          sudo timeout 130 apt-get update -qq
          sudo timeout 100 env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner zipalign ca-certificates unzip
          zip="$RUNNER_TEMP/official-build-tools-r35-linux.zip"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 160 --silent --show-error \
            https://dl.google.com/android/repository/build-tools_r35_linux.zip -o "$zip"
          [ "$(stat -c %s "$zip")" = 61958799 ]
          [ "$(sha256sum "$zip" | cut -d' ' -f1)" = bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88 ]
          [ "$(sha1sum "$zip" | cut -d' ' -f1)" = 2cfaa0bbb2336e9ec18ed3ecea84fa2e2af607bc ]
          sdk="$RUNNER_TEMP/celikom-own-source-stamp-sdk"
          mkdir -p "$sdk/build-tools/35.0.0/lib"
          python3 - "$zip" "$sdk/build-tools/35.0.0/lib/apksigner.jar" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              candidates=[name for name in z.namelist() if name.endswith("/lib/apksigner.jar")]
              assert len(candidates)==1,"OFFICIAL_APKSIGNER_JAR_COUNT_DRIFT"
              with open(sys.argv[2],"wb") as dest:
                  dest.write(z.read(candidates[0]))
          PY
          cat > "$sdk/build-tools/35.0.0/apksigner" <<'SH'
          #!/bin/sh
          exec java -jar "$(dirname "$0")/lib/apksigner.jar" "$@"
          SH
          chmod +x "$sdk/build-tools/35.0.0/apksigner"
          ln -sf "$(command -v aapt)" "$sdk/build-tools/35.0.0/aapt"
          ln -sf "$(command -v zipalign)" "$sdk/build-tools/35.0.0/zipalign"
          "$sdk/build-tools/35.0.0/apksigner" sign --help | grep -F -- '--stamp-signer' >/dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo '{"official_google_sdk35_java_signer_sha256_pinned":true,"own_source_stamp_supported":true}'
      - name: Boot one truly native ARM64 plus ARMv7 Android 13 clean guest
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          bash android/native-yandex-hooklab/ci/native_arm_redroid_boot_only.sh
          [ "$(docker exec celikom-native-arm-android13 getprop sys.boot_completed)" = 1 ]
          [ "$(docker exec celikom-native-arm-android13 getprop ro.build.version.sdk)" = 33 ]
      - name: Genuine issuer native 75s then own-signed and own-verified SOURCE STAMP 75s
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/owner_2025_self_stamp_causal_arm13.py --xapk "$RUNNER_TEMP/celikom-own-source-stamp/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Erase all source, own keys, self-stamped APKs and guest data; no artifacts
        if: always()
        shell: bash
        run: |
          docker stop celikom-native-arm-android13 >/dev/null 2>&1 || true
          sudo umount /dev/binderfs >/dev/null 2>&1 || true
          sudo modprobe -r binder_linux >/dev/null 2>&1 || true
          sudo rm -rf -- "$RUNNER_TEMP/celikom-redroid-data"
          rm -rf -- "$RUNNER_TEMP/celikom-own-source-stamp" "$RUNNER_TEMP/celikom-own-source-stamp-sdk" "$RUNNER_TEMP/official-build-tools-r35-linux.zip"
          echo '{"no_publisher_source_stamp_spoofing":true,"own_stamp_key_erased":true,"third_party_apk_distributed":false,"owner_phone_touched":false,"stage_a":"NO_GO"}'
