name: CELIKOM A1 verified 2025 native audio entrypoints inventory only
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - 'android/native-yandex-hooklab/ci/a1_private_2025_audio_entrypoints.py'
      - 'android/native-yandex-hooklab/ci/test_a1_private_2025_audio_entrypoints.py'
      - '.github/workflows/android-a1-2025-audio-entrypoints-readonly.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publisher-2025-audio-public-apis-readonly:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic public API classification first
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = manufact-test/nomusic
          test "$GITHUB_REF_NAME" = experiment/android-a1-metrica-init-state-observer-arm13-20261112
          python3 -B -m py_compile android/native-yandex-hooklab/ci/a1_private_2025_audio_entrypoints.py
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_a1_private_2025_audio_entrypoints.py -v
      - name: Install only verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 120 apt-get update -qq
          sudo timeout 120 env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner
      - name: Get only pinned 2025 private original and verify hash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/celikom-2025-audio-public-api"
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" \
            --pattern yandex-music-2025-10-4-120-1gpr.xapk \
            --dir "$RUNNER_TEMP/celikom-2025-audio-public-api" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-2025-audio-public-api/yandex-music-2025-10-4-120-1gpr.xapk"
          test "$(stat -c %s "$f")" = 45961661
          test "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053
      - name: Classify exact signed 2025 public media interface references without exposing source
        shell: bash
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/a1_private_2025_audio_entrypoints.py \
            --xapk "$RUNNER_TEMP/celikom-2025-audio-public-api/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Remove original files and verification data
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/celikom-2025-audio-public-api"
          echo '{"original_binary_published":false,"original_binary_modified":false,"audio_or_account_tested":false,"user_handset_touched":false}'
