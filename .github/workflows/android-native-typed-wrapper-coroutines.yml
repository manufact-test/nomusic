name: Android original-signed FileInfo typed wrappers and coroutines (READ-ONLY)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - 'android/native-yandex-hooklab/audit_native_typed_wrapper_coroutines.py'
      - 'android/native-yandex-hooklab/tests/test_native_typed_wrapper_coroutines.py'
      - '.github/workflows/android-native-typed-wrapper-coroutines.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-wrapper-coroutine-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit test exact descriptors and register argument paths
        run: |
          set -eu
          python3 -m py_compile android/native-yandex-hooklab/audit_native_typed_wrapper_coroutines.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_native_typed_wrapper_coroutines.py' -v
      - name: Analyze pinned original signed five APK six DEX without modifications
        run: python3 android/native-yandex-hooklab/audit_native_typed_wrapper_coroutines.py
      - name: Assert no external APK binaries or media artifacts
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'Audit complete; no signed APK, bytecode, credentials or audio exported'
