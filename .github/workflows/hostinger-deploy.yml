name: Deploy Hostinger private test

on:
  workflow_dispatch:
  push:
    branches: [develop, feature/api-range, experiment/windows-w98-integrated-gain-and-original-vpn-20261113]
    paths:
      - .github/deploy/hostinger-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: celikom-hostinger-private-test
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-mysql
          MYSQL_DATABASE: celikom_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-mysql"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: celikom_test
      DB_USER: root
      DB_PASSWORD: ci-disposable-mysql
      STORAGE_PATH: /tmp/celikom-ci-private-audio
      REQUIRE_BROWSER_AUDIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo
          coverage: none
      - run: npm ci
      - name: Check deployment syntax and configuration encoding
        run: |
          bash -n .github/scripts/hostinger-deploy.sh
          bash -n .github/scripts/hostinger-activate.sh
          bash -n .github/scripts/hostinger-stage7-owner.sh
          php -l .github/scripts/hostinger-stage7-owner-remote.php
          bash -n .github/scripts/hostinger-user-feedback-audit.sh
          php -l .github/scripts/hostinger-user-feedback-audit.php
          php -l .github/scripts/hostinger-stage5-remote.php
          php .github/scripts/tests/hostinger-stage5-inventory.test.php
          bash -n .github/scripts/hostinger-admin-gain-ux-audit.sh
          php -l .github/scripts/hostinger-admin-gain-ux-audit.php
          php server/tests/deployment-env.php
          node .github/scripts/tests/hostinger-activate.mjs
      - name: Install CI-only MP3 encoder for Stage 7 regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -F libmp3lame
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify pinned Chrome binary
        env:
          CELIKOM_BROWSER_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          test -x "$CELIKOM_BROWSER_BINARY"
          "$CELIKOM_BROWSER_BINARY" --version
      - name: Verify application and create the server package
        env:
          CELIKOM_BROWSER_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run ci
      - uses: actions/upload-artifact@v4
        with:
          name: hostinger-server-${{ github.sha }}
          path: dist/celikom-server-*.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-mysql
          MYSQL_DATABASE: celikom_restore
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-mysql"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: hostinger-server-${{ github.sha }}
          path: dist
      - name: Require the explicitly authorized owner account before any live deployment
        env:
          CELIKOM_W98_TEST_EMAIL: ${{ secrets.CELIKOM_W98_TEST_EMAIL }}
        run: |
          if [[ -z "${CELIKOM_W98_TEST_EMAIL:-}" || ${#CELIKOM_W98_TEST_EMAIL} -gt 254 ]]; then
            echo 'W98_OWNER_ACCOUNT_SECRET_MISSING_OR_INVALID'
            exit 2
          fi
          echo 'W98_OWNER_ACCOUNT_SECRET_PRESENT'
      - name: Snapshot existing private data before additive migration
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          node -e 'require("fs").writeFileSync(".github/deploy/hostinger-stage5-request.json",JSON.stringify({operation:"snapshot"}))'
          bash .github/scripts/hostinger-stage5.sh
      - name: Deploy only to the dedicated CELIKOM website
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_DB_PASSWORD: ${{ secrets.HOSTINGER_DB_PASSWORD }}
        run: bash .github/scripts/hostinger-deploy.sh
      - name: Verify administrative bulk quota on the live database without writes
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if node -e "process.exit(require('./.github/deploy/hostinger-request.json').request.startsWith('bulk-upload-')?0:1)"; then
            bash -n .github/scripts/hostinger-bulk-upload-verify.sh
            bash .github/scripts/hostinger-bulk-upload-verify.sh
          fi
      - name: Verify preserved data and restore new snapshot in isolated MySQL
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          node -e 'require("fs").writeFileSync(".github/deploy/hostinger-stage5-request.json",JSON.stringify({operation:"audit"}))'
          bash .github/scripts/hostinger-stage5.sh
          node -e 'require("fs").writeFileSync(".github/deploy/hostinger-stage5-request.json",JSON.stringify({operation:"snapshot"}))'
          bash .github/scripts/hostinger-stage5.sh
          node -e 'require("fs").writeFileSync(".github/deploy/hostinger-stage5-request.json",JSON.stringify({operation:"restore-drill"}))'
          bash .github/scripts/hostinger-stage5.sh
      - name: Preserve existing Stage 7 credentials during Stage 8 rollout
        id: owner_gate
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          echo "skip_owner_rotation=true" >> "$GITHUB_OUTPUT"
          echo "Routine rollout: existing owner upload token and flags preserved."
      - name: Deliver only encrypted owner credential
        if: ${{ steps.owner_gate.outputs.skip_owner_rotation == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: stage7-owner-access-encrypted-${{ github.sha }}
          path: dist/stage7-owner-access/owner-token.encrypted
          if-no-files-found: error
          retention-days: 1
      - name: Verify feedback sections, grouped demand and preserved approved audio read-only
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if node --input-type=module -e "import fs from 'node:fs';process.exit(JSON.parse(fs.readFileSync('.github/deploy/hostinger-request.json')).request.startsWith('user-feedback')?0:1)"; then
            bash .github/scripts/hostinger-user-feedback-audit.sh
          else
            if node --input-type=module -e "import fs from 'node:fs';process.exit(JSON.parse(fs.readFileSync('.github/deploy/hostinger-request.json')).request.startsWith('admin-gain-ux')?0:1)"; then
              bash .github/scripts/hostinger-admin-gain-ux-audit.sh
            else
              echo 'Feedback-specific read-only audit not selected for this deployment.'
            fi
          fi

  windows-gain-stage:
    name: Stage private Windows gain sidecars and verify signed Range
    needs: deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install private offline audio renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Validate private staging scripts
        run: |
          bash -n .github/scripts/hostinger-windows-gain-stage.sh
          grep -F 'W98_COPY_TARGET_ALREADY_PREFIXED' .github/scripts/hostinger-windows-gain-stage.sh
          grep -F 'copy_to_remote "$work/manifest.json" "$manifest_remote"' .github/scripts/hostinger-windows-gain-stage.sh
          php -l .github/scripts/hostinger-windows-gain-remote.php
          php -l server/bin/windows-gain-stage.php
          php -l server/bin/windows-gain-rollback.php
      - name: Stage every active nonzero-gain replacement and verify real entitled HTTPS Range for the owner
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          CELIKOM_W98_TEST_EMAIL: ${{ secrets.CELIKOM_W98_TEST_EMAIL }}
        run: bash .github/scripts/hostinger-windows-gain-stage.sh

  windows-final-qa:
    name: Build one final CELIKOM Windows 0.24.36 QA installer and ZIP
    needs: windows-gain-stage
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact-commit full Windows integration CI success
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/windows-w98-integration-ci.yml/runs?head_sha=$env:GITHUB_SHA&per_page=10"
          $deadline = (Get-Date).AddMinutes(30)
          while ($true) {
            $data = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            $run = $data.workflow_runs |
              Where-Object { $_.head_sha -eq $env:GITHUB_SHA -and $_.head_branch -eq 'experiment/windows-w98-integrated-gain-and-original-vpn-20261113' } |
              Sort-Object created_at -Descending |
              Select-Object -First 1
            if ($run -and $run.status -eq 'completed') {
              if ($run.conclusion -ne 'success') { throw 'W98_REQUIRED_WINDOWS_CI_FAILED' }
              Write-Host "W98_EXACT_COMMIT_WINDOWS_CI_PASS run=$($run.id)"
              break
            }
            if ((Get-Date) -ge $deadline) { throw 'W98_REQUIRED_WINDOWS_CI_TIMEOUT' }
            Start-Sleep -Seconds 20
          }
      - name: Build W23 native source bundle
        shell: pwsh
        working-directory: windows-companion/w23
        run: |
          npm install --no-audit --no-fund --no-package-lock
          if ($LASTEXITCODE -ne 0) { throw 'W98_W23_NPM_FAILED' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'W98_W23_BUILD_FAILED' }
          $nativeHost=Get-Content dist/host.cjs -Raw
          if ($nativeHost -notmatch 'CELIKOM_NATIVE_VERSION = "0.24.29"' -or
              $nativeHost -notmatch 'PLAYER_DECODER_CELIKOM_SOURCE_MATCHED' -or
              $nativeHost -notmatch 'NATIVE_ORIGINAL_SOURCE_NO_RELOAD' -or
              $nativeHost -notmatch 'NATIVE_REPLACEMENT_SOURCE_RELOAD') {
            throw 'W98_NATIVE_SOURCE_GUARDS_MISSING'
          }
      - name: W22/W23/W60 original-source, VPN, 403 and audio regressions
        shell: pwsh
        run: |
          node --test windows-companion/w22/native-resource-adapter.test.mjs windows-companion/w23/transient-source-recovery.test.mjs windows-companion/w23/deferred-track-recovery.test.mjs windows-companion/w23/renderer-relay.test.mjs windows-companion/w23/native-host.test.mjs windows-companion/w60/current-source-refresh.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'W98_AUDIO_REGRESSION' }
      - name: W21 crash rollback and unknown updater refusal
        run: dotnet run --project windows-companion/w21/Celikom.Recovery.Tests/Celikom.Recovery.Tests.csproj -c Release
      - name: W24 reviewed catalog and ASAR builder
        run: dotnet run --project windows-companion/w24/Celikom.NativeInstaller.Tests/Celikom.NativeInstaller.Tests.csproj -c Release
      - name: W15 entitlement, login, updater and native state tests
        run: dotnet run --project windows-companion/w15/Celikom.Companion.Tests/Celikom.Companion.Tests.csproj -c Release
      - name: Compile GUI with warnings as errors
        run: dotnet build windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj -c Release -warnaserror
      - name: Verify installer only replaces CELIKOM files
        shell: pwsh
        run: |
          & ./windows-companion/w20/release-gate.ps1 -Mode Stage
          if ($LASTEXITCODE -notin @(0,$null)) { throw 'W98_STAGE_GATE_FAILED' }
      - name: Publish GUI 0.24.36
        shell: pwsh
        run: |
          dotnet publish windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o windows-companion/w20/publish
          if ($LASTEXITCODE -ne 0) { throw 'W98_PUBLISH_FAILED' }
      - name: Build final 0.24.36 QA installer; do not install on owner computer
        shell: pwsh
        run: |
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress --limit-output
            if ($LASTEXITCODE -notin @(0,3010)) { throw 'W98_INNO_SETUP_UNAVAILABLE' }
          }
          & $compiler windows-companion/w20/installer/CELIKOM.iss
          if ($LASTEXITCODE -ne 0) { throw 'W98_INNO_BUILD_FAILED' }
          $setup='windows-companion/w20/output/CELIKOM-W100-WINDOWS-02436-INTEGRATED-QA-TEST-UNSIGNED.exe'
          if (!(Test-Path $setup)) { throw 'W98_INSTALLER_MISSING' }
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $setup).Path)
          if ($info.FileVersion.Trim() -ne '0.24.36.0' -or $info.ProductName.Trim() -ne 'CELIKOM') { throw 'W98_VERSION_MISMATCH' }
      - name: Update ZIP valid for the in-app updater
        shell: pwsh
        run: |
          $setup='windows-companion/w20/output/CELIKOM-W100-WINDOWS-02436-INTEGRATED-QA-TEST-UNSIGNED.exe'
          $zip=Join-Path $env:RUNNER_TEMP 'CELIKOM-Windows-0.24.36-INTEGRATED-QA-TEST.zip'
          $zipStage=Join-Path $env:RUNNER_TEMP 'CELIKOM-UPDATE-PACKAGE'
          New-Item -ItemType Directory -Force -Path $zipStage | Out-Null
          $packageExe='CELIKOM-W100-WINDOWS-02436-INTEGRATED-QA-TEST-UNSIGNED.exe'
          Copy-Item -LiteralPath $setup -Destination (Join-Path $zipStage $packageExe)
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $zipStage '*') -DestinationPath $zip
          $env:CELIKOM_UPDATE_TEST_PACKAGE=$zip
          dotnet run --project windows-companion/w15/Celikom.Companion.Tests/Celikom.Companion.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'W98_UPDATE_ZIP_TEST_FAILED' }
      - uses: actions/download-artifact@v4
        with:
          name: CELIKOM-W89-VPN-FAST-RECOVERY-TRACK-FIX-TEST-UNSIGNED
          run-id: 43429303326
          repository: manufact-test/nomusic
          github-token: ${{ github.token }}
          path: previous-W89
      - name: In-place 0.24.33 to 0.24.36 upgrade; preserve DPAPI and install only CELIKOM assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $old=(Resolve-Path 'previous-W89/CELIKOM-W89-VPN-FAST-RECOVERY-TRACK-FIX-TEST-UNSIGNED.exe').Path
          $new=(Resolve-Path 'windows-companion/w20/output/CELIKOM-W100-WINDOWS-02436-INTEGRATED-QA-TEST-UNSIGNED.exe').Path
          if ((Get-FileHash $old -Algorithm SHA256).Hash -ne '414EDBA856A12B25CB3EDE26D136C7F263CFC02FC3448730C7F7D02D60791879') { throw 'W98_PREVIOUS_EXE_HASH_UNTRUSTED' }
          $app=Join-Path $env:LOCALAPPDATA 'Programs\CELIKOM'
          $exe=Join-Path $app 'CELIKOM.Companion.exe'
          $native=Join-Path $app 'integration'
          $state=Join-Path $env:LOCALAPPDATA 'CELIKOM\Windows'
          $session=Join-Path $state 'session.dpapi'
          $vendor=Join-Path $env:LOCALAPPDATA 'Programs\YandexMusic'
          if ((Test-Path $app) -or (Test-Path $vendor)) { throw 'W98_DIRTY_RUNNER' }
          $p=Start-Process $old -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $exe)) { throw 'W98_PREVIOUS_SETUP_FAILED' }
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion.Trim() -ne '0.24.33.0') { throw 'W98_PREVIOUS_VERSION_MISMATCH' }
          $hostBefore=(Get-FileHash (Join-Path $native 'host.cjs') -Algorithm SHA256).Hash
          $rendererBefore=(Get-FileHash (Join-Path $native 'renderer.js') -Algorithm SHA256).Hash
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          $sealed=[Security.Cryptography.ProtectedData]::Protect([Text.Encoding]::UTF8.GetBytes('W98_SAVED_LOGIN_PRESERVED'),$null,[Security.Cryptography.DataProtectionScope]::CurrentUser)
          [IO.File]::WriteAllBytes($session,$sealed)
          $sessionBefore=(Get-FileHash $session -Algorithm SHA256).Hash
          $p=Start-Process $new -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $exe)) { throw 'W98_INPLACE_SETUP_FAILED' }
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion.Trim() -ne '0.24.36.0') { throw 'W98_NEW_VERSION_MISMATCH' }
          if ((Get-FileHash $session -Algorithm SHA256).Hash -ne $sessionBefore) { throw 'W98_DPAPI_CHANGED' }
          $plain=[Text.Encoding]::UTF8.GetString([Security.Cryptography.ProtectedData]::Unprotect([IO.File]::ReadAllBytes($session),$null,[Security.Cryptography.DataProtectionScope]::CurrentUser))
          if ($plain -ne 'W98_SAVED_LOGIN_PRESERVED') { throw 'W98_DPAPI_UNDECRYPTABLE' }
          $hostAfter=(Get-FileHash (Join-Path $native 'host.cjs') -Algorithm SHA256).Hash
          $rendererAfter=(Get-FileHash (Join-Path $native 'renderer.js') -Algorithm SHA256).Hash
          if ($hostAfter -eq $hostBefore -or $rendererAfter -eq $rendererBefore) { throw 'W98_NATIVE_PATCH_NOT_DELIVERED' }
          $rendererScript=Get-Content (Join-Path $native 'renderer.js') -Raw
          if ($rendererScript -notmatch '__celikomBridgeNativeRefreshUnfetched' -or
              $rendererScript -notmatch '__celikomBridgeNativeRecoverSourceLeft' -or
              $rendererScript -notmatch 'SOURCE_LEFT_CURRENT_RECOVERY_SCHEDULED') {
            throw 'W99_RENDERER_SOURCE_GUARD_MISSING'
          }
          $hostScript=Get-Content (Join-Path $native 'host.cjs') -Raw
          if ($hostScript -notmatch 'PLAYER_DECODER_CELIKOM_SOURCE_MATCHED' -or
              $hostScript -notmatch 'NATIVE_ORIGINAL_SOURCE_NO_RELOAD' -or
              $hostScript -notmatch 'CELIKOM_NATIVE_VERSION = "0.24.29"') {
            throw 'W98_NATIVE_HOST_NOT_INSTALLED'
          }
          if ((Test-Path (Join-Path $app 'unins001.exe')) -or !(Test-Path (Join-Path $app 'unins000.exe')) -or (Test-Path $vendor)) { throw 'W98_VENDOR_OR_APPID_CHANGED' }
          Write-Host 'W99_02433_TO_02436_INPLACE_DPAPI_AND_NEW_NATIVE_READY_PASS'
      - name: Create final EXE, update ZIP and SHA256 manifest
        shell: pwsh
        run: |
          $exe='windows-companion/w20/output/CELIKOM-W100-WINDOWS-02436-INTEGRATED-QA-TEST-UNSIGNED.exe'
          $zip=Join-Path $env:RUNNER_TEMP 'CELIKOM-Windows-0.24.36-INTEGRATED-QA-TEST.zip'
          $check=Join-Path $env:RUNNER_TEMP 'W98-ZIP-CHECK'
          Expand-Archive -Path $zip -DestinationPath $check -Force
          $inside=Join-Path $check 'CELIKOM-W100-WINDOWS-02436-INTEGRATED-QA-TEST-UNSIGNED.exe'
          if (!(Test-Path $inside)) { throw 'W98_ZIP_CONTENT_MISSING' }
          $exeHash=(Get-FileHash $exe -Algorithm SHA256).Hash
          $insideHash=(Get-FileHash $inside -Algorithm SHA256).Hash
          if ($exeHash -ne $insideHash) { throw 'W98_ZIP_EXE_HASH_MISMATCH' }
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash
          New-Item -ItemType Directory -Force -Path 'dist/CELIKOM-Windows-0.24.36-INTEGRATED-QA-TEST' | Out-Null
          $out='dist/CELIKOM-Windows-0.24.36-INTEGRATED-QA-TEST'
          Copy-Item $exe $out
          Copy-Item $zip $out
          @("$exeHash  CELIKOM-W100-WINDOWS-02436-INTEGRATED-QA-TEST-UNSIGNED.exe","$zipHash  CELIKOM-Windows-0.24.36-INTEGRATED-QA-TEST.zip") | Set-Content -Path "$out/SHA256SUMS.txt" -Encoding ascii
          Write-Host "W98_EXE_SHA256=$exeHash"
          Write-Host "W98_ZIP_SHA256=$zipHash"
      - name: Upload the single final QA package
        uses: actions/upload-artifact@v4
        with:
          name: CELIKOM-Windows-W100-0.24.36-INTEGRATED-QA-TEST
          path: dist/CELIKOM-Windows-0.24.36-INTEGRATED-QA-TEST/*
          if-no-files-found: error
          retention-days: 30

  publish-windows-test:
    name: Publish verified Windows QA package to Hostinger Test folder
    needs: windows-final-qa
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CELIKOM-Windows-W98-0.24.36-INTEGRATED-QA-TEST
          path: dist/CELIKOM-Windows-0.24.36-INTEGRATED-QA-TEST
      - name: Verify checksums and publish exact files to /CELIKOM/Windows/Test/
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: bash .github/scripts/hostinger-windows-qa-publish.sh dist/CELIKOM-Windows-0.24.36-INTEGRATED-QA-TEST
