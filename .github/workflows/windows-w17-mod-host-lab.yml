name: CELIKOM W17 PulseSync mod host isolated validation
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/windows-companion-integration-20261108
    paths:
      - .github/workflows/windows-w17-mod-host-lab.yml
permissions: {}
jobs:
  isolated-host:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check native host and PulseSync mod with rollback in disposable Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'celikom-w17-disposable'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $report = [ordered]@{
            label = 'W17_WINDOWS_SERVER_2022_MOD_TRIAL'
            notes = 'No user account, no playback. CI cannot evaluate SmartScreen GUI reputation.'
            os = [Environment]::OSVersion.VersionString
            defender = 'UNKNOWN'
            officialInstaller = 'NOT_RUN'
            officialSignature = 'NOT_RUN'
            officialAsar = 'NOT_RUN'
            clientRelease = 'NOT_RUN'
            modRelease = 'NOT_RUN'
            yandexInstall = 'NOT_RUN'
            clientInstall = 'NOT_RUN'
            audio = 'NOT_TESTED'
          }
          $reportPath = Join-Path $root 'W17-result.json'
          function Save-Status { $report | ConvertTo-Json -Depth 8 | Set-Content -Path $reportPath -Encoding utf8 }
          function Download-Pinned([string]$url,[string]$name,[string]$sha) {
            $file = Join-Path $root $name
            for($i=0;$i -lt 3;$i++){
              try {
                if($url.StartsWith('https://api.github.com/')) {
                  $headers = @{ Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'CELIKOM-W16-Disposable' }
                  Invoke-WebRequest -Uri $url -Headers $headers -OutFile $file -UseBasicParsing -TimeoutSec 240 -MaximumRedirection 6
                } else {
                  Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing -TimeoutSec 240 -MaximumRedirection 6
                }
                break
              } catch {
                if($i -eq 2){throw}
                Start-Sleep -Seconds 6
              }
            }
            if(!(Test-Path $file) -or (Get-Item $file).Length -lt 100000){throw "EMPTY_DOWNLOAD_$name"}
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -and $actual -ne $sha){throw "UNEXPECTED_DIGEST_$name"}
            return [pscustomobject]@{path=$file;sha=$actual;bytes=(Get-Item $file).Length}
          }
          try {
            try {
              $mp = Get-MpComputerStatus -ErrorAction Stop
              $protected = $mp.AntivirusEnabled -eq $true -and $mp.RealTimeProtectionEnabled -eq $true
              if($mp.AntivirusEnabled -eq $true -and !$protected) {
                # The hosted runner comes with Defender realtime OFF. Turn it ON,
                # not off. If policy blocks activation, refuse all installers.
                try {
                  Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop
                  Start-Sleep -Seconds 7
                  $mp = Get-MpComputerStatus -ErrorAction Stop
                } catch { $report.notes = 'Cannot enable Defender realtime on disposable runner' }
                $protected = $mp.AntivirusEnabled -eq $true -and $mp.RealTimeProtectionEnabled -eq $true
              }
              $report.defender = "antivirus=$($mp.AntivirusEnabled);realtime=$($mp.RealTimeProtectionEnabled)"
            } catch {
              $protected = $false
              $report.defender = "UNAVAILABLE"
            }
            Save-Status
            if(!$protected){
              $report.yandexInstall = 'SAFE_STOP_HOSTED_DEFENDER_STILL_OFF'
              Save-Status
              exit 0
            }
            $original = Download-Pinned 'https://desktop.app.music.yandex.net/stable/Yandex_Music_x64_5.126.1.exe' 'Yandex_Music_x64_5.126.1.exe' ''
            $sig = Get-AuthenticodeSignature -FilePath $original.path
            $report.officialInstaller = "sha256=$($original.sha);bytes=$($original.bytes)"
            $report.officialSignature = "$($sig.Status);subject=$($sig.SignerCertificate.Subject)"
            Save-Status
            if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '(?i)Yandex|Яндекс'){throw 'OFFICIAL_INSTALLER_UNSIGNED_OR_NOT_YANDEX'}
            $client = Download-Pinned 'https://api.github.com/repos/PulseSync-LLC/PulseSync-client/releases/assets/673621306' 'PulseSync-3.0.3-beta-x64.exe' '9e153743cc023998bc050b21f8c3432f06ff5dfb6a3995eb2eeb8a064d5847ae'
            $report.clientRelease = "sha256=MATCH;size=$($client.bytes);signature=$((Get-AuthenticodeSignature -FilePath $client.path).Status)"
            Save-Status
            $mod = Download-Pinned 'https://api.github.com/repos/PulseSync-LLC/PulseSync-mod/releases/assets/713319817' 'PulseSync-v2.1.5-app.asar.gz' '73e4a67d9a66b68971a692dd98104f5da66a4994e92ae057f3309a88af0f1b13'
            $report.modRelease = "sha256=MATCH;size=$($mod.bytes)"
            Save-Status
            if(!$protected){
              $report.yandexInstall = 'SAFE_STOP_DEFENDER_DISABLED_OR_UNAVAILABLE'
              Save-Status
              exit 0
            }
            # Try vendor's unattended installer on temporary Windows Server only.
            $proc = Start-Process -FilePath $original.path -ArgumentList '/S' -PassThru
            if(!$proc.WaitForExit(130000)){
              try{$proc.Kill()}catch{}
              $report.yandexInstall = 'SAFE_STOP_INSTALL_TIMEOUT'
              Save-Status
              exit 0
            }
            $exe = Join-Path $env:LOCALAPPDATA 'Programs\YandexMusic\Яндекс Музыка.exe'
            $asar = Join-Path $env:LOCALAPPDATA 'Programs\YandexMusic\resources\app.asar'
            if(!(Test-Path $exe) -or !(Test-Path $asar)){
              $report.yandexInstall = "SAFE_STOP_INSTALL_MISSING;exit=$($proc.ExitCode)"
              Save-Status
              exit 0
            }
            $appSig = (Get-AuthenticodeSignature -FilePath $exe).Status
            $asarSha = (Get-FileHash $asar -Algorithm SHA256).Hash.ToLowerInvariant()
            $same = $asarSha -eq '5a259722d60f746ec32c8bf6e880e375e888315080fb18e67c29b54b582c1215'
            $report.yandexInstall = "exists;signature=$appSig;asarMatchesOwner=$same"
            $report.officialAsar = "sha256=$asarSha"
            Save-Status
            if(!$same -or $appSig -ne 'Valid'){
              $report.clientInstall = 'SAFE_STOP_YANDEX_BUILD_DIFFERS_OR_SIGNATURE_INVALID'
              Save-Status
              exit 0
            }
            # Official app still unmodified. Install third-party client but do NOT
            # automate mod patching, debugger, login or security bypass.
            $install = Start-Process -FilePath $client.path -ArgumentList '/S' -PassThru
            if(!$install.WaitForExit(130000)){
              try{$install.Kill()}catch{}
              $report.clientInstall = 'SAFE_STOP_TIMEOUT'
            } else {
              $after = (Get-FileHash $asar -Algorithm SHA256).Hash.ToLowerInvariant()
              $afterSig = (Get-AuthenticodeSignature -FilePath $exe).Status
              $report.clientInstall = "exit=$($install.ExitCode);originalUnmodified=$($after -eq $asarSha);originalSignature=$afterSig"
            }
            Save-Status
            $report.modInstall = 'NOT_RUN'
            $report.rollback = 'NOT_RUN'
            if(!$report.clientInstall.StartsWith('exit=0')){
              $report.modInstall = 'SAFE_STOP_CLIENT_NOT_INSTALLED'
              Save-Status
              exit 0
            }
            $health = Get-MpComputerStatus
            if(!$health.RealTimeProtectionEnabled -or !$health.AntivirusEnabled){
              $report.modInstall = 'SAFE_STOP_DEFENDER_NOT_ACTIVE'
              Save-Status
              exit 0
            }
            # Verify uncompressed official PulseSync release before any mod launch.
            $archive = Join-Path $root 'pulsesync-v2.1.5.asar'
            $inputStream = [System.IO.File]::OpenRead($mod.path)
            $outputStream = [System.IO.File]::Create($archive)
            $gunzip = [System.IO.Compression.GZipStream]::new($inputStream,[System.IO.Compression.CompressionMode]::Decompress)
            try{$gunzip.CopyTo($outputStream)}
            finally{$gunzip.Dispose();$outputStream.Dispose();$inputStream.Dispose()}
            $modSha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if($modSha -ne '5c291616c0edd20f2d61a90956aea11c139d6748b1506fc9d7c2698b7b248912'){
              $report.modInstall = 'SAFE_STOP_MOD_RELEASE_HASH_MISMATCH'
              Save-Status
              exit 0
            }
            $candidates = @(Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'PulseSync.exe' -File -Recurse -ErrorAction SilentlyContinue)
            if($candidates.Count -ne 1){
              $report.modInstall = "SAFE_STOP_PULSESYNC_APP_MISSING_OR_AMBIGUOUS;count=$($candidates.Count)"
              Save-Status
              exit 0
            }
            # Real signed official files remain untouched before invoking the
            # vendor's own PulseSync mod-install deeplink in the disposable VM.
            $bakExe = Join-Path $root 'original-yandex.exe'
            $bakAsar = Join-Path $root 'original-yandex.asar'
            Copy-Item $exe $bakExe -ErrorAction Stop
            Copy-Item $asar $bakAsar -ErrorAction Stop
            $beforeExe = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            $beforeAsar = (Get-FileHash $asar -Algorithm SHA256).Hash.ToLowerInvariant()
            $deeplink = 'pulsesync://patch/from_mod/' + [Uri]::EscapeDataString($archive)
            try {
              Start-Process -FilePath $candidates[0].FullName -ArgumentList $deeplink -ErrorAction Stop
            } catch {
              $report.modInstall = 'SAFE_STOP_PULSESYNC_GUI_HOST_CANNOT_START'
              Save-Status
              exit 0
            }
            $changed = $false
            for($i=0;$i -lt 20;$i++){
              Start-Sleep -Seconds 3
              if(!(Test-Path $asar) -or !(Test-Path $exe)){break}
              if((Get-FileHash $asar -Algorithm SHA256).Hash.ToLowerInvariant() -ne $beforeAsar){$changed = $true;break}
            }
            $postAsar = if(Test-Path $asar){(Get-FileHash $asar -Algorithm SHA256).Hash.ToLowerInvariant()}else{'MISSING'}
            $postExeSignature = if(Test-Path $exe){(Get-AuthenticodeSignature -FilePath $exe).Status}else{'MISSING'}
            $report.modInstall = "changed=$changed;actualPublishedMod=$($postAsar -eq $modSha);exeSignature=$postExeSignature"
            Save-Status
            # Always attempt original byte-verified restoration in this VM.
            try{
              Get-Process -Name 'PulseSync','Яндекс Музыка' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
              Copy-Item $bakExe $exe -Force -ErrorAction Stop
              Copy-Item $bakAsar $asar -Force -ErrorAction Stop
              $exOk = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -eq $beforeExe
              $asOk = (Get-FileHash $asar -Algorithm SHA256).Hash.ToLowerInvariant() -eq $beforeAsar
              $sgOk = (Get-AuthenticodeSignature -FilePath $exe).Status -eq 'Valid'
              $report.rollback = "exeByteIdentical=$exOk;asarByteIdentical=$asOk;signatureValid=$sgOk"
            }catch{$report.rollback = 'ROLLBACK_FAILED_ON_DISPOSABLE_VM'}
            $afterProtection=Get-MpComputerStatus
            $report.defender="antivirus=$($afterProtection.AntivirusEnabled);realtime=$($afterProtection.RealTimeProtectionEnabled)"
            Save-Status
          } catch {
            $report.notes = "SAFE_STOP: $($_.Exception.Message)"
            Save-Status
            Write-Output $report.notes
          } finally {
            Save-Status
            $report | ConvertTo-Json -Depth 8 | Write-Output
          }
      - name: Upload only redacted JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CELIKOM-W17-disposable-mod-host-report
          path: ${{ runner.temp }}/celikom-w17-disposable/W17-result.json
          if-no-files-found: warn
          retention-days: 14
