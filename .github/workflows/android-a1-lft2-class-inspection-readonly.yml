name: CELIKOM A1 exact LfT2 class structure on signed 2025 Yandex (READ ONLY)
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - 'android/native-yandex-hooklab/ci/lft2_class_inspection.py'
      - 'android/native-yandex-hooklab/ci/test_lft2_class_inspection.py'
      - '.github/workflows/android-a1-lft2-class-inspection-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-lft2-class-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only signature and package metadata tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner
      - name: Validate bounded class parser
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile android/native-yandex-hooklab/ci/lft2_class_inspection.py
          PYTHONPATH=android/native-yandex-hooklab/ci:android/native-yandex-hooklab \
            python3 -B -m unittest discover \
              -s android/native-yandex-hooklab/ci -p 'test_lft2_class_inspection.py' -v
      - name: Download exact private issuer-signed 2025 owner XAPK
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' \
            | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/celikom-lft2-private"
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" \
            --pattern yandex-music-2025-10-4-120-1gpr.xapk \
            --dir "$RUNNER_TEMP/celikom-lft2-private" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-lft2-private/yandex-music-2025-10-4-120-1gpr.xapk"
          test "$(stat -c %s "$f")" = 45961661
          test "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053
      - name: Inspect only LfT2 and its declared ancestry
        shell: bash
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/lft2_class_inspection.py \
            --xapk "$RUNNER_TEMP/celikom-lft2-private/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Remove private original input
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/celikom-lft2-private"
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo '{"original_binary_modified":false,"original_binary_exported":false,"user_login_or_media_accessed":false,"decoder_source_changed":false}'
