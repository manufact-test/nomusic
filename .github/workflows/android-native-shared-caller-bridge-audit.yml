name: Android signed native FileInfo to media shared-caller audit (READ-ONLY)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - 'android/native-yandex-hooklab/audit_native_shared_caller_bridge.py'
      - 'android/native-yandex-hooklab/tests/test_native_shared_caller_bridge.py'
      - '.github/workflows/android-native-shared-caller-bridge-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-publisher-signed-crossdex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests of cross-DEX source/sink common caller logic and output privacy
        run: |
          set -eu
          python3 -m py_compile android/native-yandex-hooklab/audit_native_shared_caller_bridge.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_native_shared_caller_bridge.py' -v
      - name: Read-only SHA256 pinned publisher-signed Yandex six-DEX static scan
        run: python3 android/native-yandex-hooklab/audit_native_shared_caller_bridge.py
      - name: Publisher APK, signatures, tokens and media must never be exported
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'STATIC ONLY: no Yandex code/value extraction, no audio, no runtime/instrumentation'
