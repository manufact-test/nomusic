name: CELIKOM A1 cancel exact obsolete BETA23 pre-release native builds once
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - '.github/workflows/android-a1-cancel-obsolete-beta23-once.yml'
permissions:
  contents: read
jobs:
  cancel-obsolete-only:
    if: github.repository == 'manufact-test/nomusic'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel only two exact superseded non-export native runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=manufact-test/nomusic
          for pair in \
            "45903409534 54e063ae6e28470ce24e5e1001e0803b4173e79f" \
            "45903453967 037700e7c2ba8eca748d0fc903c02f8c8624707e"; do
            read -r run sha <<< "$pair"
            data=$(gh api "repos/$repo/actions/runs/$run")
            jq -e --arg sha "$sha" --argjson id "$run" '
              .id == $id and .head_sha == $sha
              and .head_branch == "experiment/android-a1-metrica-init-state-observer-arm13-20261112"
              and (.path | startswith(".github/workflows/android-a1-metrica-init-state-observer-arm13.yml"))
              and .run_attempt == 1
            ' <<< "$data" >/dev/null
            status=$(jq -r .status <<< "$data")
            if [[ "$status" == completed ]]; then
              echo A1_SUPERSEDED_ALREADY_COMPLETED
              continue
            fi
            gh api --method POST "repos/$repo/actions/runs/$run/cancel" >/dev/null
          done
          echo A1_ONLY_OBSOLETE_NATIVE_RUNS_CANCEL_REQUESTED
