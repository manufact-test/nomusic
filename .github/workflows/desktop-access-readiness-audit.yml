name: Desktop access readiness audit
on:
  push:
    branches: [audit/desktop-access-readiness-20261110]
    paths:
      - .github/workflows/desktop-access-readiness-audit.yml
      - docs/security/DESKTOP-ACCESS-AUDIT-2026-11-10.md
permissions:
  contents: read
jobs:
  accepted-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63d8cd891e1db82e0245122391fd4ab5cdd323be
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify accepted version and run extension regression
        run: |
          node -e 'if(JSON.parse(require("fs").readFileSync("extension/package.json")).version!=="0.4.73")process.exit(1)'
          npm run test:extension
          npm --prefix extension run validate
          npm run security
  server-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-mysql
          MYSQL_DATABASE: celikom_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-mysql"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: celikom_test
      DB_USER: root
      DB_PASSWORD: ci-disposable-mysql
      STORAGE_PATH: /tmp/celikom-access-audit-audio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e648eacaeb50cc371842590ed7a30284e440d2a
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo
          tools: composer:v2
          coverage: none
      - name: Validate server and autoload
        run: |
          composer --working-dir=server validate --strict
          composer --working-dir=server dump-autoload --no-interaction
      - name: Synthetic database, authentication, trial, promos, expiry, refunds and concurrency
        run: |
          set -euo pipefail
          php server/tests/database.php
          php server/tests/auth.php
          php server/tests/entitlement.php
          php server/tests/promos.php
          php server/tests/incidents.php
          php server/tests/billing.php
          php server/tests/referrals.php
          php server/tests/rewards.php
          php server/tests/reward-policy.php
          php server/tests/automatic-rewards.php
