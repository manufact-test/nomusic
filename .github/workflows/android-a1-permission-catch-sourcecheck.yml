name: CELIKOM A1 exact TRUE-to-catch signature-permission source check
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - 'android/a1-permission-catch-sourcecheck/**'
      - '.github/workflows/android-a1-permission-catch-sourcecheck.yml'
  workflow_dispatch:
permissions:
  contents: write # GitHub draft release API read needs write on private draft
jobs:
  exact-true-catch-permission:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic and isolation checks
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = manufact-test/nomusic
          test "$GITHUB_REF_NAME" = experiment/android-a1-metrica-init-state-observer-arm13-20261112
          python3 -B -m py_compile android/a1-permission-catch-sourcecheck/permission_catch.py
          python3 -B -m unittest discover -s android/a1-permission-catch-sourcecheck -p test_permission_catch.py -v
          python3 -B -m unittest discover -s android/a1-exact-catch-helper -p test_exact_catch.py -v
      - name: Obtain privately verified original publisher 2025 input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/a1-permission-catch-private"
          chmod 700 "$RUNNER_TEMP/a1-permission-catch-private"
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" --pattern yandex-music-2025-10-4-120-1gpr.xapk --dir "$RUNNER_TEMP/a1-permission-catch-private" --clobber >/dev/null
          f="$RUNNER_TEMP/a1-permission-catch-private/yandex-music-2025-10-4-120-1gpr.xapk"
          test "$(stat -c %s "$f")" = 45961661
          test "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053
      - name: Single exact catch-path permission link check, static only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B android/a1-permission-catch-sourcecheck/permission_catch.py --xapk "$RUNNER_TEMP/a1-permission-catch-private/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Destroy temporary publisher input
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/a1-permission-catch-private"
          echo '{"vendor_binary_uploaded":false,"original_sdk_patched":false,"native_test_run":false,"stage_a":"NO_GO"}'
