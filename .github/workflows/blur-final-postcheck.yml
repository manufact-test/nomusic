name: CELIKOM Blur — final 118 independent READ ONLY production audit
on:
  push:
    branches: [feature/blur-batch1000-20261108]
    paths: ['.github/workflows/blur-final-postcheck.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: celikom-blur-final-independent-audit-only
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check static pinned plan and non-mutating independent PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/blur-final/check-live-final-readonly.php
          jq -e '.target_pending==118 and .fixed_plan==true and (.selected|length)==118' tools/blur-final/fixed-final.json
      - name: Independently verify live 118 private audio digests, pending DB state, catalogue and API
        env:
          HOST_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/private/hosts"
          chmod 600 "$RUNNER_TEMP/private/"*
          # Read-only audit: resilient to transient Hostinger SSH connection timeouts.
          for attempt in 1 2 3 4; do
            if ssh -p 65002 -o ConnectTimeout=25 -o ServerAliveInterval=20 -o ServerAliveCountMax=4 -i "$RUNNER_TEMP/private/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/private/hosts" \
              u235811320@92.113.19.189 '/opt/alt/php83/usr/bin/php -d display_errors=stderr' < tools/blur-final/check-live-final-readonly.php > "$RUNNER_TEMP/celikom-live200-independent.json"; then
              cat "$RUNNER_TEMP/celikom-live200-independent.json"
              break
            fi
            if [ "$attempt" -eq 4 ]; then echo 'SSH_READONLY_AUDIT_UNAVAILABLE'; exit 1; fi
            sleep 35
          done
          jq -e '.status=="FINAL118_INDEPENDENT_READONLY" and .pass==true and .checked==118 and .pending==118 and .files_verified==118 and .private_bytes==761451096 and .batch_counts==[50,50,18] and .catalogue_absent==118 and .resolve_not_found==118 and .auto_approved==0 and .active==0 and .writes==0 and (.issues|length)==0' "$RUNNER_TEMP/celikom-live200-independent.json"
          echo '### Independent production read-only validation: 118/118 pending and private audio intact, 0 public' >> "$GITHUB_STEP_SUMMARY"
          jq '{pass,checked,pending,files_verified,private_bytes,batch_counts,catalogue_absent,resolve_not_found,issues,writes}' "$RUNNER_TEMP/celikom-live200-independent.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory actual production catalogue and private audio assets READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/blur-batch800/live-inventory-readonly.php
          for attempt in 1 2 3 4; do
            if ssh -p 65002 -o ConnectTimeout=25 -o ServerAliveInterval=20 -o ServerAliveCountMax=4 -i "$RUNNER_TEMP/private/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/private/hosts" \
              u235811320@92.113.19.189 '/opt/alt/php83/usr/bin/php -d display_errors=stderr' < tools/blur-batch800/live-inventory-readonly.php > "$RUNNER_TEMP/celikom-inventory.json"; then
              cat "$RUNNER_TEMP/celikom-inventory.json"
              break
            fi
            if [ "$attempt" -eq 4 ]; then echo 'SSH_READONLY_INVENTORY_UNAVAILABLE'; exit 1; fi
            sleep 35
          done
          jq -e '.status=="LIVE_LIBRARY_INVENTORY_READ_ONLY" and .writes==0 and .private_audio_assets>=0 and .catalogue_active>=0' "$RUNNER_TEMP/celikom-inventory.json"
          echo '### Actual production library inventory (read-only)' >> "$GITHUB_STEP_SUMMARY"
          jq . "$RUNNER_TEMP/celikom-inventory.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep read-only verification result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celikom-final118-independent-${{ github.run_id }}
          path: ${{ runner.temp }}/celikom-*.json
          retention-days: 90
          if-no-files-found: ignore
