name: CELIKOM A1 ARM hosted runner preflight (no APK, no secrets)
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - '.github/workflows/android-a1-arm-hosted-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  linux-x64-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Prove hosted x64 allocation only
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          echo A1_HOSTED_X64_ASSIGNED
  linux-arm24:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Prove hosted ARM24 allocation only
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          echo A1_HOSTED_ARM24_ASSIGNED
  linux-arm22:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 2
    steps:
      - name: Prove hosted ARM22 allocation only
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          echo A1_HOSTED_ARM22_ASSIGNED
  hosted-dispatch-reason-readonly:
    needs: [linux-x64-control, linux-arm24, linux-arm22]
    if: always()
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 4
    steps:
      - name: Inspect failed hosted check-run result only (no secrets)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          repo=os.environ["GITHUB_REPOSITORY"]
          for job,name in ((139519347796,"X64"),(139519347820,"ARM24"),(139519347346,"ARM22")):
              url=f"https://api.github.com/repos/{repo}/check-runs/{job}"
              request=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28"})
              try:
                  with urllib.request.urlopen(request,timeout=12) as response:
                      data=json.load(response)
                  output=data.get("output") or {}
                  summary=(" ".join(str(output.get(key) or "") for key in ("title","summary","text"))).lower()
                  reasons={
                     "BILLING_OR_BUDGET":("billing","minutes","budget","spending","payment"),
                     "POLICY_OR_RESTRICTION":("restricted","suspended","disabled","policy","abuse","blocked"),
                     "RUNNER_CAPACITY":("capacity","allocation","unavailable","provision"),
                     "CONFIGURATION":("configuration","invalid","label"),
                  }
                  found=[key for key,terms in reasons.items() if any(term in summary for term in terms)]
                  print("A1_HOSTED_DISPATCH_"+name, "status",data.get("status"),"conclusion",data.get("conclusion"),"reason",",".join(found) or "UNKNOWN","output_present",bool(summary))
                  for key in ("title","summary","text"):
                      value=output.get(key) or ""
                      clean=" ".join(value.split())
                      print("A1_HOSTED_DISPATCH_"+name+"_OUTPUT_"+key.upper(),repr(clean[:400]))
              except urllib.error.HTTPError as error:
                  print("A1_HOSTED_DISPATCH_"+name,"API_UNAVAILABLE",error.code)
          PY
      - name: Local CI capability fingerprint (no paths or secrets)
        shell: bash
        run: |
          for tool in java javac gradle sdkmanager docker sudo gh; do
            if command -v "$tool" >/dev/null 2>&1; then echo "A1_TOOL_${tool}=YES"; else echo "A1_TOOL_${tool}=NO"; fi
          done
          uname -m
