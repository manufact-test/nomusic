name: CELIKOM A1 ARM hosted runner preflight (no APK, no secrets)
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - '.github/workflows/android-a1-arm-hosted-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x64-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Prove hosted x64 allocation only
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          echo A1_HOSTED_X64_ASSIGNED
  linux-arm24:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Prove hosted ARM24 allocation only
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          echo A1_HOSTED_ARM24_ASSIGNED
  linux-arm22:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 2
    steps:
      - name: Prove hosted ARM22 allocation only
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          echo A1_HOSTED_ARM22_ASSIGNED
