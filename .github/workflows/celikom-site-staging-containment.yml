name: CELIKOM website staging emergency access containment

on:
  push:
    branches: [feature/api-range]
    paths:
      - .github/workflows/celikom-site-staging-containment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contain-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close staging marker and inspect HTTP routing safely
        env:
          SSH_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == manufact-test/nomusic && "$GITHUB_REF" == refs/heads/feature/api-range ]]
          [[ -n "${SSH_KEY:-}" && -n "${KNOWN_HOSTS:-}" ]]
          umask 077
          t=$(mktemp -d)
          trap 'rm -rf "$t"' EXIT
          printf '%s\n' "$SSH_KEY" > "$t/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$t/known"
          chmod 600 "$t/key" "$t/known"
          ssh -T -p 65002 -i "$t/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$t/known" -o ConnectTimeout=15 u235811320@92.113.19.189 'bash -se' <<'REMOTE'
          set -euo pipefail
          domain=/home/u235811320/domains/lemonchiffon-narwhal-791953.hostingersite.com
          file="$domain/celikom-private/app/staging-approved.php"
          if test -f "$file"; then
            test ! -e "$domain/celikom-private/staging-approval-paused"
            mv "$file" "$domain/celikom-private/staging-approval-paused"
            chmod 600 "$domain/celikom-private/staging-approval-paused"
          fi
          printf 'private_staging_gate_active=%s\n' "$(test -f "$file" && echo yes || echo no)"
          printf 'public_index_present=%s\n' "$(test -f "$domain/public_html/index.php" && echo yes || echo no)"
          printf 'htaccess_present=%s\n' "$(test -f "$domain/public_html/.htaccess" && echo yes || echo no)"
          printf 'owner_credentials_present=%s\n' "$(test -f "$domain/celikom-private/staging-owner-credentials.txt" && echo yes || echo no)"
          printf 'auth_file_present=%s\n' "$(test -f "$domain/celikom-private/.htpasswd" && echo yes || echo no)"
          REMOTE
          for endpoint in / /admin/ /index.php /assets/css/v10/00-base.css; do
            curl -sS -L --connect-timeout 10 --max-time 25 -o "$t/response" -D "$t/headers" \
              -w "url=$endpoint http_code=%{http_code} content_type=%{content_type} downloaded=%{size_download}\n" \
              "https://lemonchiffon-narwhal-791953.hostingersite.com$endpoint?stagingcheck=${GITHUB_SHA}"
            grep -iE '^(server:|cache-control:|www-authenticate:|location:|x-robots-tag:|x-litespeed-cache:)' "$t/headers" | head -n 10 || true
          done
