name: CELIKOM — community 61 requests vs production READ ONLY
on:
  push:
    branches: [feature/blur-batch1000-20261108]
    paths: ['.github/workflows/blur-community61-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate hardcoded request IDs and readonly PHP
        run: |
          php -l tools/blur-research/community61-live-readonly.php
          jq -e 'length==61 and ([.[]] | unique | length)==61' tools/blur-research/community61-source-ids.json
      - name: Compare reported Track IDs to current production in READ ONLY transaction
        shell: bash
        env:
          HOST_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/private/hosts"
          chmod 600 "$RUNNER_TEMP/private/"*
          for attempt in 1 2 3; do
            if ssh -p 65002 -o ConnectTimeout=25 -o ServerAliveInterval=20 -o ServerAliveCountMax=4 -i "$RUNNER_TEMP/private/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/private/hosts" \
              u235811320@92.113.19.189 '/opt/alt/php83/usr/bin/php -d display_errors=stderr' < tools/blur-research/community61-live-readonly.php > "$RUNNER_TEMP/community61-live.json"; then
              cat "$RUNNER_TEMP/community61-live.json"
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo COMMUNITY61_READONLY_SSH_UNAVAILABLE; exit 1; fi
            sleep 25
          done
          jq -e '.status=="YM_LIBERTY_COMMUNITY_REPORTS_61_READ_ONLY" and .checked==61 and .writes==0 and (.absent_tracks+.existing_tracks)==61' "$RUNNER_TEMP/community61-live.json"
          echo '### Community reports, ID-only read only' >> "$GITHUB_STEP_SUMMARY"
          jq '{checked,existing_tracks,absent_tracks,requests,tombstones,writes,records}' "$RUNNER_TEMP/community61-live.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celikom-community61-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/community61-live.json
          retention-days: 90
          if-no-files-found: ignore
