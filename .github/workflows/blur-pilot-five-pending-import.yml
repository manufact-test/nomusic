name: CELIKOM Blur — five real MP3 to private pending moderation

on:
  push:
    branches: [feature/blur-pilot-five-20261108]
    paths: ['.github/workflows/blur-pilot-five-pending-import.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celikom-blur-five-pending-live-once
  cancel-in-progress: false

jobs:
  import-pending:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate script, expected manifest and source metadata
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/blur-pilot-five/import-pending.php
          python3 -m unittest discover -s tools/blur-pilot-five -p 'test_*.py'
          python3 tools/blur-pilot-five/validate.py --report "$RUNNER_TEMP/source-metadata.json"
      - name: Download exactly five pinned MP3s to disposable private runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/blur-five-audio"
          python3 tools/blur-pilot-five/download_sources.py "$RUNNER_TEMP/blur-five-audio"
          test "$(find "$RUNNER_TEMP/blur-five-audio" -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 5
      - name: Push to private staging, dry-run dedupe and import pending only
        shell: bash
        env:
          HOST_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/private/id_host"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/private/known_hosts"
          chmod 600 "$RUNNER_TEMP/private/"*
          SSH=(ssh -p 65002 -i "$RUNNER_TEMP/private/id_host" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/private/known_hosts")
          SCP=(scp -P 65002 -i "$RUNNER_TEMP/private/id_host" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/private/known_hosts")
          TARGET=u235811320@92.113.19.189
          REMOTE_BASE=/home/u235811320/domains/darkred-camel-588676.hostingersite.com/celikom
          REMOTE_DIR="$REMOTE_BASE/incoming/blur-five-$GITHUB_RUN_ID"
          cleanup() {
            "${SSH[@]}" "$TARGET" "if test -d '$REMOTE_DIR'; then rm -f '$REMOTE_DIR'/*.mp3 '$REMOTE_DIR'/import-pending.php; rmdir '$REMOTE_DIR'; fi" || true
          }
          trap cleanup EXIT
          "${SSH[@]}" "$TARGET" "umask 077; test -d '$REMOTE_BASE/incoming' && test ! -e '$REMOTE_DIR' && mkdir -m 700 '$REMOTE_DIR'"
          "${SCP[@]}" tools/blur-pilot-five/import-pending.php "$TARGET:$REMOTE_DIR/import-pending.php"
          "${SCP[@]}" "$RUNNER_TEMP/blur-five-audio/"*.mp3 "$TARGET:$REMOTE_DIR/"
          echo 'PRECHECK: no database changes before this check'
          "${SSH[@]}" "$TARGET" "CELIKOM_BLUR_DRY_RUN=1 php '$REMOTE_DIR/import-pending.php'"
          echo 'PENDING IMPORT: five unapproved files; no rights declaration, no activation'
          "${SSH[@]}" "$TARGET" "php '$REMOTE_DIR/import-pending.php'"
          echo '### Five MP3 sent to owner-only CELIKOM moderation' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Open pending songs in admin](https://darkred-camel-588676.hostingersite.com/admin?tab=uploads&status=pending)' >> "$GITHUB_STEP_SUMMARY"
          echo '- No auto approval; rights confirmation belongs to the owner.' >> "$GITHUB_STEP_SUMMARY"