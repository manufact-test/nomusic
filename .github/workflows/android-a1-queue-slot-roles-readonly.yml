name: CELIKOM A1 exact native Exo queue pointer role map (READ ONLY)
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - 'android/native-yandex-hooklab/ci/exo_queue_slot_role_exact.py'
      - 'android/native-yandex-hooklab/ci/test_exo_queue_slot_role_exact.py'
      - 'android/native-yandex-hooklab/ci/a1_private_player_period_current_target.py'
      - '.github/workflows/android-a1-queue-slot-roles-readonly.yml'
  workflow_dispatch:
permissions:
  # Private draft release inspection requires the same access as the verified LfT2 workflow.
  contents: write
jobs:
  direct-media-source-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use runner's installed Android SDK signed APK tools (offline)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk/build-tools"
          mapfile -t versions < <(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V -r)
          for version in "${versions[@]}"; do
            if test -x "$version/aapt" && test -x "$version/apksigner"; then
              echo "$version" >> "$GITHUB_PATH"
              "$version/aapt" version
              "$version/apksigner" --version
              exit 0
            fi
          done
          echo "::error::ANDROID_BUILD_TOOLS_NOT_AVAILABLE"
          exit 1
      - name: Validate bounded direct-source parser and fail-closed fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile android/native-yandex-hooklab/ci/exo_queue_slot_role_exact.py
          PYTHONPATH=android/native-yandex-hooklab/ci:android/native-yandex-hooklab \
            python3 -B -m unittest discover \
              -s android/native-yandex-hooklab/ci \
              -p 'test_exo_queue_slot_role_exact.py' -v
      - name: Download exact private signed 2025 Yandex research input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' \
            | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/celikom-native-queue-slot-input"
          gh release download a1-yandex-2025-gpr-private-test \
            --repo "$GITHUB_REPOSITORY" \
            --pattern yandex-music-2025-10-4-120-1gpr.xapk \
            --dir "$RUNNER_TEMP/celikom-native-queue-slot-input" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-native-queue-slot-input/yandex-music-2025-10-4-120-1gpr.xapk"
          test "$(stat -c %s "$f")" = 45961661
          test "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053
      - name: Inspect only exact ExoPlayer/h pointer slots and native engine use
        shell: bash
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/exo_queue_slot_role_exact.py \
            --xapk "$RUNNER_TEMP/celikom-native-queue-slot-input/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Validate NAV41 exact private field compiler from signed original (no Java artifact export)
        shell: bash
        env:
          GH_ACTIONS: 'true'
        run: |
          set -euo pipefail
          source_java="$RUNNER_TEMP/CELIKOM-PrivateNativePlayerPeriodTarget.java"
          PYTHONPATH=android/native-yandex-hooklab/ci:android/native-yandex-hooklab \
            python3 -B android/native-yandex-hooklab/ci/a1_private_player_period_current_target.py \
              --xapk "$RUNNER_TEMP/celikom-native-queue-slot-input/yandex-music-2025-10-4-120-1gpr.xapk" \
              --private-java "$source_java"
          test -s "$source_java"
          grep -q 'class PrivateNativePlayerPeriodTarget' "$source_java"
          rm -f -- "$source_java"
      - name: Delete the original research input and guard untouched products
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/celikom-native-queue-slot-input"
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo '{"original_binary_modified":false,"original_binary_exported":false,"user_login_or_media_accessed":false,"runtime_hooks_changed":false,"decoder_source_changed":false}'
