name: Desktop 0.4.73 complete file live join Chrome and Brave
on:
  push:
    branches: [feature/desktop-073-complete-file-live-join-20261104]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CELIKOM_API_BASE_URL: https://darkred-camel-588676.hostingersite.com
      REQUIRE_BROWSER_AUDIO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install encoder and official Brave release
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg brave-browser
          brave-browser --version
          google-chrome --version
      - name: Desktop regression tests
        run: npm --prefix extension test
      - name: Real Chrome media and complete-file live approval
        env:
          CELIKOM_BROWSER_BINARY: /usr/bin/google-chrome
        run: node scripts/test-audio-gain-browser.mjs
      - name: Real Brave media and complete-file live approval
        env:
          CELIKOM_BROWSER_BINARY: /usr/bin/brave-browser
        run: node scripts/test-audio-gain-browser.mjs
      - name: Validate and package desktop only
        run: |
          npm run lint
          npm --prefix extension run validate
          npm --prefix extension run build
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-desktop-0.4.73-complete-file-join
          path: extension/dist/celikom-extension-0.4.73.zip
  brave-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CELIKOM_API_BASE_URL: https://darkred-camel-588676.hostingersite.com
      REQUIRE_BROWSER_AUDIO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install official signed Brave and audio encoder
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'BraveBrowserStandaloneSilentSetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/brave/brave-browser/releases/latest/download/BraveBrowserStandaloneSilentSetup.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Brave Software') { throw 'Brave installer signature invalid' }
          $process = Start-Process -FilePath $installer -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Brave installation failed: $($process.ExitCode)" }
          $paths = @("$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe", "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe")
          $browser = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Installed Brave binary not found' }
          "CELIKOM_BROWSER_BINARY=$browser" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Audio encoder installation failed' }
          }
      - name: Build desktop scripts
        run: npm --prefix extension run build:unpacked
      - name: Real Windows Brave media and complete-file live approval
        run: node scripts/test-audio-gain-browser.mjs
