name: CELIKOM — YM Liberty 33 possible new Track IDs production crosscheck READ ONLY
on:
  push:
    branches: [feature/blur-batch1000-20261108]
    paths: ['.github/workflows/ym-liberty-33-crosscheck.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static immutable 33-ID check
        run: |
          php -l tools/blur-research/ym-liberty-33-live-check.php
          jq -e 'length==33 and ([.[].track_id]|unique|length)==33' tools/blur-research/ym-liberty-33-candidates.json
      - name: Compare 33 source IDs to live CELIKOM production with SELECT ONLY
        shell: bash
        env:
          HOST_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/private/hosts"
          chmod 600 "$RUNNER_TEMP/private/"*
          for attempt in 1 2 3; do
            if ssh -p 65002 -o ConnectTimeout=25 -o ServerAliveInterval=20 -o ServerAliveCountMax=4 -i "$RUNNER_TEMP/private/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/private/hosts" \
                u235811320@92.113.19.189 '/opt/alt/php83/usr/bin/php -d display_errors=stderr' < tools/blur-research/ym-liberty-33-live-check.php > "$RUNNER_TEMP/ym-liberty33.json"; then
              cat "$RUNNER_TEMP/ym-liberty33.json"
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo 'YM_LIBERTY_READ_ONLY_SSH_UNAVAILABLE'; exit 1; fi
            sleep 25
          done
          jq -e '.status=="NEW_SOURCE_YM_LIBERTY_READ_ONLY" and .checked==33 and .writes==0 and (.absent_tracks+.existing_tracks)==33' "$RUNNER_TEMP/ym-liberty33.json"
          echo '### YM Liberty 33 cross-check against live CELIKOM' >> "$GITHUB_STEP_SUMMARY"
          jq '{checked,existing_tracks,absent_tracks,requests,tombstones,writes,records}' "$RUNNER_TEMP/ym-liberty33.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym-liberty-33-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/ym-liberty33.json
          retention-days: 90
          if-no-files-found: ignore
