name: Complete admin duration warning integrity verification

on:
  push:
    branches: [feature/api-range]
    paths:
      - .github/workflows/admin-duration-integrity-20261014.yml

permissions:
  contents: read

concurrency:
  group: celikom-hostinger-private-test
  cancel-in-progress: false

jobs:
  verify-private:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-mysql
          MYSQL_DATABASE: celikom_restore
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-mysql"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo
          coverage: none
      - name: Validate restricted operations before SSH
        run: |
          bash -n .github/scripts/hostinger-stage5.sh
          php -l .github/scripts/hostinger-stage5-remote.php
      - name: Verify private snapshot and public HTTPS without logging private data
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          for operation in audit snapshot restore-drill; do
            node -e 'require("fs").writeFileSync(".github/deploy/hostinger-stage5-request.json",JSON.stringify({operation:process.argv[1]}))' "$operation"
            bash .github/scripts/hostinger-stage5.sh
          done
