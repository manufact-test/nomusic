name: Android native cross-app audio research
on:
  push:
    branches: [feature/api-range]
    paths: ["android/native-research/**", ".github/workflows/android-native-research.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate own audio and build isolated research apps
        run: |
          python3 android/spike/generate-fixtures.py
          mkdir -p android/native-research/source/src/main/res/raw
          cp android/spike/app/src/main/res/raw/original.wav android/native-research/source/src/main/res/raw/original.wav
          mkdir -p android/native-research/controller/src/main/res/raw
          cp android/spike/app/src/main/res/raw/alternate.wav android/native-research/controller/src/main/res/raw/alternate.wav
          cd android/native-research
          gradle --no-daemon :source:assembleDebug :controller:assembleDebug :controller:assembleDebugAndroidTest :source:lintDebug :controller:lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Classify cross-app effect on owned source
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install android/native-research/source/build/outputs/apk/debug/source-debug.apk
            cd android/native-research && gradle --no-daemon :controller:connectedDebugAndroidTest
            adb logcat -d -s CELIKOM_NATIVE_RESEARCH:I '*:S'
