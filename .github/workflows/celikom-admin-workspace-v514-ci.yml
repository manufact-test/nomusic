name: CELIKOM owner admin workspace v5.14 Chromium acceptance
on:
  push:
    branches: [feature/api-range]
    paths:
      - '.github/workflows/celikom-admin-workspace-v514-ci.yml'
      - 'website/public/admin/index.php'
      - 'website/public/assets/css/admin-workspace.css'
      - 'website/public/assets/js/admin-workspace.js'
      - 'website/tests/OwnerCmsWorkspaceBrowserTest.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: celikom_site_test
          MYSQL_ROOT_PASSWORD: ci-website-temporary-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-website-temporary-only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CELIKOM_SITE_DB_HOST: 127.0.0.1
      CELIKOM_SITE_DB_NAME: celikom_site_test
      CELIKOM_SITE_DB_USER: root
      CELIKOM_SITE_DB_PASSWORD: ci-website-temporary-only
      CELIKOM_SITE_AUTH_HMAC_KEY: ci-ephemeral-site-only-auth-secret-2026-never-deploy
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,gd,sodium
          tools: none
          coverage: none
      - name: Assert edited PHP and JS are syntactically valid
        run: |
          php -l website/public/admin/index.php
          node --check website/public/assets/js/admin-workspace.js
      - name: Initialize isolated and ephemeral CMS owner
        run: php website/tests/Stage9CmsCoreTest.php
      - name: Exercise existing HTTP auth and safe content editor contracts
        run: python3 website/tests/Stage9AdminHttpTest.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real Chromium dashboard, navigation, FAQ and mobile editing
        run: python3 website/tests/OwnerCmsWorkspaceBrowserTest.py
