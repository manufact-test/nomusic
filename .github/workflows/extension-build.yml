name: Extension artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/ci/celikom-extension-build-trigger.txt'
      - '.github/workflows/extension-build.yml'
      - 'scripts/test-audio-gain-browser.mjs'
      - 'extension/**'
      - 'package.json'
      - 'package-lock.json'
    tags:
      - "extension-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Test and build extension
        env:
          CELIKOM_API_BASE_URL: https://api.celikom.com
        run: |
          npm run test:extension
          npm run build:extension
          npm --prefix extension run validate

      # Staging is private data storage, not release approval. Preserve a checked
      # owner candidate even when the separate native-browser check fails.
      - name: Security audit
        run: npm run security

      - name: Verify checksum
        run: cd extension/dist && sha256sum --check celikom-extension-*.zip.sha256

      - name: Verify migrated main origin and keep private extension ZIP on FlokiNET
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --test .github/scripts/tests/floki-private-build-spool.test.mjs
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const api=JSON.parse(readFileSync('extension/dist/unpacked/api/config.json','utf8'));
          const manifest=JSON.parse(readFileSync('extension/dist/unpacked/manifest.json','utf8'));
          assert.equal(api.baseUrl,'https://api.celikom.com');
          assert.deepEqual([...manifest.host_permissions].sort(),['https://api.celikom.com/*','https://music.yandex.ru/*'].sort());
          CHECK
          node .github/scripts/floki-private-build-spool.mjs \
            "$GITHUB_WORKSPACE" /home/runner/celikom-build-spool \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" --extension-only

      - name: Prepare official Chrome for Testing and static FFmpeg on the Floki runner
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! pgrep -x chromium >/dev/null 2>&1 && ! pgrep -x chrome >/dev/null 2>&1; then
            rm -rf -- /tmp/chromium /tmp/fonts /tmp/swiftshader /tmp/al2023 /tmp/chromium-pack
          fi
          echo "Disk before browser setup:"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          tools_dir="$RUNNER_TEMP/celikom-tools"
          browser_tmp="$RUNNER_TEMP/celikom-chromium-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$tools_dir" "$browser_tmp/chrome"
          node --input-type=module <<'NODE'
          import {createWriteStream} from "node:fs";
          import {Readable} from "node:stream";
          import {pipeline} from "node:stream/promises";
          const meta=await fetch("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json").then(r=>{if(!r.ok)throw Error("Chrome version lookup failed: "+r.status);return r.json();});
          const stable=meta.channels?.Stable;
          const url=stable?.downloads?.chrome?.find(item=>item.platform==="linux64")?.url;
          if(!url)throw Error("Stable Chrome for Testing linux64 download URL missing");
          console.log("Downloading official Chrome for Testing "+stable.version);
          const response=await fetch(url);
          if(!response.ok||!response.body)throw Error("Chrome download failed: "+response.status);
          await pipeline(Readable.fromWeb(response.body),createWriteStream(process.env.RUNNER_TEMP+"/celikom-chromium-"+process.env.GITHUB_RUN_ID+"-"+process.env.GITHUB_RUN_ATTEMPT+"/chrome.zip"));
          NODE
          if command -v python3 >/dev/null 2>&1; then
            python3 -m zipfile -e "$browser_tmp/chrome.zip" "$browser_tmp/chrome"
          elif command -v unzip >/dev/null 2>&1; then
            unzip -q "$browser_tmp/chrome.zip" -d "$browser_tmp/chrome"
          else
            echo "ZIP_EXTRACTOR_REQUIRED"
            exit 1
          fi
          browser_bin="$browser_tmp/chrome/chrome-linux64/chrome"
          [[ -f "$browser_bin" ]] || { echo "CHROME_FOR_TESTING_BINARY_MISSING"; find "$browser_tmp/chrome" -maxdepth 3 -type f | head -n 30; exit 1; }
          chmod 755 "$browser_bin"
          if [[ -f "$browser_tmp/chrome/chrome-linux64/chrome_crashpad_handler" ]]; then chmod 755 "$browser_tmp/chrome/chrome-linux64/chrome_crashpad_handler"; fi
          rm -f -- "$browser_tmp/chrome.zip"
          echo "Chrome dynamic library inspection:"
          ldd "$browser_bin" || true
          if ldd "$browser_bin" | grep -q 'not found'; then
            command -v apt-get >/dev/null 2>&1 || { echo "APT_GET_UNAVAILABLE_FOR_UNPRIVILEGED_CHROME_LIBS"; exit 1; }
            command -v dpkg-deb >/dev/null 2>&1 || { echo "DPKG_DEB_UNAVAILABLE_FOR_UNPRIVILEGED_CHROME_LIBS"; exit 1; }
            echo "Floki runner distribution and package sources:"
            cat /etc/os-release
            find /etc/apt/sources.list.d -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true
            libs_dir="$browser_tmp/chrome-libs"
            apt_tmp="$HOME/.cache/celikom-extension-browser-apt-noble-v1"
            mkdir -p "$libs_dir/debs" "$libs_dir/root" "$apt_tmp/lists/partial" "$apt_tmp/cache/archives/partial"
            apt_opts=(
              -o "Dir::State::lists=$apt_tmp/lists"
              -o "Dir::Cache::archives=$apt_tmp/cache/archives"
              -o "Debug::NoLocking=true"
              -o "Acquire::http::Timeout=15"
              -o "Acquire::https::Timeout=15"
              -o "Acquire::Retries=1"
            )
            if [[ ! -f "$apt_tmp/last-refresh" ]] || [[ -n "$(find "$apt_tmp/last-refresh" -mmin +360 -print)" ]]; then
              timeout -k 5s 150s apt-get "${apt_opts[@]}" update
              touch "$apt_tmp/last-refresh"
            else
              echo "Using previously verified Ubuntu Noble package index."
            fi
            apt_choice() {
              local choice
              for choice in "$@"; do
                if apt-cache "${apt_opts[@]}" show "$choice" >/dev/null 2>&1; then
                  printf '%s\n' "$choice"
                  return 0
                fi
              done
              echo "CHROME_RUNTIME_PACKAGE_MISSING: $*" >&2
              return 1
            }
            packages=(
              libnspr4 libnss3
              "$(apt_choice libatk1.0-0t64 libatk1.0-0)"
              "$(apt_choice libatk-bridge2.0-0t64 libatk-bridge2.0-0)"
              "$(apt_choice libcups2t64 libcups2)"
              libxkbcommon0
              "$(apt_choice libasound2t64 libasound2)"
              libgbm1 libcairo2 libpango-1.0-0
              libxcomposite1 libxdamage1 libxfixes3 libxrandr2
              "$(apt_choice libatspi2.0-0t64 libatspi2.0-0)"
              libdrm2 libpangoft2-1.0-0 libcairo-gobject2
              libharfbuzz0b libfontconfig1 libfreetype6
              libpixman-1-0 libxrender1 libxshmfence1
              libavahi-common3 libavahi-client3
              "$(apt_choice libpng16-16t64 libpng16-16)"
              libxcb-render0 libxcb-shm0
              libfribidi0 libthai0 libdatrie1 libxi6 libgraphite2-3
            )
            (
              cd "$libs_dir/debs"
              timeout -k 5s 150s apt-get "${apt_opts[@]}" download "${packages[@]}"
              for deb in ./*.deb; do dpkg-deb -x "$deb" "$libs_dir/root"; done
            )
            lib_paths="$(find "$libs_dir/root" -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd: -)"
            [[ -n "$lib_paths" ]] || { echo "NO_EXTRACTED_CHROME_LIBRARIES"; exit 1; }
            export LD_LIBRARY_PATH="$lib_paths${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
            echo "Chrome library inspection after private library extraction:"
            ldd "$browser_bin" || true
          fi
          if ldd "$browser_bin" | grep -q 'not found'; then
            echo "CHROME_RUNTIME_LIBRARIES_STILL_MISSING"
            cat /etc/os-release || true
            exit 1
          fi
          "$browser_bin" --version
          echo "CELIKOM_BROWSER_BINARY=$browser_bin" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import {createWriteStream} from "node:fs";
          import {Readable} from "node:stream";
          import {pipeline} from "node:stream/promises";
          import {createGunzip} from "node:zlib";
          const url="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz";
          const response=await fetch(url);
          if(!response.ok||!response.body)throw Error("Static FFmpeg download failed: "+response.status);
          await pipeline(Readable.fromWeb(response.body),createGunzip(),createWriteStream(process.env.RUNNER_TEMP+"/celikom-tools/ffmpeg"));
          NODE
          chmod 755 "$tools_dir/ffmpeg"
          export PATH="$tools_dir:$PATH"
          echo "$tools_dir" >> "$GITHUB_PATH"
          "$tools_dir/ffmpeg" -version | head -n 1
          echo "CELIKOM_FFMPEG_BINARY=$tools_dir/ffmpeg" >> "$GITHUB_ENV"
          echo "CELIKOM_REMOVE_FFMPEG_AFTER_FIXTURES=1" >> "$GITHUB_ENV"
          echo "TMPDIR=$browser_tmp" >> "$GITHUB_ENV"
          echo "CELIKOM_BROWSER_TMP=$browser_tmp" >> "$GITHUB_ENV"
          echo "Disk after browser setup:"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Run real Chromium media and decoder regression
        env:
          REQUIRE_BROWSER_AUDIO: '1'
        run: node scripts/test-audio-gain-browser.mjs

      - name: Clean browser test runtime
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${CELIKOM_BROWSER_TMP:-}" ]]; then rm -rf -- "$CELIKOM_BROWSER_TMP"; fi
          rm -f -- "$RUNNER_TEMP/celikom-tools/ffmpeg"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Upload immutable artifact for existing tag/non-main builds
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: celikom-extension-${{ github.ref_name }}
          path: |
            extension/dist/celikom-extension-*.zip
            extension/dist/celikom-extension-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
