name: Extension artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/ci/celikom-extension-build-trigger.txt'
      - 'extension/**'
      - 'package.json'
      - 'package-lock.json'
    tags:
      - "extension-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Test and build extension
        env:
          CELIKOM_API_BASE_URL: https://api.celikom.com
        run: |
          npm run test:extension
          npm run build:extension
          npm --prefix extension run validate
          npm run security

      - name: Verify checksum
        run: cd extension/dist && sha256sum --check celikom-extension-*.zip.sha256

      - name: Verify migrated main origin and keep private extension ZIP on FlokiNET
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --test .github/scripts/tests/floki-private-build-spool.test.mjs
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const api=JSON.parse(readFileSync('extension/dist/unpacked/api/config.json','utf8'));
          const manifest=JSON.parse(readFileSync('extension/dist/unpacked/manifest.json','utf8'));
          assert.equal(api.baseUrl,'https://api.celikom.com');
          assert.deepEqual([...manifest.host_permissions].sort(),['https://api.celikom.com/*','https://music.yandex.ru/*'].sort());
          CHECK
          node .github/scripts/floki-private-build-spool.mjs \
            "$GITHUB_WORKSPACE" /home/runner/celikom-build-spool \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" --extension-only

      - name: Upload immutable artifact for existing tag/non-main builds
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: celikom-extension-${{ github.ref_name }}
          path: |
            extension/dist/celikom-extension-*.zip
            extension/dist/celikom-extension-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
