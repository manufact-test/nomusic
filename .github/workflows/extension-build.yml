name: Extension artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/ci/celikom-extension-build-trigger.txt'
      - 'extension/**'
      - 'package.json'
      - 'package-lock.json'
    tags:
      - "extension-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Test and build extension
        env:
          CELIKOM_API_BASE_URL: https://api.celikom.com
        run: |
          npm run test:extension
          npm run build:extension
          npm --prefix extension run validate

      - name: Prepare headless Chromium and FFmpeg on the Floki runner
        shell: bash
        run: |
          set -Eeuo pipefail
          browser_bin=""
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser_bin="$(command -v "$candidate")"
              break
            fi
          done
          if [[ -z "$browser_bin" ]]; then
            for candidate in /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser /opt/google/chrome/chrome; do
              if [[ -x "$candidate" ]]; then browser_bin="$candidate"; break; fi
            done
          fi
          if [[ -z "$browser_bin" ]]; then
            echo "No system Chromium found; downloading official Chrome for Testing without system installation."
            tmp="$RUNNER_TEMP/celikom-chrome"
            mkdir -p "$tmp/chrome"
            node --input-type=module <<'NODE'
          import {createWriteStream} from "node:fs";
          import {Readable} from "node:stream";
          import {pipeline} from "node:stream/promises";
          const meta=await fetch("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json").then(r=>{if(!r.ok)throw Error("Chrome version lookup failed: "+r.status);return r.json();});
          const url=meta.channels?.Stable?.downloads?.chrome?.find(x=>x.platform==="linux64")?.url;
          if(!url)throw Error("Stable Chrome for Testing linux64 URL missing");
          const response=await fetch(url);
          if(!response.ok||!response.body)throw Error("Chrome download failed: "+response.status);
          await pipeline(Readable.fromWeb(response.body),createWriteStream(process.env.RUNNER_TEMP+"/celikom-chrome/chrome.zip"));
          console.log("Downloaded Chrome for Testing "+meta.channels.Stable.version);
          NODE
            if command -v python3 >/dev/null 2>&1; then
              python3 -m zipfile -e "$tmp/chrome.zip" "$tmp/chrome"
            elif command -v unzip >/dev/null 2>&1; then
              unzip -q "$tmp/chrome.zip" -d "$tmp/chrome"
            else
              echo "ZIP_EXTRACTOR_REQUIRED"
              exit 1
            fi
            browser_bin="$tmp/chrome/chrome-linux64/chrome"
            chmod +x "$browser_bin"
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [[ "$(id -u)" == "0" ]]; then
              SUDO=()
            elif command -v sudo >/dev/null 2>&1 && sudo -n true; then
              SUDO=(sudo)
            else
              echo "FFMPEG_MISSING_AND_RUNNER_CANNOT_INSTALL_SYSTEM_PACKAGES"
              id
              exit 1
            fi
            command -v apt-get >/dev/null 2>&1 || { echo APT_GET_REQUIRED; exit 1; }
            "${SUDO[@]}" apt-get update
            "${SUDO[@]}" apt-get install -y ffmpeg
          fi
          [[ -n "$browser_bin" && -x "$browser_bin" ]] || { echo "CHROMIUM_BINARY_NOT_EXECUTABLE"; exit 1; }
          "$browser_bin" --version
          command -v ffmpeg
          ffmpeg -version | head -n 1
          echo "CELIKOM_BROWSER_BINARY=$browser_bin" >> "$GITHUB_ENV"

      - name: Run real Chromium media and decoder regression
        env:
          REQUIRE_BROWSER_AUDIO: '1'
        run: node scripts/test-audio-gain-browser.mjs

      - name: Security audit
        run: npm run security

      - name: Verify checksum
        run: cd extension/dist && sha256sum --check celikom-extension-*.zip.sha256

      - name: Verify migrated main origin and keep private extension ZIP on FlokiNET
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --test .github/scripts/tests/floki-private-build-spool.test.mjs
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const api=JSON.parse(readFileSync('extension/dist/unpacked/api/config.json','utf8'));
          const manifest=JSON.parse(readFileSync('extension/dist/unpacked/manifest.json','utf8'));
          assert.equal(api.baseUrl,'https://api.celikom.com');
          assert.deepEqual([...manifest.host_permissions].sort(),['https://api.celikom.com/*','https://music.yandex.ru/*'].sort());
          CHECK
          node .github/scripts/floki-private-build-spool.mjs \
            "$GITHUB_WORKSPACE" /home/runner/celikom-build-spool \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" --extension-only

      - name: Upload immutable artifact for existing tag/non-main builds
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: celikom-extension-${{ github.ref_name }}
          path: |
            extension/dist/celikom-extension-*.zip
            extension/dist/celikom-extension-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
