name: CELIKOM FlokiNET administrative maintenance
on:
  push:
    branches: [main]
    paths:
      - '.github/deploy/floki-maintenance-request.sh'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Revoke administrative maintenance access
        required: true
        options: [revoke]
permissions:
  contents: read
concurrency:
  group: celikom-floki-deploy
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.repository == 'manufact-test/nomusic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: floki-deploy
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Owner-enabled administrative operation
        env:
          FLOKI_DEPLOY_CONNECTION: ${{ secrets.FLOKI_DEPLOY_CONNECTION }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$FLOKI_DEPLOY_CONNECTION" ]] || { echo FLOKI_DEPLOY_SECRET_MISSING; exit 2; }
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          printf '%s\n' "$FLOKI_DEPLOY_CONNECTION" | tr -d '\r' > "$tmp/bundle"
          unset FLOKI_DEPLOY_CONNECTION
          head -n 1 "$tmp/bundle" > "$tmp/known_hosts"
          tail -n +2 "$tmp/bundle" > "$tmp/key"
          rm "$tmp/bundle"
          grep -Eq '^95\.133\.160\.111 ssh-ed25519 [A-Za-z0-9+/=]+$' "$tmp/known_hosts"
          ssh-keygen -y -P '' -f "$tmp/key" >/dev/null
          sshargs=(-T -i "$tmp/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$tmp/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20
            -o ClearAllForwardings=yes)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            ssh "${sshargs[@]}" celikom-deploy@95.133.160.111 revoke-maintenance
            exit
          fi
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]] || { echo FLOKI_STALE_REQUEST_REFUSED; exit 1; }
          unset GH_TOKEN
          request=.github/deploy/floki-maintenance-request.sh
          test -f "$request" && test ! -L "$request"
          test "$(wc -c < "$request")" -le 131072
          bash -n "$request"
          ssh "${sshargs[@]}" celikom-deploy@95.133.160.111 maintenance < "$request"
