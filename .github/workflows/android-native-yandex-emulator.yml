name: Android 11 ARMv7 translated native Yandex hook smoke (fallback ONLY)
# Archived 10.11.2026: same-package x86+ARM translator LSPatch loader
# crashes before CELIKOM module; repeated automatic runs waste CI minutes.
# Manual invocation only if concrete loader fix / suitable genuine ARM host exists.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  google-play-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Scope all proprietary binaries to the current ephemeral runner
        run: echo "CELIKOM_EMULATOR_TEST_DIR=${RUNNER_TEMP}/celikom-native-hook-test-apks" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build source-only CELIKOM read-only module
        run: gradle -p android/native-yandex-hooklab :app:assembleDebug --no-daemon
      - name: Java 21 (required only for pinned LSPatch 1.2), no signature-spoofing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify publisher-signed Yandex split set, embed observer with sigbypass=0 into RUNNER_TEMP only
        run: |
          set -eu
          python -m py_compile android/native-yandex-hooklab/ephemeral_patch_lab.py
          python android/native-yandex-hooklab/ephemeral_patch_lab.py
      - name: Confirm KVM available for isolated Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot Android 11 Google Play x86 ARMv7-translation emulator; not Android 13 parity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: google_apis_playstore
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            echo "Emulator Android version:"
            adb shell getprop ro.build.version.release
            echo "Emulator supported native ABIs:"
            adb shell getprop ro.product.cpu.abilist
            echo "Google Play store package present (NOT a Play Protect acceptance verdict):"
            adb shell pm list packages com.android.vending | grep -Fx 'package:com.android.vending'
            echo "Install 5 CELIKOM-lab-signed patched Yandex splits on EMPTY emulator, NO uninstall, root or disabled protection."
            adb install-multiple "${CELIKOM_EMULATOR_TEST_DIR}"/*.apk
            echo "Installed APK split count:"
            adb shell pm path ru.yandex.music
            test "$(adb shell pm path ru.yandex.music | grep -c 'package:')" -eq 5
            python3 android/native-yandex-hooklab/diagnose_emulator.py
      - name: Delete temporary proprietary Yandex APKs regardless of outcome, no artifact upload
        if: always()
        run: |
          rm -rf -- "${CELIKOM_EMULATOR_TEST_DIR}"
          echo "Removed all emulator-stage proprietary APK copies"
