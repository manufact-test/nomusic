name: Signed Yandex runtime source audit
on:
  push:
    branches: [feature/api-range]
    paths:
      - .github/workflows/android-yandex-runtime-audit.yml
      - tools/android-source-audit/runtime-launch-audit.py
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Retrieve and verify the exact signed publisher build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yandex-source"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 'https://d.apkpure.com/b/XAPK/ru.yandex.music?versionCode=24026501' -o "$RUNNER_TEMP/yandex.xapk"
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/yandex.xapk') as z:
              names=['ru.yandex.music.apk','config.arm64_v8a.apk','config.en.apk','config.ru.apk','config.xhdpi.apk']
              for name in names:
                  data=z.read(name)
                  if name==names[0]:
                      assert hashlib.sha256(data).hexdigest()=='a3e4d3aedd24ea0370ead4f25c4f0085a1f43b94e458ee949da86797df27fc61'
                  (pathlib.Path(os.environ['RUNNER_TEMP'])/'yandex-source'/name).write_bytes(data)
          PY
          for apk in "$RUNNER_TEMP/yandex-source/"*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/signer.txt"
            grep -Fq 'Signer #1 certificate SHA-256 digest: aca405ded8b25cb2e8c6da69425d2b4307d087c1276fc06ad5942731ccc51dba' "$RUNNER_TEMP/signer.txt"
          done
      - name: Enable test-emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run original Yandex on Android 13 without account login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: python3 tools/android-source-audit/runtime-launch-audit.py --adb "$ANDROID_HOME/platform-tools/adb" --xapk "$RUNNER_TEMP/yandex.xapk" --output "$RUNNER_TEMP/yandex-runtime"
      - name: Save only sanitized observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-runtime-observations-${{ github.sha }}
          path: |
            ${{ runner.temp }}/yandex-runtime/runtime-report.json
            ${{ runner.temp }}/yandex-runtime/initial-screen.json
            ${{ runner.temp }}/yandex-runtime/incoming-track-1.json
            ${{ runner.temp }}/yandex-runtime/incoming-track-2.json
          if-no-files-found: warn
          retention-days: 7
