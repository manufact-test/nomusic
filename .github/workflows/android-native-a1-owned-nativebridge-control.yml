name: Android A1 isolated OWN ARMv7 NativeBridge LSPatch A/B (no vendor)
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/android-native-a1-lspatch-clone-loader0-20261111
    paths:
      - 'android/native-yandex-hooklab/own_lspatch_nativebridge_control.py'
      - '.github/workflows/android-native-a1-owned-nativebridge-control.yml'
      - 'android/native-yandex-hooklab/clone_main_crash_buffer.py'
      - 'android/native-yandex-hooklab/clone_lspatch_loader_zero.py'
permissions:
  contents: read
jobs:
  disposable-owned-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build only our ARMv7 no-permission native app (no Yandex)
        run: gradle -p android/native-yandex-hooklab/armv7-loader-host :app:assembleDebug --no-daemon
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create upstream zero-signature-bypass own APK, no modules
        run: |
          python3 -m py_compile android/native-yandex-hooklab/own_lspatch_nativebridge_control.py
          export CELIKOM_OWNED_ARTIFACT_DIR="$RUNNER_TEMP/celikom-owned-bridge-control"
          python3 android/native-yandex-hooklab/build_owned_loader_host.py
      - name: Enable disposable emulator virtualization
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Compare OWN ARMv7 native baseline versus patched mirror (Yandex absent)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_5
          emulator-boot-timeout: 480
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: CELIKOM_OWN_BRIDGE_CONTROL=1 python3 android/native-yandex-hooklab/own_lspatch_nativebridge_control.py
      - name: Ensure no own compiled artifact is retained
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/celikom-owned-bridge-control"
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo "Only ephemeral OWN APK, no Yandex artifacts or phone access"
