name: CELIKOM private release publisher static gates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/floki-extension-owner-consumer.py'
      - '.github/scripts/floki-extension-owner-install.sh'
      - '.github/scripts/floki-release-owner-bootstrap.sh'
      - '.github/scripts/floki-runner2-signed-spool-parity.sh'
      - '.github/scripts/floki-windows-customer-stable-consumer.py'
      - '.github/scripts/floki-windows-customer-stable-install.sh'
      - '.github/scripts/tests/floki-windows-customer-stable-consumer.test.py'
      - '.github/scripts/tests/floki-windows-owner-verified-receipt.test.py'
      - '.github/release/windows-customer-stable.json'
      - '.github/scripts/floki-android-stable-root-consumer.py'
      - '.github/scripts/floki-android-stable-owner-install.sh'
      - '.github/scripts/tests/floki-android-stable-root-consumer.test.py'
      - '.github/scripts/floki-android-customer-stable-consumer.py'
      - '.github/scripts/floki-android-customer-stable-install.sh'
      - '.github/scripts/tests/floki-android-customer-stable-consumer.test.py'
      - '.github/scripts/tests/floki-release-bootstrap-pins.test.py'
      - '.github/scripts/floki-release-public-receipt.py'
      - '.github/scripts/floki-release-status-install.sh'
      - '.github/scripts/tests/floki-release-public-receipt.test.py'
      - '.github/release/android-customer-stable.json'
      - '.github/scripts/tests/floki-extension-owner-consumer.test.py'
      - '.github/workflows/celikom-publisher-static-gates.yml'
permissions:
  contents: read
# Only the latest mainline source state needs static release gates.
# No artifact publishing or root activation occurs in this workflow.
concurrency:
  group: celikom-publisher-static-main
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate trusted extension publisher without host privileges
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/floki-extension-owner-consumer.py
          bash -n .github/scripts/floki-extension-owner-install.sh
          bash -n .github/scripts/floki-release-owner-bootstrap.sh
          bash -n .github/scripts/floki-runner2-signed-spool-parity.sh
          ! grep -q EXTENSION_INSTALL_BLOB_TO_PIN .github/scripts/floki-release-owner-bootstrap.sh
          python3 .github/scripts/tests/floki-extension-owner-consumer.test.py
          echo EXTENSION_PRIVATE_PUBLISHER_STATIC_GATES_OK
      - name: Verify Windows saved root consumer syntax and safety suite
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/floki-windows-signed-root-consumer.py
          bash -n .github/scripts/floki-windows-owner-download-bootstrap.sh
          bash -n .github/scripts/floki-windows-root-consumer-install.sh
          python3 .github/scripts/tests/floki-windows-signed-root-consumer.test.py
          python3 .github/scripts/tests/floki-windows-owner-verified-receipt.test.py
          python3 -m py_compile .github/scripts/floki-windows-customer-stable-consumer.py
          bash -n .github/scripts/floki-windows-customer-stable-install.sh
          python3 .github/scripts/tests/floki-windows-customer-stable-consumer.test.py
          ! grep -q CONSUMER_BLOB_PIN .github/scripts/floki-windows-customer-stable-install.sh
          echo WINDOWS_PRIVATE_PUBLISHER_STATIC_GATES_OK
      - name: Verify independently signed legacy Android owner promoter
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/floki-android-stable-root-consumer.py
          bash -n .github/scripts/floki-android-stable-owner-install.sh
          python3 .github/scripts/tests/floki-android-stable-root-consumer.test.py
          echo ANDROID_STABLE_OWNER_PROMOTER_STATIC_GATES_OK
          python3 -m py_compile .github/scripts/floki-android-customer-stable-consumer.py
          bash -n .github/scripts/floki-android-customer-stable-install.sh
          python3 .github/scripts/tests/floki-android-customer-stable-consumer.test.py
          echo ANDROID_PUBLIC_STABLE_OTA_STATIC_GATES_OK
          python3 .github/scripts/tests/floki-release-bootstrap-pins.test.py
          echo CELIKOM_ONE_TIME_RELEASE_ACTIVATION_SOURCE_PINS_OK
          python3 -m py_compile .github/scripts/floki-release-public-receipt.py
          bash -n .github/scripts/floki-release-status-install.sh
          python3 .github/scripts/tests/floki-release-public-receipt.test.py
          echo CELIKOM_SHA_ONLY_RELEASE_STATUS_PRIVACY_GATE_OK
