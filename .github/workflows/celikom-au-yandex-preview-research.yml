name: CELIKOM Au official anonymous preview availability
on:
  push:
    branches: [feature/api-range]
    paths: [.github/workflows/celikom-au-yandex-preview-research.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check only anonymous official Yandex preview endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          urls=[
           'https://api.music.yandex.net/tracks/144530503',
           'https://api.music.yandex.net/tracks/144530503/download-info'
          ]
          for url in urls:
            label='metadata' if url.endswith('144530503') else 'download-info'
            try:
              request=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=20) as r:
                body=r.read(200000)
                data=json.loads(body)
                x=data.get('result') if isinstance(data,dict) else data
                if isinstance(x,list):x=x[:4]
                fields=[{'preview':bool(q.get('preview')),'codec':q.get('codec'),
                         'container':q.get('container'),'signed_preview_available':bool(q.get('downloadInfoUrl'))}
                        for q in x if isinstance(q,dict)] if isinstance(x,list) else []
                print(json.dumps({'endpoint':label,'status':r.status,'root_type':type(x).__name__,'preview_options':fields},ensure_ascii=False))
            except urllib.error.HTTPError as e:
              print(json.dumps({'endpoint':label,'status':e.code}))
            except Exception as e:
              print(json.dumps({'endpoint':label,'error':type(e).__name__,'message':str(e)[:150]}))
          PY
