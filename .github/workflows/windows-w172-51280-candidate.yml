name: CELIKOM W172 official Yandex 5.128.0 compatibility candidate

on:
  push:
    branches:
      - experiment/windows-w172-yandex-51280-compat-20261121
    paths:
      - .github/workflows/windows-w172-51280-candidate.yml
      - windows-companion/w15/Celikom.Companion/**
      - windows-companion/w15/Celikom.Companion.Tests/**
      - windows-companion/w24/Celikom.NativeInstaller/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-51280-candidate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the unchanged CELIKOM native module
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --prefix windows-companion/w23
          if ($LASTEXITCODE -ne 0) { throw 'W172_NATIVE_DEPENDENCIES_FAILED' }
          node windows-companion/w23/build.mjs
          if ($LASTEXITCODE -ne 0) { throw 'W172_NATIVE_BUILD_FAILED' }
      - name: Download and verify official signed Yandex 5.128.0; test real native install/restore
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'w172-yandex-51280-candidate.json'
          ./windows-companion/w81/Watch-YandexWindowsRelease.ps1 -ForceVersion '5.128.0' -ValidateCandidate -ReportPath $report
          if ($LASTEXITCODE -notin @(0,$null)) { throw 'W172_VENDOR_CANDIDATE_FAILED' }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          if ($data.status -ne 'candidate_requires_runtime_review' -or
              $data.vendorVersion -ne '5.128.0' -or
              $data.exeVersion -notmatch '^5\.128\.0\.' -or
              $data.installerSha256 -notmatch '^[0-9a-f]{64}$' -or
              $data.exeSha256 -notmatch '^[0-9a-f]{64}$' -or
              $data.asarSha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'W172_OFFICIAL_51280_PROVENANCE_OR_IMAGE_INVALID'
          }
          foreach ($required in @('vendor-installer-signature','inner-executable-signature-and-version','native-image-builder-staged','native-install-and-byte-exact-restore-sandbox')) {
            if ($data.checks -notcontains $required) { throw "W172_MISSING_CHECK_$required" }
          }
          Write-Host "W172_OFFICIAL_YANDEX_51280_VERIFIED exeVersion=$($data.exeVersion)"
          Write-Host "W172_INSTALLER_SHA256=$($data.installerSha256)"
          Write-Host "W172_EXE_SHA256=$($data.exeSha256)"
          Write-Host "W172_ASAR_SHA256=$($data.asarSha256)"
          Write-Host 'W172_NATIVE_IMAGE_AND_BYTE_EXACT_RESTORE_PASS'
      - name: Existing native image, recovery and Windows Start contracts
        shell: pwsh
        run: |
          dotnet run --project windows-companion/w24/Celikom.NativeInstaller.Tests/Celikom.NativeInstaller.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'W172_NATIVE_IMAGE_CONTRACT_FAILED' }
          dotnet run --project windows-companion/w21/Celikom.Recovery.Tests/Celikom.Recovery.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'W172_RECOVERY_CONTRACT_FAILED' }
          dotnet run --project windows-companion/w15/Celikom.Companion.Tests/Celikom.Companion.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'W172_START_CONTRACT_FAILED' }
          dotnet build windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'W172_GUI_BUILD_FAILED' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CELIKOM-W172-YANDEX-51280-CANDIDATE-REPORT
          path: ${{ runner.temp }}/w172-yandex-51280-candidate.json
          if-no-files-found: error
          retention-days: 14
