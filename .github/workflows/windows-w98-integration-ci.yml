name: CELIKOM Windows integration CI (no installer)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-build-ci:
    name: Linux extension and server package build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo
          coverage: none
      - name: W113 schema-2 stable release manifest publisher contract
        run: node --test .github/scripts/tests/windows-stable-manifest.test.mjs
      - name: Validate Hostinger workflow YAML and owner-scoped private gain staging scripts
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/hostinger-deploy.yml"); puts "W98_HOSTINGER_WORKFLOW_YAML_PASS"'
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/windows-w98-private-gain-reconcile.yml"); puts "W98_PRIVATE_GAIN_RECONCILE_WORKFLOW_YAML_PASS"'
          bash -n .github/scripts/hostinger-windows-gain-stage.sh
          grep -F 'W98_COPY_TARGET_ALREADY_PREFIXED' .github/scripts/hostinger-windows-gain-stage.sh
          grep -F 'copy_to_remote "$work/manifest.json" "$manifest_remote"' .github/scripts/hostinger-windows-gain-stage.sh
          bash -n .github/scripts/hostinger-windows-qa-publish.sh
          php -l .github/scripts/hostinger-windows-gain-remote.php
          node --check .github/scripts/hostinger-windows-gain-verify.mjs
          node --test .github/scripts/tests/hostinger-windows-gain-verify.test.mjs
          grep -F "sidecar_sha256" .github/scripts/hostinger-windows-gain-remote.php
          grep -F "explicit_owner_email_required" .github/scripts/hostinger-windows-gain-remote.php
          grep -F "WHERE u.email = ?" .github/scripts/hostinger-windows-gain-remote.php
          grep -F "CELIKOM_W98_TEST_EMAIL" .github/scripts/hostinger-windows-gain-stage.sh
      - name: Build browser extension and private server package on supported ZIP runner
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run security

  windows-integration-ci:
    needs: portable-build-ci
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install FFmpeg for repository MP3/AAC fixture tests
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'W98_FFMPEG_INSTALL_FAILED' }
          Get-Command ffmpeg
          ffmpeg -version | Select-Object -First 1
      - name: Windows-compatible repository checks (Linux PHP smoke runs in server CI)
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'W98_NPM_CI_INSTALL_FAILED' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'W98_REPOSITORY_LINT_FAILED' }
          npm run test:poc
          if ($LASTEXITCODE -ne 0) { throw 'W98_POC_TESTS_FAILED' }
          npm run test:extension
          if ($LASTEXITCODE -ne 0) { throw 'W98_EXTENSION_TESTS_FAILED' }
          npm run validate
          if ($LASTEXITCODE -ne 0) { throw 'W98_REPOSITORY_VALIDATION_FAILED' }
          # ZIP packaging is exercised by portable-build-ci on Linux. Do not
          # invoke the Unix-only zip command from the Windows runner.
          npm run security
          if ($LASTEXITCODE -ne 0) { throw 'W98_SECURITY_AUDIT_FAILED' }
      - name: Build W23 native bridge bundle
        shell: pwsh
        working-directory: windows-companion/w23
        run: |
          npm install --no-audit --no-fund --no-package-lock
          if ($LASTEXITCODE -ne 0) { throw 'W98_W23_NPM_FAILED' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'W98_W23_BUILD_FAILED' }
          $nativeHostText=Get-Content dist/host.cjs -Raw
          $rendererText=Get-Content dist/renderer.js -Raw
          $rendererSource=Get-Content renderer-entry.mjs -Raw
          $recoverySource=Get-Content transient-source-recovery.mjs -Raw
          $mainWindowText=Get-Content ..\w15\Celikom.Companion\MainWindow.cs -Raw
          $startGateText=Get-Content ..\w15\Celikom.Companion\PlaybackStartGate.cs -Raw
          $supervisorLauncherText=Get-Content ..\w15\Celikom.Companion\StableUpdateSupervisorLauncher.cs -Raw
          $supervisorProgramText=Get-Content ..\w15\Celikom.UpdateSupervisor\Program.cs -Raw
          $supervisorTestsText=Get-Content ..\w15\Celikom.UpdateSupervisor.Tests\Program.cs -Raw
          $stableManifestVerifierText=Get-Content ..\w15\Celikom.Companion\StableUpdateManifestVerifier.cs -Raw
          $stableManifestFetcherText=Get-Content ..\w15\Celikom.Companion\StableUpdateManifestFetcher.cs -Raw
          $stableCoordinatorText=Get-Content ..\w15\Celikom.Companion\StableUpdateInstallCoordinator.cs -Raw
          $mainWindowStableText=Get-Content ..\w15\Celikom.Companion\MainWindow.StableUpdate.cs -Raw
          $appUpdateManagerText=Get-Content ..\w15\Celikom.Companion\AppUpdateManager.cs -Raw
          $detachStart=$nativeHostText.IndexOf('debug.on("detach"', [StringComparison]::Ordinal)
          $detachEnd=$nativeHostText.IndexOf('Promise.resolve(debug.sendCommand("Media.enable"))', $detachStart, [StringComparison]::Ordinal)
          if ($detachStart -lt 0 -or $detachEnd -le $detachStart) {
            throw 'W125_DECODER_DETACH_GUARD_BOUNDS_INVALID'
          }
          $detachHandler=$nativeHostText.Substring($detachStart, $detachEnd - $detachStart)
          $guardChecks=@(
            $nativeHostText.Contains('maxTotalBufferSize: 2 * 1024 * 1024'),
            $nativeHostText.Contains('NATIVE_ORIGINAL_SOURCE_NO_RELOAD'),
            $nativeHostText.Contains('PLAYER_CURRENT_NATIVE_VOLUME_DROP'),
            $nativeHostText.Contains('setInterval(() => {'),
            $nativeHostText.Contains('lastDeliveredState'),
            $detachHandler.Contains('verifiedDecoderSource.delete(view)'),
            $detachHandler.Contains('nativeNetworkObserversReady.delete(view)'),
            $detachHandler.Contains('decoderPlayers.clear()'),
            $nativeHostText.Contains('NATIVE_ELECTRON_CPU_HIGH'),
            $nativeHostText.Contains('}, 300);'),
            $nativeHostText.Contains('CELIKOM_NATIVE_VERSION = "0.24.29"'),
            $rendererText.Contains('__celikomBridgeNativeRecoverSourceLeft'),
            $rendererSource.Contains('SOURCE_LEFT_CURRENT_RECOVERY_SCHEDULED'),
            $recoverySource.Contains('confirmationDelayMs = 150'),
            $recoverySource.Contains('job.phase = "confirm"'),
            $recoverySource.Contains('job.phase === "reload"'),
            (([regex]::Matches($mainWindowText, 'PlaybackStartGate\.CanAcceptStart\(')).Count -ge 2),
            $mainWindowText.Contains('_compactStarting && !_bridge.Enabled ? "Проверяем Яндекс.Музыку…"'),
            $startGateText.Contains('!compactStarting'),
            $supervisorLauncherText.Contains('StableUpdateSupervisorHandshake.WaitForReadyAsync'),
            $supervisorLauncherText.Contains('record.State != StableUpdateRollbackJournal.Phase.Prepared'),
            $supervisorLauncherText.Contains('Process.Start'),
            $supervisorProgramText.Contains('StableUpdateSupervisorHandshake.SignalReadyAsync'),
            $supervisorTestsText.Contains('StableUpdateSupervisorHandshake.WaitForReadyAsync'),
            $stableManifestVerifierText.Contains('VerifyIfNewer'),
            $stableManifestFetcherText.Contains('FetchSignedIfNewerWithClientAsync'),
            $stableCoordinatorText.Contains('StableUpdateSupervisorLauncher.StartAsync'),
            $stableCoordinatorText.Contains('StableUpdateManifestFetcher.FetchSignedIfNewerAsync'),
            $stableCoordinatorText.Contains('StableUpdateInstallSafety.CanInstall'),
            $stableCoordinatorText.Contains('StableUpdateRollbackJournal.Phase.Prepared'),
            $stableCoordinatorText.Contains('StableUpdateRollbackJournal.Phase.InstallerStarted'),
            $mainWindowStableText.Contains('Interval = 30 * 60 * 1000'),
            $mainWindowStableText.Contains('StableUpdateInstallCoordinator.CheckAndInstallAsync'),
            $appUpdateManagerText.Contains('LaunchVerifiedSigned')
          )
          Write-Host "W103_W23_GUARD_CHECKS=$($guardChecks -join ',')"
          if ($guardChecks -contains $false) {
            throw 'W103_W23_INTEGRATION_GUARDS_MISSING'
          }
      - name: W22/W23/W60 original-source, VPN, 403 and audio regressions
        shell: pwsh
        run: |
          node --test windows-companion/w22/native-resource-adapter.test.mjs windows-companion/w23/transient-source-recovery.test.mjs windows-companion/w23/deferred-track-recovery.test.mjs windows-companion/w23/renderer-relay.test.mjs windows-companion/w23/native-host.test.mjs windows-companion/w60/current-source-refresh.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'W98_AUDIO_REGRESSION' }
      - name: W21 crash rollback and unknown updater refusal
        run: dotnet run --project windows-companion/w21/Celikom.Recovery.Tests/Celikom.Recovery.Tests.csproj -c Release
      - name: W24 reviewed catalog and ASAR builder
        run: dotnet run --project windows-companion/w24/Celikom.NativeInstaller.Tests/Celikom.NativeInstaller.Tests.csproj -c Release
      - name: W15 entitlement, login and native state tests
        run: dotnet run --project windows-companion/w15/Celikom.Companion.Tests/Celikom.Companion.Tests.csproj -c Release
      - name: Compile GUI with warnings as errors
        run: dotnet build windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj -c Release -warnaserror
      - name: W110 build independent update supervisor with warnings as errors
        run: dotnet build windows-companion/w15/Celikom.UpdateSupervisor/Celikom.UpdateSupervisor.csproj -c Release -warnaserror
      - name: W114 same CELIKOM installer carries the signed-payload supervisor
        shell: pwsh
        run: |
          $iss = Get-Content windows-companion/w20/installer/CELIKOM.iss -Raw
          $w20 = Get-Content .github/workflows/windows-w20-safe-installer.yml -Raw
          $release = Get-Content .github/workflows/hostinger-deploy.yml -Raw
          if (-not $iss.Contains('Source: "..\publish\CELIKOM.UpdateSupervisor.exe"; DestDir: "{app}"')) { throw 'W114_INNO_SUPERVISOR_ENTRY_MISSING' }
          if (-not $w20.Contains('dotnet publish windows-companion/w15/Celikom.UpdateSupervisor/Celikom.UpdateSupervisor.csproj')) { throw 'W114_W20_SUPERVISOR_BUILD_MISSING' }
          if (-not $release.Contains('dotnet publish windows-companion/w15/Celikom.UpdateSupervisor/Celikom.UpdateSupervisor.csproj')) { throw 'W114_RELEASE_SUPERVISOR_BUILD_MISSING' }
          if (-not $release.Contains('W114_SUPERVISOR_NOT_INSTALLED')) { throw 'W114_INSTALLED_SUPERVISOR_SMOKE_MISSING' }
          Write-Output 'W114_SAME_PRODUCT_INSTALLER_SUPERVISOR_PASS'
      - name: W20 installer stage allowlist includes app, native assets and supervisor
        shell: pwsh
        run: |
          & ./windows-companion/w20/release-gate.ps1 -Mode Stage
          if ($LASTEXITCODE -notin @(0,$null)) { throw 'W20_STAGE_GATE_FAILED' }
      - name: W110 crash-independent watchdog health and rollback simulation
        run: dotnet run --project windows-companion/w15/Celikom.UpdateSupervisor.Tests/Celikom.UpdateSupervisor.Tests.csproj -c Release
      - name: W110 unsigned production helper refuses automatic recovery
        shell: pwsh
        run: |
          dotnet run --no-build --project windows-companion/w15/Celikom.UpdateSupervisor/Celikom.UpdateSupervisor.csproj -c Release -- --supervise 11111111111111111111111111111111
          if ($LASTEXITCODE -ne 3) {
            throw "W110_FAIL_CLOSED_PRODUCTION_SIGNER_PIN_MISSING"
          }
          Write-Output 'W110_PRODUCTION_ROLLBACK_DISABLED_UNTIL_SIGNING_PASS'
          exit 0
      - name: W117 production trust and startup bootstrap remain fail-closed
        shell: pwsh
        run: |
          $trust = Get-Content windows-companion/w15/Celikom.Companion/StableUpdateTrustConfiguration.cs -Raw
          $main = Get-Content windows-companion/w15/Celikom.Companion/MainWindow.cs -Raw
          $supervisor = Get-Content windows-companion/w15/Celikom.UpdateSupervisor/Program.cs -Raw
          if (-not $trust.Contains('private const string ProductionFeedOrigin = "";') -or
              -not $trust.Contains('private const string ProductionManifestPublicKeyDerBase64 = "";') -or
              -not $trust.Contains('private const string ProductionSignerCertificateSha256 = "";')) {
            throw 'W117_PRODUCTION_TRUST_MUST_REMAIN_UNPROVISIONED'
          }
          if (-not $main.Contains('Task.Run(BootstrapStableRollbackIfConfiguredAsync)') -or
              -not $main.Contains('StableUpdateTrustConfiguration.TryGetProduction') -or
              -not $main.Contains('StableUpdateBootstrapper.EnsureInitialLastKnownGoodAsync')) {
            throw 'W117_BOOTSTRAP_STARTUP_GATE_MISSING'
          }
          $begin = $main.IndexOf('private async Task BootstrapStableRollbackIfConfiguredAsync()', [StringComparison]::Ordinal)
          $end = $main.IndexOf('private static string DescribeIntegrationFailure', $begin, [StringComparison]::Ordinal)
          if ($begin -lt 0 -or $end -le $begin) { throw 'W117_BOOTSTRAP_METHOD_BOUNDS_INVALID' }
          $body = $main.Substring($begin, $end - $begin)
          if ($body.Contains('Process.Start(') -or $body.Contains('AppUpdateManager.Launch(')) {
            throw 'W117_BOOTSTRAP_MUST_NOT_INSTALL_OR_RESTART'
          }
          if (-not $body.Contains('CanLaunchWithoutPlaybackInterrupt(_bridge.Enabled)')) {
            throw 'W117_BOOTSTRAP_MUST_WAIT_FOR_YANDEX_IDLE'
          }
          if (-not $supervisor.Contains('StableUpdateTrustConfiguration.TryGetProduction')) {
            throw 'W117_SUPERVISOR_SHARED_TRUST_GATE_MISSING'
          }
          Write-Output 'W117_FAIL_CLOSED_TRUST_AND_BOOTSTRAP_PASS'
      - name: W108 app updater never autoplays Yandex or reports ticket as health
        shell: pwsh
        run: |
          $source = Get-Content windows-companion/w15/Celikom.Companion/MainWindow.cs -Raw
          $begin = $source.IndexOf('private async Task CompleteApplicationUpdateAsync()', [StringComparison]::Ordinal)
          if ($begin -lt 0) { throw 'W108_UPDATER_ENTRY_MISSING' }
          $end = $source.IndexOf('private static string DescribeIntegrationFailure', $begin, [StringComparison]::Ordinal)
          if ($end -le $begin) { throw 'W108_UPDATER_END_MISSING' }
          $body = $source.Substring($begin, $end - $begin)
          if ($body.Contains('Process.Start(') -or $body.Contains('APP_UPDATE_COMPLETED')) {
            throw 'W108_POST_UPDATE_AUTOPLAY_OR_FALSE_HEALTH'
          }
          if (-not $body.Contains('APP_UPDATE_NEW_EXE_STARTED') -or
              -not $source.Contains('CanLaunchWithoutPlaybackInterrupt(_bridge.Enabled)') -or
              -not $source.Contains('AppUpdateManager.ClearPending()')) {
            throw 'W108_UPGRADE_SAFETY_GATES_MISSING'
          }
          Write-Output 'W108_NO_AUTOPLAY_OR_PREMATURE_SUCCESS_PASS'
