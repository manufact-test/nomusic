name: CELIKOM Windows W98 integrated QA CI (no installer)

on:
  push:
    branches:
      - experiment/windows-w98-integrated-gain-and-original-vpn-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-build-ci:
    name: Linux extension and server package build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo
          coverage: none
      - name: Validate Hostinger workflow YAML and owner-scoped private gain staging scripts
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/hostinger-deploy.yml"); puts "W98_HOSTINGER_WORKFLOW_YAML_PASS"'
          bash -n .github/scripts/hostinger-windows-gain-stage.sh
          bash -n .github/scripts/hostinger-windows-qa-publish.sh
          php -l .github/scripts/hostinger-windows-gain-remote.php
          grep -F "explicit_owner_email_required" .github/scripts/hostinger-windows-gain-remote.php
          grep -F "WHERE u.email = ?" .github/scripts/hostinger-windows-gain-remote.php
          grep -F "CELIKOM_W98_TEST_EMAIL" .github/scripts/hostinger-windows-gain-stage.sh
      - name: Build browser extension and private server package on supported ZIP runner
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run security

  windows-integration-ci:
    needs: portable-build-ci
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install FFmpeg for repository MP3/AAC fixture tests
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'W98_FFMPEG_INSTALL_FAILED' }
          Get-Command ffmpeg
          ffmpeg -version | Select-Object -First 1
      - name: Windows-compatible repository checks (Linux PHP smoke runs in server CI)
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'W98_NPM_CI_INSTALL_FAILED' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'W98_REPOSITORY_LINT_FAILED' }
          npm run test:poc
          if ($LASTEXITCODE -ne 0) { throw 'W98_POC_TESTS_FAILED' }
          npm run test:extension
          if ($LASTEXITCODE -ne 0) { throw 'W98_EXTENSION_TESTS_FAILED' }
          npm run validate
          if ($LASTEXITCODE -ne 0) { throw 'W98_REPOSITORY_VALIDATION_FAILED' }
          # ZIP packaging is exercised by portable-build-ci on Linux. Do not
          # invoke the Unix-only zip command from the Windows runner.
          npm run security
          if ($LASTEXITCODE -ne 0) { throw 'W98_SECURITY_AUDIT_FAILED' }
      - name: Build W23 native bridge bundle
        shell: pwsh
        working-directory: windows-companion/w23
        run: |
          npm install --no-audit --no-fund --no-package-lock
          if ($LASTEXITCODE -ne 0) { throw 'W98_W23_NPM_FAILED' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'W98_W23_BUILD_FAILED' }
          $nativeHostText=Get-Content dist/host.cjs -Raw
          $rendererText=Get-Content dist/renderer.js -Raw
          if ($nativeHostText -notmatch 'maxTotalBufferSize: 2 \* 1024 \* 1024' -or
              $nativeHostText -notmatch 'NATIVE_ORIGINAL_SOURCE_NO_RELOAD' -or
              $nativeHostText -notmatch 'PLAYER_CURRENT_NATIVE_VOLUME_DROP' -or
              $nativeHostText -notmatch 'setInterval\(\(\) => \{' -or
              $nativeHostText -notmatch 'CELIKOM_NATIVE_VERSION = "0.24.29"' -or
              $rendererText -notmatch '__celikomBridgeNativeRecoverSourceLeft' -or
              $rendererText -notmatch 'SOURCE_LEFT_CURRENT_RECOVERY_SCHEDULED') {
            throw 'W99_W23_INTEGRATION_GUARDS_MISSING'
          }
      - name: W22/W23/W60 original-source, VPN, 403 and audio regressions
        shell: pwsh
        run: |
          node --test windows-companion/w22/native-resource-adapter.test.mjs windows-companion/w23/transient-source-recovery.test.mjs windows-companion/w23/deferred-track-recovery.test.mjs windows-companion/w23/renderer-relay.test.mjs windows-companion/w23/native-host.test.mjs windows-companion/w60/current-source-refresh.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'W98_AUDIO_REGRESSION' }
      - name: W21 crash rollback and unknown updater refusal
        run: dotnet run --project windows-companion/w21/Celikom.Recovery.Tests/Celikom.Recovery.Tests.csproj -c Release
      - name: W24 reviewed catalog and ASAR builder
        run: dotnet run --project windows-companion/w24/Celikom.NativeInstaller.Tests/Celikom.NativeInstaller.Tests.csproj -c Release
      - name: W15 entitlement, login and native state tests
        run: dotnet run --project windows-companion/w15/Celikom.Companion.Tests/Celikom.Companion.Tests.csproj -c Release
      - name: Compile GUI with warnings as errors
        run: dotnet build windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj -c Release -warnaserror
