name: Android Google Play vs RuStore signed DEX equality audit
on:
  push:
    branches:
      - experiment/android-native-yandex-gate1-20261109
    paths:
      - '.github/workflows/android-native-compare-gpr-rur.yml'
      - 'tools/android-native-gate1/compare_gpr_rur_dex.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-verified-code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate audit scripts and installed APK certificate tools
        run: |
          python -m py_compile tools/android-native-gate1/compare_gpr_rur_dex.py
          test -n "${ANDROID_HOME}"
          find "${ANDROID_HOME}/build-tools" -name apksigner -type f | head -1 | grep -q apksigner
      - name: Compare both publisher-verified distributions without installing, executing or retaining binaries
        run: python tools/android-native-gate1/compare_gpr_rur_dex.py
