name: Diagnose intermittent extension API timeout
on:
  push:
    branches: [feature/api-range]
    paths: [.github/workflows/network-timeout-audit-20261014.yml]
permissions:
  contents: read
concurrency:
  group: celikom-hostinger-private-test
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only PHP, MySQL and HTTPS latency checks
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          target=u235811320@92.113.19.189
          remote=/home/u235811320/domains/darkred-camel-588676.hostingersite.com/celikom/incoming/duration-audit-${GITHUB_RUN_ID}.php
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$work/key"
          ssh-keygen -y -P '' -f "$work/key" > "$work/public"
          test "$(ssh-keygen -lf "$work/public" -E sha256 | awk '{print $2}')" = 'SHA256:Q6FyifXRq6garceQdIIjBmXhkk81Ic1p/x9JTSYHWUk'
          printf '%s\n' '[92.113.19.189]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAf8M2EVwq0oJI8I9KZ0NFE8P8yDOvDATEhkQti/Kk/0' > "$work/known_hosts"
          opts=(-i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          trap 'ssh -p 65002 "${opts[@]}" "$target" "rm -f '\''$remote'\''" || true; rm -rf "$work"' EXIT
          cat > "$work/audit.php" <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          try {
          $app='/home/u235811320/domains/darkred-camel-588676.hostingersite.com/celikom';
          $release=realpath($app.'/current');require $release.'/bootstrap.php';$config=require $release.'/config/app.php';
          $start=microtime(true);$pdo=Celikom\Database\Connection::open($config);$pdo->query('SELECT 1')->fetchColumn();$dbMs=round((microtime(true)-$start)*1000,2);
          $service=new Celikom\Application($config);$internal=[];
          foreach(['/api/v1/health','/api/v1/config','/api/v1/auth/me'] as $path){$start=microtime(true);$res=$service->handle('GET',$path,[],[]);$internal[]=['endpoint'=>$path,'status'=>$res->status,'elapsed_ms'=>round((microtime(true)-$start)*1000,2)];}
          $external=[];
          for($i=0;$i<3;$i++)foreach(['/api/v1/health','/api/v1/config','/api/v1/auth/me'] as $path){
          $c=curl_init('https://darkred-camel-588676.hostingersite.com'.$path);curl_setopt_array($c,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_CONNECTTIMEOUT=>8,CURLOPT_TIMEOUT=>12,CURLOPT_FOLLOWLOCATION=>false]);curl_exec($c);$info=curl_getinfo($c);$error=curl_errno($c);curl_close($c);$external[]=['endpoint'=>$path,'status'=>$info['http_code'],'curl_errno'=>$error,'tls_ms'=>round($info['appconnect_time']*1000,2),'first_byte_ms'=>round($info['starttransfer_time']*1000,2),'total_ms'=>round($info['total_time']*1000,2)];}
          echo json_encode(['read_only'=>true,'release'=>basename($release),'db_connect_query_ms'=>$dbMs,'internal'=>$internal,'on_host_https'=>$external,'auth_enabled'=>(bool)$config['auth_enabled'],'entitlement_enabled'=>(bool)$config['entitlement_enabled']],JSON_THROW_ON_ERROR),"\n";
          }catch(Throwable $e){fwrite(STDERR,'Read-only connectivity diagnostic failed: '.get_class($e)."\n");exit(1);}
          PHP
          scp -P 65002 "${opts[@]}" "$work/audit.php" "$target:$remote"
          ssh -p 65002 "${opts[@]}" "$target" "/opt/alt/php83/usr/bin/php '$remote'"
