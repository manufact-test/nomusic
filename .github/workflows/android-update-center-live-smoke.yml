name: CELIKOM Android Update Center live read only smoke
on:
  push:
    branches: [feature/android-unified-preparation-seek-gate]
    paths: [.github/workflows/android-update-center-live-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect actual HTTPS Android endpoints without writes
        shell: bash
        run: |
          set -euo pipefail
          base=https://lemonchiffon-narwhal-791953.hostingersite.com
          for path in /download/android /updates/android/stable.json; do
            echo "CHECK $path"
            for method in HEAD GET; do
              curl -sS --max-time 25 -L -X "$method" -o /tmp/celikom-smoke-out -w "method=$method http=%{http_code} size=%{size_download} content_type=%{content_type}\n" "$base$path" || true
              if [ "$method" = GET ] && [ "$path" = /updates/android/stable.json ];then
                python3 - <<'PY'
import json
from pathlib import Path
data=Path('/tmp/celikom-smoke-out').read_bytes()
try:
 j=json.loads(data)
 print('manifest:',j.get('versionName'),j.get('versionCode'),j.get('sizeBytes'),j.get('apkSha256'))
except Exception as e:print('manifest_NOT_JSON',str(e)[:100])
PY
              fi
            done
          done
