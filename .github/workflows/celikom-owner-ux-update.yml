name: CELIKOM website owner edits staging
on:
  push:
    branches: [feature/api-range]
    paths:
      - .github/workflows/celikom-owner-ux-update.yml
permissions:
  contents: read
concurrency:
  group: celikom-website-staging
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Verify owner polish without touching CMS database
        run: |
          set -euo pipefail
          php website/tests/CmsOwnerPolishTest.php
          node --check website/public/assets/js/v10/owner-polish.js
          grep -Fq '&& false' .github/workflows/deploy-celikom-website.yml
      - name: Copy five reviewed files to the isolated, existing staging site
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = manufact-test/nomusic
          test "$GITHUB_REF" = refs/heads/feature/api-range
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$SSH_KEY" > "$tmp/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$tmp/known"
          chmod 600 "$tmp/key" "$tmp/known"
          so=(-T -p 65002 -i "$tmp/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known")
          co=(-P 65002 -i "$tmp/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known")
          dest=u235811320@92.113.19.189
          root=/home/u235811320/domains/lemonchiffon-narwhal-791953.hostingersite.com
          ssh "${so[@]}" "$dest" "test -f '$root/celikom-private/app/staging-approved.php' && test ! -e '$root/celikom-private/app/release-approved.php' && test -f '$root/public_html/admin/index.php' && test -f '$root/public_html/index.php'"
          ssh "${so[@]}" "$dest" "mkdir -m 700 -p '$root/celikom-private/ux-backup-$GITHUB_SHA' && cp -p '$root/public_html/index.php' '$root/celikom-private/ux-backup-$GITHUB_SHA/index.php' && cp -p '$root/public_html/admin/index.php' '$root/celikom-private/ux-backup-$GITHUB_SHA/admin-index.php'"
          scp "${co[@]}" website/app/src/CmsOwnerPolish.php "$dest:$root/celikom-private/app/src/CmsOwnerPolish.php"
          scp "${co[@]}" website/public/assets/css/v10/owner-polish.css "$dest:$root/public_html/assets/css/v10/owner-polish.css"
          scp "${co[@]}" website/public/assets/js/v10/owner-polish.js "$dest:$root/public_html/assets/js/v10/owner-polish.js"
          scp "${co[@]}" website/public/index.php "$dest:$root/public_html/index.php"
          scp "${co[@]}" website/public/admin/index.php "$dest:$root/public_html/admin/index.php"
          status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://lemonchiffon-narwhal-791953.hostingersite.com/?ux=$GITHUB_SHA")
          test "$status" = 401
          echo 'CELIKOM staging UX updated, unauthenticated homepage still blocked (401)'
