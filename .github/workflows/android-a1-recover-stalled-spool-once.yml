name: CELIKOM A1 one-shot stuck spool cancellation 45900744210
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-a1-recover-stalled-spool-once.yml'
permissions:
  contents: read
jobs:
  cancel-exact-stalled-delivery:
    if: github.repository == 'manufact-test/nomusic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel only verified stuck previous A1 spool run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=manufact-test/nomusic
          old_run=45900744210
          old_sha=349e94b7310d503aed3c042ea5183e71497a5a2f
          gh api "repos/$repo/actions/runs/$old_run" > "$RUNNER_TEMP/old-run.json"
          jq -e --arg sha "$old_sha" '
            .id == 45900744210 and .head_sha == $sha
            and .head_branch == "main"
            and (.path | startswith(".github/workflows/android-a1-owner-floki-spool.yml"))
          ' "$RUNNER_TEMP/old-run.json" >/dev/null
          status=$(jq -r .status "$RUNNER_TEMP/old-run.json")
          if [[ "$status" == completed ]]; then
            echo A1_OLD_SPOOL_ALREADY_COMPLETED
            exit 0
          fi
          [[ "$status" == in_progress ]] || { echo A1_NOT_STUCK_RUNNING; exit 1; }
          gh api "repos/$repo/actions/runs/$old_run/jobs?per_page=100" > "$RUNNER_TEMP/old-jobs.json"
          jq -e '
            .total_count == 1
            and (.jobs[0].name == "stage-verified-signed-apk")
            and (.jobs[0].status == "in_progress")
            and (.jobs[0].runner_name == "celikom-floki-ci02")
            and ((.jobs[0].steps | length) == 0)
          ' "$RUNNER_TEMP/old-jobs.json" >/dev/null
          gh api --method POST "repos/$repo/actions/runs/$old_run/cancel" >/dev/null
          for i in {1..8}; do
            sleep 4
            status=$(gh api "repos/$repo/actions/runs/$old_run" --jq .status)
            [[ "$status" == completed ]] && break
          done
          if [[ "$status" != completed ]]; then
            gh api --method POST "repos/$repo/actions/runs/$old_run/force-cancel" >/dev/null
          fi
          echo A1_EXACT_OLD_STALLED_SPOOL_CANCELLATION_REQUESTED
