name: Android Stage 16 diagnostic spike
on:
  push:
    branches: [feature/api-range]
    paths: ["android/**", ".github/workflows/android-spike.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate owned diagnostic audio
        run: python3 android/spike/generate-fixtures.py
      - name: Unit, lint and debug assembly
        working-directory: android/spike
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android controlled-surface test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android/spike && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Private-only diagnostic APK
        if: github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: celikom-android-spike-private-${{ github.sha }}
          path: android/spike/app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error
