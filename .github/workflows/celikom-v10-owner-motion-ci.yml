name: CELIKOM approved v10 owner motion checks
on:
  push:
    branches: [feature/api-range]
    paths:
      - website/app/src/CmsV10OwnerMotion.php
      - website/public/assets/css/v10/owner-v10-motion.css
      - website/public/assets/js/v10/owner-v10-motion.js
      - website/public/index.php
      - website/public/admin/index.php
      - website/tests/CmsV10OwnerMotionTest.php
      - .github/workflows/celikom-v10-owner-motion-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Check add-on and no-change-to-v10 invariants
        shell: bash
        run: |
          set -euo pipefail
          php -l website/app/src/CmsV10OwnerMotion.php
          php -l website/public/index.php
          php -l website/public/admin/index.php
          node --check website/public/assets/js/v10/owner-v10-motion.js
          php website/tests/CmsV10OwnerMotionTest.php
          python3 website/tests/Stage3MarkupTest.py
