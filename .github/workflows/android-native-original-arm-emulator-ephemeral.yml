name: Android clean ARM emulator original Yandex host smoke (NO PATCH)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - 'android/native-yandex-hooklab/original_yandex_arm_emulator_ephemeral.py'
      - '.github/workflows/android-native-original-arm-emulator-ephemeral.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-signed-original-arm-runtime:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate non-mutating test script syntax
        run: python3 -m py_compile android/native-yandex-hooklab/original_yandex_arm_emulator_ephemeral.py
      - name: Clean ARM64 Android 13 emulator, no user data or APK artifacts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a
          profile: pixel_5
          emulator-boot-timeout: 600
          script: python3 android/native-yandex-hooklab/original_yandex_arm_emulator_ephemeral.py
      - name: Confirm no repository third-party binaries
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'No APK artifacts, no credentials, no owner phone changes'
