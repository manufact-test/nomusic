name: Android OWN current-source Start-Stop Windows parity ARM64 (NO Yandex)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - 'android/native-yandex-hooklab/armv7-loader-host/app/src/main/java/pro/celikom/armv7loaderhost/AudioSmokeSource.java'
      - 'android/native-yandex-hooklab/armv7-loader-host/app/src/main/java/pro/celikom/armv7loaderhost/OwnSameTrackReloadPlan.java'
      - 'android/native-yandex-hooklab/armv7-loader-host/tests/OwnSameTrackReloadPlanTest.java'
      - '.github/workflows/android-native-owned-windows-parity-arm64.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  own-current-source-arm64-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify ARM64 CPU, NOT Android or original Yandex
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          echo 'ARM64 Linux OWN audio model only. NOT Android MediaPlayer playback.'
      - name: Compile and run 10k Start Stop Seek Next parity scenarios
        run: |
          set -euo pipefail
          mkdir -p /tmp/celikom-owned-windows-parity
          javac --release 17 -d /tmp/celikom-owned-windows-parity \
            android/native-yandex-hooklab/armv7-loader-host/app/src/main/java/pro/celikom/armv7loaderhost/AudioSmokeSource.java \
            android/native-yandex-hooklab/armv7-loader-host/app/src/main/java/pro/celikom/armv7loaderhost/OwnSameTrackReloadPlan.java \
            android/native-yandex-hooklab/armv7-loader-host/tests/OwnSameTrackReloadPlanTest.java
          java -cp /tmp/celikom-owned-windows-parity OwnSameTrackReloadPlanTest
      - name: Confirm no vendor binaries, network, user accounts, media exports
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'Source-only OWN synthetic current source reload planning. No Yandex.'
