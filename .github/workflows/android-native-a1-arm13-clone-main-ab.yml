name: Android A1 ARM13 own clone ART shell-profiler controlled experiment
on:
  push:
    branches:
      - experiment/android-a1-arm13-shell-profiler-no-bypass-20261111
    paths:
      - 'android/native-yandex-hooklab/clone_native_arm13_redroid_gate.py'
      - 'android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py'
      - 'android/native-yandex-hooklab/clone_lab_profileability.py'
      - 'android/native-yandex-hooklab/tests/test_clone_lab_profileability.py'
      - 'android/native-yandex-hooklab/observe_native_startup_trace.py'
      - 'android/native-yandex-hooklab/tests/test_native_arm13_art_trace.py'
      - 'android/native-yandex-hooklab/native_arm13_startup_observer.py'
      - 'android/native-yandex-hooklab/native_arm13_timeline_origin.py'
      - 'android/native-yandex-hooklab/tests/test_native_arm13_startup_observer.py'
      - 'android/native-yandex-hooklab/tests/test_native_arm13_timeline_origin.py'
      - 'android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py'
      - '.github/workflows/android-native-a1-arm13-clone-main-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-native-android13-owner-not-touched:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install ARM native APK audit/build tools in disposable CI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner zipalign
          sdk="$RUNNER_TEMP/celikom-native-arm13-sdk"
          mkdir -p "$sdk/build-tools/35.0.0"
          for tool in aapt apksigner zipalign; do
            ln -s "$(command -v "$tool")" "$sdk/build-tools/35.0.0/$tool"
            test -x "$sdk/build-tools/35.0.0/$tool"
          done
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Verify structural tests and Python gate syntax first; no APK downloaded yet
        shell: bash
        run: |
          python3 -m py_compile android/native-yandex-hooklab/clone_native_arm13_redroid_gate.py android/native-yandex-hooklab/native_arm13_signed_original_control.py android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py android/native-yandex-hooklab/native_arm13_startup_observer.py android/native-yandex-hooklab/native_arm13_timeline_origin.py android/native-yandex-hooklab/observe_native_startup_trace.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_native_arm13_startup_observer.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_native_arm13_timeline_origin.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_native_arm13_art_trace.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_lab_profileability.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_main_crash_buffer.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_lspatch_loader_zero.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_merge_lab_splits_ephemeral.py -v
      - name: Boot genuine native ARM64+ARMv7 Android13 guest, empty and ephemeral
        timeout-minutes: 16
        shell: bash
        run: bash android/native-yandex-hooklab/ci/native_arm_redroid_boot_only.sh
      - name: Build and test 1 private separately signed native clone and 5 publisher-signed originals
        timeout-minutes: 27
        shell: bash
        env:
          CELIKOM_CLEAN_ANDROID_NATIVE_REDDROID: '1'
          CELIKOM_NATIVE_ARM13_REDDROID_CLONE: '1'
          CELIKOM_MANIFEST_ONLY_ORIGINAL_DEX: '1'
          CELIKOM_OMIT_SHADOWED_SIGNATURE_DECLS: '1'
          CELIKOM_ORIGINAL_CONTROL_LAUNCH: '1'
          CELIKOM_MERGE_PARALLEL_SINGLE_APK: '1'
          CELIKOM_CLONE_FIRST_AB: '1'
          CELIKOM_CLONE_LSPATCH_LOADER_ZERO: '1'
          CELIKOM_NATIVE_ARM13_OWN_CLONE_ART_TRACE: '1'
          CELIKOM_LAB_CLONE_PROFILEABLE_SHELL: '1'
          CELIKOM_PROFILE_MAIN_LAUNCH: '1'
        run: |
          python3 android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py
      - name: Wipe pinned binary downloads, lab keys, owned clone and guest
        if: always()
        shell: bash
        run: |
          docker stop celikom-native-arm-android13 >/dev/null 2>&1 || true
          sudo umount /dev/binderfs >/dev/null 2>&1 || true
          sudo modprobe -r binder_linux >/dev/null 2>&1 || true
          sudo rm -rf -- "$RUNNER_TEMP/celikom-redroid-data" "$RUNNER_TEMP/celikom-native-arm13-sdk"
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo '{"proprietary_apk_artifact_uploaded":false,"owner_device_touched":false,"play_protect_bypassed":false,"publisher_signature_spoofed":false}'
