name: CELIKOM Blur — 100 real pending songs (two fixed batches of 50)
on:
  push:
    branches: [feature/blur-batch100-20261108]
    paths: ['.github/workflows/blur-batch100-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: celikom-blur-real-50-pending
  cancel-in-progress: false
jobs:
  private-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable 100-ID manifest and exact-pair batch scripts
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/blur-batch50/import.php
          php -l tools/blur-batch50/verify.php
          python3 -m py_compile tools/blur-batch100/fetch-fixed.py tools/blur-batch50/prepare.py
          bash -n tools/blur-batch100/run-deploy.sh
          python3 - <<'PY'
          import json
          p=json.load(open('tools/blur-batch100/fixed-plan100.json'))
          candidates=json.load(open('tools/blur-batch50/candidates.json'))['candidates']
          byid={c['id']:c for c in candidates}
          s=p['selected']
          assert p['target_pending']==100 and p['batch_size']==50 and p['fixed_plan']==True
          assert p['source_commit']=='10187b7af56f311fe141a3c9b75483798bf0f589'
          assert len(s)==100 and len({x['id'] for x in s})==100
          assert all(x['id'] in byid and x['blob']==byid[x['id']]['blob'] and x['size']==byid[x['id']]['size'] for x in s)
          assert all(isinstance(x.get('duration_ms'),int) and x['duration_ms']>=1000 for x in s)
          print('PINNED100_VALID: exactly 100 stable source IDs. Replay cannot add extra candidates.')
          PY
          command -v ffprobe || { sudo apt-get update -qq; sudo apt-get install -y ffmpeg; }
          command -v file
      - name: Transfer and insert fixed 100 songs in two 50-song batches; confirm both live
        env:
          HOST_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        shell: bash
        run: bash tools/blur-batch100/run-deploy.sh
      - name: Keep full import, rights=false and both independent DB verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celikom-blur-live100-${{ github.run_id }}
          path: ${{ runner.temp }}/hundred-state/
          retention-days: 90
          if-no-files-found: warn
