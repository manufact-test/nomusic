name: Android A1 MAIN exit-callsite witness (sigbypass zero, standalone lab only)
on:
  push:
    branches:
      - experiment/android-a1-exit-callsite-witness-20261111
    paths:
      - 'android/native-yandex-hooklab/exit-callsite-witness-module/**'
      - 'android/native-yandex-hooklab/exit_callsite_witness_log.py'
      - 'android/native-yandex-hooklab/tests/test_exit_callsite_witness_log.py'
      - 'android/native-yandex-hooklab/clone_lspatch_loader_zero.py'
      - 'android/native-yandex-hooklab/clone_native_arm13_redroid_gate.py'
      - '.github/workflows/android-native-a1-exit-callsite-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  own-module-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile OUR permissionless scoped LibXposed 102 module only
        run: gradle -p android/native-yandex-hooklab/exit-callsite-witness-module :app:assembleDebug --no-daemon
      - name: One-day transfer of OWN module ONLY (no Yandex APK)
        uses: actions/upload-artifact@v4
        with:
          name: CELIKOM-A1-OWN-EXIT-WITNESS-ONLY
          path: android/native-yandex-hooklab/exit-callsite-witness-module/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error
  native-arm13-clone-witness:
    needs: own-module-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CELIKOM-A1-OWN-EXIT-WITNESS-ONLY
          path: ${{ runner.temp }}/celikom-exit-witness-own-module
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install ARM Android build tools through verified Ubuntu-ports mirror
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if ! { command -v aapt >/dev/null && command -v apksigner >/dev/null && command -v zipalign >/dev/null; }; then
            echo 'ARM image missing Android tools; checking signed Ubuntu archive mirrors'
            # The ARM runner DNS resolved GitHub and ghcr.io, but
            # ports.ubuntu.com was unreachable: don't retry the dead hostname.
            if timeout 6s curl -fsSIL --max-time 5 https://us.ports.ubuntu.com/ubuntu-ports/dists/noble/InRelease >/dev/null; then
              base_uri='https://us.ports.ubuntu.com/ubuntu-ports'
              security_uri="$base_uri"
              echo 'APT_SOURCE=OFFICIAL_US_PORTS'
            elif timeout 6s curl -fsSIL --max-time 5 https://mirror.hetzner.com/ubuntu-ports/packages/dists/noble/InRelease >/dev/null; then
              base_uri='https://mirror.hetzner.com/ubuntu-ports/packages'
              security_uri='https://mirror.hetzner.com/ubuntu-ports/security'
              echo 'APT_SOURCE=HETZNER_SIGNED_UBUNTU_PORTS'
            else
              echo 'APT_SOURCE_UNREACHABLE: no safe signed ARM mirror'
              exit 31
            fi
            # Limit sources to the chosen publisher-signed Ubuntu archive.
            # The original system config is unchanged; temporary apt
            # Dir::Etc::* overrides only affect this job's apt commands.
            cat > "$RUNNER_TEMP/celikom-a1-ubuntu-ports.sources" <<EOF
          Types: deb
          URIs: $base_uri
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: $security_uri
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            apt_src="$RUNNER_TEMP/celikom-a1-ubuntu-ports.sources"
            opts=(-o "Dir::Etc::sourcelist=$apt_src" -o 'Dir::Etc::sourceparts=-'
                  -o 'Acquire::Retries=0' -o 'Acquire::http::Timeout=12'
                  -o 'Acquire::https::Timeout=12')
            sudo timeout 75s apt-get "${opts[@]}" update -qq
            sudo timeout 90s env DEBIAN_FRONTEND=noninteractive apt-get "${opts[@]}" install -y -qq aapt apksigner zipalign
          fi
          sdk="$RUNNER_TEMP/celikom-native-arm13-sdk"
          mkdir -p "$sdk/build-tools/35.0.0"
          for tool in aapt apksigner zipalign; do
            ln -s "$(command -v "$tool")" "$sdk/build-tools/35.0.0/$tool"
            test -x "$sdk/build-tools/35.0.0/$tool"
          done
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Verify offline parser and legacy packaging invariants before downloading vendor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile android/native-yandex-hooklab/exit_callsite_witness_log.py android/native-yandex-hooklab/clone_lspatch_loader_zero.py android/native-yandex-hooklab/clone_native_arm13_redroid_gate.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_exit_callsite_witness_log.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_lspatch_loader_zero.py -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p test_native_arm13_platform_contract.py -v
          test -f "$RUNNER_TEMP/celikom-exit-witness-own-module/app-debug.apk"
      - name: Boot disposable true ARM13 native guest
        timeout-minutes: 16
        shell: bash
        run: bash android/native-yandex-hooklab/ci/native_arm_redroid_boot_only.sh
      - name: Read-only exact MAIN exit and exception callsite observation (known strict NO-GO gate)
        timeout-minutes: 27
        shell: bash
        env:
          CELIKOM_A1_EXIT_WITNESS: '1'
          CELIKOM_CLEAN_ANDROID_NATIVE_REDDROID: '1'
          CELIKOM_NATIVE_ARM13_REDDROID_CLONE: '1'
          CELIKOM_MANIFEST_ONLY_ORIGINAL_DEX: '1'
          CELIKOM_OMIT_SHADOWED_SIGNATURE_DECLS: '1'
          CELIKOM_ORIGINAL_CONTROL_LAUNCH: '1'
          CELIKOM_MERGE_PARALLEL_SINGLE_APK: '1'
          CELIKOM_CLONE_FIRST_AB: '1'
          CELIKOM_CLONE_LSPATCH_LOADER_ZERO: '1'
        run: |
          export CELIKOM_A1_EXIT_WITNESS_APK="$RUNNER_TEMP/celikom-exit-witness-own-module/app-debug.apk"
          python3 android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py
      - name: Erase lab keys, vendor downloads, module, patched clones and Android guest
        if: always()
        shell: bash
        run: |
          docker stop celikom-native-arm-android13 >/dev/null 2>&1 || true
          sudo umount /dev/binderfs >/dev/null 2>&1 || true
          sudo modprobe -r binder_linux >/dev/null 2>&1 || true
          sudo rm -rf -- "$RUNNER_TEMP/celikom-redroid-data" "$RUNNER_TEMP/celikom-native-arm13-sdk" "$RUNNER_TEMP/celikom-exit-witness-own-module"
          echo '{"user_apk_published":false,"owner_phone_touched":false,"sigBypassLevel":0,"vendor_artifact_uploaded":false}'
