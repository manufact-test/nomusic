name: Android signed Lero async case discriminator to source reader (READ-ONLY)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - 'android/native-yandex-hooklab/audit_native_lero_async_case.py'
      - 'android/native-yandex-hooklab/tests/test_native_lero_async_case.py'
      - '.github/workflows/android-native-lero-async-case.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-signed-lwq7-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate strict DEX switch payload and selector tests
        run: |
          set -eu
          python3 -m py_compile android/native-yandex-hooklab/audit_native_lero_async_case.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_native_lero_async_case.py' -v
      - name: Original publisher-signed Lero/Lwq7 selector-to-read case audit
        run: python3 android/native-yandex-hooklab/audit_native_lero_async_case.py
      - name: Read-only source guard
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'No installed Yandex, audio, tokens, private URLs or decoder mutation'
