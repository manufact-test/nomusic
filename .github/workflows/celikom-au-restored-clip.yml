name: CELIKOM Au restored excerpt private staging prep
on:
  push:
    branches: [feature/api-range]
    paths: [.github/workflows/celikom-au-restored-clip.yml]
permissions:
  contents: read
concurrency:
  group: celikom-website-staging
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare immutable restoration-only excerpt in private site storage
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = manufact-test/nomusic
          test "$GITHUB_REF" = refs/heads/feature/api-range
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$SSH_KEY" > "$work/id"
          printf '%s\n' "$KNOWN_HOSTS" > "$work/known"
          chmod 600 "$work/id" "$work/known"
          so=(-T -p 65002 -i "$work/id" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known")
          sc=(-P 65002 -i "$work/id" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known")
          host=u235811320@92.113.19.189
          app=/home/u235811320/domains/lemonchiffon-narwhal-791953.hostingersite.com/celikom-private
          ssh "${so[@]}" "$host" /opt/alt/php83/usr/bin/php < website/tools/export-au-restored-readonly.php > "$work/source.mp3"
          echo "5dfdfaa97ee6f1168964a1a49a101bebb20bd5dca7147c41c1d2df366a2a00d8  $work/source.mp3" | sha256sum -c --status
          ffmpeg -hide_banner -loglevel error -nostdin -ss 43 -i "$work/source.mp3" -t 11 -map 0:a:0 -ac 2 -ar 44100 -c:a libmp3lame -b:a 192k "$work/restored.mp3"
          actual=$(sha256sum "$work/restored.mp3" | cut -d' ' -f1)
          test "${#actual}" -eq 64
          echo "Separate restored demo MP3 digest: $actual"
          python3 - "$work/restored.mp3" <<'PY'
          import json,subprocess,sys
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size','-of','json',sys.argv[1]]))
          assert 10.9<float(meta['format']['duration'])<11.1
          assert 200000<int(meta['format']['size'])<330000
          print('Owner Au replacement safely cropped as separate 11-second private clip')
          PY
          stage="$app/demo-audio/incoming-$GITHUB_SHA"
          ssh "${so[@]}" "$host" "test -f '$app/app/staging-approved.php' && test ! -e '$app/app/release-approved.php' && test ! -e '$stage' && mkdir -p -m 700 '$app/demo-audio' '$app/demo-audio/clips' && mkdir -m 700 '$stage'"
          scp "${sc[@]}" "$work/restored.mp3" "$host:$stage/restored.mp3"
          ssh "${so[@]}" "$host" "env DEMO_STAGING='$stage' DEMO_EXPECTED='$actual' bash -se" <<'REMOTE'
          set -euo pipefail
          app=/home/u235811320/domains/lemonchiffon-narwhal-791953.hostingersite.com/celikom-private
          stage="$DEMO_STAGING"
          expected="$DEMO_EXPECTED"
          incoming="$stage/restored.mp3"
          test -f "$incoming" && test ! -L "$incoming"
          test "$(sha256sum "$incoming" | cut -d' ' -f1)" = "$expected"
          dest="$app/demo-audio/clips/restored.mp3"
          if test -e "$dest"; then
            test ! -L "$dest"
            test "$(sha256sum "$dest" | cut -d' ' -f1)" = "$expected"
          else
            cp -p "$incoming" "$dest"
            chmod 600 "$dest"
          fi
          rm -f "$incoming"
          rmdir "$stage"
          echo "PRIVATE_RESTORED_CLIP_READY; source library unchanged; service original still required"
          REMOTE
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'https://lemonchiffon-narwhal-791953.hostingersite.com/?demo_audio=restored')" = 401
          echo "CLOSED_STAGING_AUDIO_ROUTE_REMAINS_AUTH_REQUIRED"
