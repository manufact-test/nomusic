name: CELIKOM API availability
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main, feature/api-range]
    paths:
      - .github/workflows/celikom-api-availability.yml
      - .github/scripts/celikom-api-monitor.mjs
permissions:
  contents: read
concurrency:
  group: celikom-public-api-monitor
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public API twice on failure (no credentials)
        run: |
          set -o pipefail
          node .github/scripts/celikom-api-monitor.mjs | tee api-availability.json
      - name: Preserve public probe report in run summary (no artifact quota)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### CELIKOM public API probe'
            if test -s api-availability.json; then
              printf '%s\n' '```json'
              cat api-availability.json
              printf '%s\n' '```'
            else
              echo 'Probe report missing; inspect the failed step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
