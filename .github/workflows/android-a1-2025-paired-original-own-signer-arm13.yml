name: CELIKOM A1 native ARM13 paired issuer-vs-own signer A/B (strict Stage A NO-GO)
on:
  push:
    branches: [experiment/android-a1-2025-paired-signer-native-arm13-20261112]
    paths:
      - '.github/workflows/android-a1-2025-paired-original-own-signer-arm13.yml'
      - 'android/native-yandex-hooklab/ci/owner_2025_paired_issuer_vs_own_signer_arm13.py'
      - 'android/native-yandex-hooklab/ci/test_owner_2025_paired_signing_verdict.py'
      - 'android/native-yandex-hooklab/clone_main_crash_buffer.py'
      - 'android/native-yandex-hooklab/ci/owner_2025_same_name_own_key_arm13_control.py'
permissions:
  contents: write
jobs:
  paired-signer-same-clean-guest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CELIKOM_CLEAN_ANDROID_NATIVE_REDDROID: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Synthetic fail-closed A/B verdicts and MAIN PID privacy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_owner_2025_paired_signing_verdict.py -v
          python3 -B -m unittest discover -s android/native-yandex-hooklab/tests -p test_clone_main_crash_buffer.py -v
          python3 -B -m py_compile android/native-yandex-hooklab/ci/owner_2025_paired_issuer_vs_own_signer_arm13.py
      - name: Re-acquire existing original 2025 XAPK from unpublished draft, hash gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = manufact-test/nomusic ]
          [ "$GITHUB_REF_NAME" = experiment/android-a1-2025-paired-signer-native-arm13-20261112 ]
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' | grep -qx 442137464
          gh api "repos/$GITHUB_REPOSITORY/releases/442137464/assets?per_page=100" --jq '.[] | select(.id == 736739728 and .name == "yandex-music-2025-10-4-120-1gpr.xapk" and .size == 45961661 and .digest == "sha256:8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053") | .id' | grep -qx 736739728
          mkdir -p "$RUNNER_TEMP/celikom-paired-a1"
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" --pattern yandex-music-2025-10-4-120-1gpr.xapk --dir "$RUNNER_TEMP/celikom-paired-a1" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-paired-a1/yandex-music-2025-10-4-120-1gpr.xapk"
          [ "$(stat -c %s "$f")" = 45961661 ]
          [ "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053 ]
      - name: Prepare same official Android package signer verifier for both arms
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo timeout 120 apt-get update -qq
          sudo timeout 90 env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner zipalign
          sdk="$RUNNER_TEMP/celikom-paired-sdk"
          mkdir -p "$sdk/build-tools/35.0.0"
          for tool in aapt apksigner zipalign; do
            ln -sf "$(command -v "$tool")" "$sdk/build-tools/35.0.0/$tool"
          done
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Boot one clean true native ARM64 plus ARMv7 Android 13 guest
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          bash android/native-yandex-hooklab/ci/native_arm_redroid_boot_only.sh
          [ "$(docker exec celikom-native-arm-android13 getprop sys.boot_completed)" = 1 ]
          [ "$(docker exec celikom-native-arm-android13 getprop ro.build.version.sdk)" = 33 ]
      - name: Exact same guest A/B, vendor-signed ORIGINAL 75s then own-key 75s, no APKEditor
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/owner_2025_paired_issuer_vs_own_signer_arm13.py --xapk "$RUNNER_TEMP/celikom-paired-a1/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Always erase all temporary XAPKs, signed copies, signing keys and guest data
        if: always()
        shell: bash
        run: |
          docker stop celikom-native-arm-android13 >/dev/null 2>&1 || true
          sudo umount /dev/binderfs >/dev/null 2>&1 || true
          sudo modprobe -r binder_linux >/dev/null 2>&1 || true
          sudo rm -rf -- "$RUNNER_TEMP/celikom-redroid-data"
          rm -rf -- "$RUNNER_TEMP/celikom-paired-a1" "$RUNNER_TEMP/celikom-paired-sdk"
          echo '{"owner_phone_touched":false,"published_apk_or_certificate":false,"no_signature_check_bypass":true,"stage_a":"NO_GO"}'
