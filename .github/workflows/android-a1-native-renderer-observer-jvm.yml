          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard staged FlokiNET stable Android updater source (no OTA publication)
        shell: bash
        run: python3 -B android/native-companion/addon/test_update_center_floki_origin.py
      - name: Verify exact diagnostic scope and run real Java fail-closed reference tests
        shell: bash
        run: |
          set -euo pipefail
