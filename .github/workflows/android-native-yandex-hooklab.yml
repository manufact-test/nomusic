name: Android native-Yandex exact FileInfo hooklab (read-only module)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - 'android/native-yandex-hooklab/**'
      - '.github/workflows/android-native-yandex-hooklab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact classloader/hook method contract using synthetic Yandex DTOs
        run: |
          set -eu
          mkdir -p /tmp/celikom-jvm-hooklab
          javac --release 17 -d /tmp/celikom-jvm-hooklab \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/HookSpec.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativeSourceGate.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativeTrackIdentityGate.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativePrePrepareAdmission.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativeEventOrderProbe.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativePlaybackStateProbe.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativeGrantContract.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativeReplacementLifecycle.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativeSourceInstanceFence.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativeSourceDispatchWitness.java \
            android/native-yandex-hooklab/app/src/main/java/pro/celikom/yandex/nativehooklab/NativeReaderExecutionWitness.java \
            $(find android/native-yandex-hooklab/tests/src -type f -name '*.java' | sort)
          java -cp /tmp/celikom-jvm-hooklab HookSpecTest
          java -cp /tmp/celikom-jvm-hooklab NativeSourceGateTest
          java -cp /tmp/celikom-jvm-hooklab pro.celikom.yandex.nativehooklab.NativeTrackIdentityGateTest
          java -cp /tmp/celikom-jvm-hooklab NativePrePrepareAdmissionTest
          java -cp /tmp/celikom-jvm-hooklab NativeEventOrderProbeTest
          java -cp /tmp/celikom-jvm-hooklab NativePlaybackStateProbeTest
          java -cp /tmp/celikom-jvm-hooklab NativeGrantContractTest
          java -cp /tmp/celikom-jvm-hooklab NativeReplacementLifecycleTest
          java -cp /tmp/celikom-jvm-hooklab NativeSourceInstanceFenceTest
          java -cp /tmp/celikom-jvm-hooklab NativeSourceInstanceConcurrencyTest
          java -cp /tmp/celikom-jvm-hooklab NativeSourceDispatchWitnessTest
          java -cp /tmp/celikom-jvm-hooklab NativeReaderExecutionWitnessTest
      - name: Test read-only ARM device gate (synthetic snapshots; no phone connected)
        run: python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_*.py' -v
      - name: Disallow sensitive permissions, substitute player and mutable audio sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path('android/native-yandex-hooklab')
          manifest = (base/'app/src/main/AndroidManifest.xml').read_text()
          source = (base/'app/src/main/java/pro/celikom/yandex/nativehooklab/NativeHookEntry.java').read_text()
          build = (base/'app/build.gradle.kts').read_text()
          assert '<uses-permission' not in manifest
          assert '"false"' in build or 'false' in build
          for forbidden in ['MediaPlayer(', 'WebView(', 'setResult(', 'setDataSource(', 'Authorization', 'OAuth', 'getDeclaredField("urls")']:
              assert forbidden not in source, forbidden
          assert 'chain.proceed()' in source
          assert 'setExceptionMode(XposedInterface.ExceptionMode.PROTECTIVE)' in source
          assert 'MediaSession.class.getDeclaredMethod(' in source
          assert '"setMetadata", MediaMetadata.class' in source
          assert 'safeCount("platform-media-metadata-update", metadataUpdates)' in source
          assert 'metadataHooked' in source
          assert 'playbackStateHooked' in source
          assert '"setPlaybackState", PlaybackState.class' in source
          assert 'published-playback aggregate reports=' in source
          assert '((PlaybackState) args.get(0)).getState()' in source
          assert 'eventOrder.onFileInfo(SystemClock.elapsedRealtime())' in source
          assert 'eventOrder.onMetadata(SystemClock.elapsedRealtime())' in source
          assert 'temporal-only aggregate single=' in source
          assert 'metadata update count=' in source
          assert 'file-info conversion count=' in source
          grant = (base/'app/src/main/java/pro/celikom/yandex/nativehooklab/NativeGrantContract.java').read_text()
          lifecycle = (base/'app/src/main/java/pro/celikom/yandex/nativehooklab/NativeReplacementLifecycle.java').read_text()
          assert 'NativeGrantContract.isAcceptable(' in lifecycle
          assert 'NativePrePrepareAdmission' in lifecycle
          assert 'enabled = false;' in lifecycle and 'active.abort(activeRevision);' in lifecycle
          for unsafe in ['System.out.', 'Log.', 'HttpURLConnection', 'MediaPlayer', 'getMediaId', 'setDataSource(', 'celikom_native_query_guard=0']:
              assert unsafe not in grant and unsafe not in lifecycle, unsafe
          for forbidden in ['getString(', 'getLong(', 'metadata.get', 'MediaMetadata.METADATA_', 'getQueue(', 'getMediaId(', 'getDescription(']:
              assert forbidden not in source, forbidden
          fence=(base/'app/src/main/java/pro/celikom/yandex/nativehooklab/NativeSourceInstanceFence.java').read_text()
          assert 'NativeSourceInstanceFence' not in source, 'old synthetic model must remain unwired from Yandex'
          # Exact signed factory/t observation may count reference identity,
          # but must not mutate an audio source or identify an audible decoder.
          assert 'HookSpec.findSourceFactory(loader)' in source
          assert 'HookSpec.findSourceLifecycle(loader,concrete,action)' in source
          assert 'chain.proceed()' in source
          assert 'sourceDispatch.onFactory(result, SystemClock.elapsedRealtime())' in source
          assert 'sourceDispatch.onLifecycleT(receiver,time)' in source
          assert 'sourceDispatch.onRemove(receiver,time)' in source
          assert 'HookSpec.findLeroReaderField(loader)' in source
          assert 'sourceDispatch.onOwnedReader(receiver,reader,time)' in source
          assert 'HookSpec.findReaderExecution(loader)' in source
          assert 'HookSpec.findReaderSourceMethod(loader,operation)' in source
          assert 'readerExecution.positiveRead(receiver)' in source
          assert 'sourceDispatch.onCompletedReader(' in source
          witness=(base/'app/src/main/java/pro/celikom/yandex/nativehooklab/NativeSourceDispatchWitness.java').read_text()
          assert 'objects[i]==receiver' in witness
          assert 'onFactory(Object returned,long elapsedMs)' in witness
          assert '!"ero".equals(source.getClass().getName())' in witness
          assert 'onOwnedReader(Object source,Object reader,long at)' in witness
          assert 'onCompletedReader(Object reader,long at)' in witness
          assert 'objects[i]==source&&started[i]' in witness
          reader=(base/'app/src/main/java/pro/celikom/yandex/nativehooklab/NativeReaderExecutionWitness.java').read_text()
          assert 'ThreadLocal<Scope>' in reader
          assert 'scope.openedSource!=receiver' in reader
          assert 'if(scope.previous==null)inReader.remove()' in reader
          assert 'returnedNormally && scope.opened && scope.read' in reader
          assert 'inReader.remove()' in reader
          for unsafe in ('openConnection(', 'getMediaId', 'getTitle', 'getUri', 'HttpURLConnection', 'setDataSource',
                         'MediaPlayer', 'getDeclaredField', 'Log.', 'System.out.'):
              assert unsafe not in witness and unsafe not in reader, unsafe
          assert 'System.out.' not in fence and 'Log.' not in fence and 'MediaPlayer' not in fence
          for forbidden in ('HttpURLConnection','getMediaId','getMetadata','getTitle',
                            'getUri','trackId','editionId','getDeclaredField'):
              assert forbidden not in fence, forbidden
          assert 'selectedSource' in fence and 'generation' in fence
          assert 'syntheticSequenceComplete' in fence
          assert 'if (targetHooked) return;' in source
          print('PASS: exact-version metadata witness is read-only, no data values, no second player')
          PY
  android-module-build:
    needs: isolated-synthetic-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build only CELIKOM read-only Xposed module, never original/patched Yandex
        run: gradle -p android/native-yandex-hooklab :app:assembleDebug --no-daemon --stacktrace
      - name: Verify Xposed module metadata and APK integrity (CI does not release binary)
        run: |
          set -eu
          APK=android/native-yandex-hooklab/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -Z1 "$APK" | grep -Fx 'META-INF/xposed/java_init.list'
          unzip -Z1 "$APK" | grep -Fx 'META-INF/xposed/module.prop'
          unzip -Z1 "$APK" | grep -Fx 'META-INF/xposed/scope.list'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -Fx 'ru.yandex.music'
          unzip -p "$APK" META-INF/xposed/java_init.list | grep -Fx 'pro.celikom.yandex.nativehooklab.NativeHookEntry'
          test -n "${ANDROID_HOME}"
          TOOL=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$TOOL" verify --verbose --print-certs "$APK" | grep 'Verified using v2 scheme (APK Signature Scheme v2): true'
          sha256sum "$APK"
          echo 'PASS: source-only in-process module builds, signed, metadata correct. NOT injected in Yandex. Play Protect NOT tested.'
