name: CELIKOM Windows Companion Preview CI

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/windows-companion-integration-20261108
    paths:
      - windows-companion/w15/**
      - .github/workflows/windows-w15-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native app with warnings as errors
        run: dotnet build windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj -c Release -warnaserror
      - name: DPAPI and local HTTP integration tests
        run: dotnet run --project windows-companion/w15/Celikom.Companion.Tests/Celikom.Companion.Tests.csproj -c Release
      - name: Signed URL Next Stop and pairing contracts
        run: node --test windows-companion/w15/w15-contract.test.mjs
      - name: Install pinned PulseSync SDK
        working-directory: windows-companion/w15/addon
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Compile real PulseSync addon with vendor SDK
        working-directory: windows-companion/w15/addon
        run: npm run build
      - name: Publish standalone Windows x64 CELIKOM
        shell: pwsh
        run: |
          dotnet publish windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o windows-companion/w15/publish
          if ($LASTEXITCODE -ne 0) { throw "PUBLISH_FAILED" }
      - name: Build preview ZIP with SHA256 hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'windows-companion/w15'
          $pack = Join-Path $base 'bundle'
          New-Item -ItemType Directory -Path $pack -Force | Out-Null
          $exe = Join-Path $base 'publish/CELIKOM.Companion.exe'
          if (-not (Test-Path $exe)) { throw "MISSING_EXE" }
          Copy-Item -Path $exe -Destination $pack
          Copy-Item -Path (Join-Path $base 'PREVIEW-README.txt') -Destination $pack
          Copy-Item -Path (Join-Path $base 'addon/dist') -Destination (Join-Path $pack 'addon') -Recurse -Force
          $addons = @(Get-ChildItem -Path (Join-Path $pack 'addon') -Filter script.js -Recurse)
          if ($addons.Count -ne 1 -or $addons[0].Length -lt 1000) { throw "MISSING_ADDON" }
          (Get-FileHash $exe -Algorithm SHA256).Hash | Out-File (Join-Path $pack 'EXE-SHA256.txt') -Encoding ascii
          (Get-FileHash $addons[0].FullName -Algorithm SHA256).Hash | Out-File (Join-Path $pack 'ADDON-SHA256.txt') -Encoding ascii
          Compress-Archive -Path (Join-Path $pack '*') -DestinationPath (Join-Path $base 'CELIKOM-Windows-W15.1-PREVIEW.zip') -CompressionLevel Optimal -Force
          if ((Get-Item (Join-Path $base 'CELIKOM-Windows-W15.1-PREVIEW.zip')).Length -lt 1000000) { throw "INVALID_ZIP" }
      - name: Upload private W15.1 preview archive
        uses: actions/upload-artifact@v4
        with:
          name: CELIKOM-Windows-W15.1-PREVIEW
          path: windows-companion/w15/CELIKOM-Windows-W15.1-PREVIEW.zip
          if-no-files-found: error
          retention-days: 14
