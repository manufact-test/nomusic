name: Android native manifest-only DEX-preserved side-by-side control (EPHEMERAL)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - '.github/workflows/android-native-manifest-only-dex-preserved.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-dex-unchanged-parallel-host:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Allow Linux KVM for isolated API30 emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Syntax and original strict safety unit tests
        run: |
          python3 -m py_compile android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_resolved_provider_authorities.py' -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_shadowed_signature_permissions.py' -v
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_clone_crash_classification.py' -v
      - name: Real Android 11 32bit process lifecycle snapshots, intact DEX
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_5
          emulator-boot-timeout: 480
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: CELIKOM_CLEAN_ANDROID_ARMV7_TRANSLATION=1 CELIKOM_MANIFEST_ONLY_ORIGINAL_DEX=1 CELIKOM_OMIT_SHADOWED_SIGNATURE_DECLS=1 CELIKOM_ORIGINAL_CONTROL_LAUNCH=1 python3 android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py
      - name: No publisher binary, derived clone or research key delivered
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'No vendor APK published; ephemeral CI test only'
