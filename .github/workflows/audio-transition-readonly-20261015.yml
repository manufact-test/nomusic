name: Read-only track transition audio inspection
on:
  push:
    branches: [feature/api-range]
    paths: [.github/workflows/audio-transition-readonly-20261015.yml]
permissions:
  contents: read
concurrency:
  group: celikom-hostinger-private-test
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect approved private audio without mutation or audio artifacts
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          target=u235811320@92.113.19.189
          remote=/home/u235811320/domains/darkred-camel-588676.hostingersite.com/celikom/incoming/duration-audit-${GITHUB_RUN_ID}.php
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$work/key"
          ssh-keygen -y -P '' -f "$work/key" > "$work/public"
          test "$(ssh-keygen -lf "$work/public" -E sha256 | awk '{print $2}')" = 'SHA256:Q6FyifXRq6garceQdIIjBmXhkk81Ic1p/x9JTSYHWUk'
          printf '%s\n' '[92.113.19.189]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAf8M2EVwq0oJI8I9KZ0NFE8P8yDOvDATEhkQti/Kk/0' > "$work/known_hosts"
          opts=(-i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          trap 'ssh -p 65002 "${opts[@]}" "$target" "rm -f '\''$remote'\''" || true; rm -rf "$work"' EXIT
          cat > "$work/audit.php" <<'PHP'
          <?php
          ini_set('display_errors','0');
          try {
          $app='/home/u235811320/domains/darkred-camel-588676.hostingersite.com/celikom';
          require $app.'/current/bootstrap.php';$config=require $app.'/current/config/app.php';
          $pdo=Celikom\Database\Connection::open($config);
          $pdo->exec('SET TRANSACTION READ ONLY');$pdo->beginTransaction();
          $q=$pdo->query("SELECT t.service_track_id,t.title,t.artist,t.duration_ms AS original_ms,r.id AS replacement_id,r.version,r.audio_asset_id,a.duration_ms,a.sha256,a.storage_key,a.size_bytes FROM tracks t JOIN track_replacements r ON r.track_id=t.id JOIN audio_assets a ON a.id=r.audio_asset_id WHERE t.service='yandex' AND t.service_track_id IN ('1944611','27323608','1944599','42498650','38788303') AND r.status='approved' AND r.is_active=1 AND r.disabled_at IS NULL ORDER BY t.service_track_id");
          $rows=$q->fetchAll(PDO::FETCH_ASSOC);$pdo->commit();
          if(count($rows)<2 || count($rows)>5)throw new RuntimeException('scope');
          $id=$argv[1]??'';
          if($id==='inspect'){foreach($rows as &$r){unset($r['storage_key']);}echo json_encode($rows,JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR);exit;}
          foreach($rows as $r){if($r['service_track_id']!==$id)continue;
          $s=new Celikom\Storage\LocalStorageAdapter($config['storage_path']);$stream=$s->openStream($r['storage_key']);
          if($s->getSize($r['storage_key'])!==(int)$r['size_bytes'])throw new RuntimeException('size');
          fpassthru($stream);fclose($stream);exit;}
          throw new RuntimeException('id');
          }catch(Throwable $e){fwrite(STDERR,'Restricted audio audit failed: '.get_class($e)."\n");exit(1);}
          PHP
          scp -P 65002 "${opts[@]}" "$work/audit.php" "$target:$remote"
          ssh -p 65002 "${opts[@]}" "$target" "/opt/alt/php83/usr/bin/php '$remote' inspect" > "$work/metadata.json"
          cat "$work/metadata.json"
          command -v ffmpeg || { sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg; }
          for id in $(python3 -c 'import json,sys; print(" ".join(r["service_track_id"] for r in json.load(open(sys.argv[1]))))' "$work/metadata.json"); do
            ssh -p 65002 "${opts[@]}" "$target" "/opt/alt/php83/usr/bin/php '$remote' '$id'" > "$work/$id.mp3"
          done
          python3 - "$work" <<'PY_AUDIO'
          import pathlib,json,subprocess,array,math,hashlib
          work=pathlib.Path(__import__('sys').argv[1]);rows=json.loads((work/'metadata.json').read_text());signals={}
          for row in rows:
           key=row['service_track_id'];path=work/(key+'.mp3');data=path.read_bytes();assert hashlib.sha256(data).hexdigest()==row['sha256']
           probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_name,duration,start_time','-of','json',str(path)]))
           pcm=array.array('f',subprocess.check_output(['ffmpeg','-v','error','-i',str(path),'-t','20','-ac','1','-ar','8000','-f','f32le','-']))
           signals[key]=pcm
           print(json.dumps({'track':key,'replacement':row['replacement_id'],'codec':probe,'head_500ms_rms':round(math.sqrt(sum(x*x for x in pcm[:4000])/max(1,len(pcm[:4000]))),6),'id3_bytes':10+sum(data[6+i]<<(7*(3-i)) for i in range(4)) if data[:3]==b'ID3' else 0}))
          focus=signals['1944611'][:4000];energy=sum(x*x for x in focus)
          for key,signal in signals.items():
           if key=='1944611':continue
           best=(-1,0)
           for offset in range(0,max(1,len(signal)-len(focus)),400):
            block=signal[offset:offset+len(focus)];e=sum(x*x for x in block)
            corr=abs(sum(x*y for x,y in zip(focus,block)))/math.sqrt(energy*e) if energy*e>1e-12 else 0
            if corr>best[0]:best=(corr,offset/8000)
           print(json.dumps({'focus_head_matches_track':key,'best_normalized_correlation':round(best[0],6),'offset_s':best[1]}))
          print('READ_ONLY_AUDIO_AUDIT_PASS; no asset, mapping, volume or moderation writes; no audio artifacts')
          PY_AUDIO
