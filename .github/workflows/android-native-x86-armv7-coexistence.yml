name: Android 11 x86 ARMv7 translation original+clone package coexistence (NO HOOK)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - '.github/workflows/android-native-x86-armv7-coexistence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-api30-x86-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Verify source syntax and original package safety guards
        run: |
          python3 -m py_compile android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_resolved_provider_authorities.py'
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_shadowed_signature_permissions.py'
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_clone_crash_classification.py'
      - name: Android 11 ARMv7 install original plus base-only permission-adjusted test clone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_5
          emulator-boot-timeout: 480
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: CELIKOM_CLEAN_ANDROID_ARMV7_TRANSLATION=1 CELIKOM_OMIT_SHADOWED_SIGNATURE_DECLS=1 python3 android/native-yandex-hooklab/clone_native_identity_phase2_ephemeral.py
      - name: Ensure original and clone APKs were not released
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'Third-party APKs and temporary research signer never leave CI'
