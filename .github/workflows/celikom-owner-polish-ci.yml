name: CELIKOM owner-requested UX checks (no deploy)
on:
  push:
    branches: [feature/api-range]
    paths:
      - website/app/src/CmsOwnerPolish.php
      - website/public/assets/css/v10/owner-polish.css
      - website/public/assets/js/v10/owner-polish.js
      - website/tests/CmsOwnerPolishTest.php
      - .github/workflows/celikom-owner-polish-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Check PHP and JS syntax and validate approved content
        run: |
          set -euo pipefail
          php -l website/app/src/CmsOwnerPolish.php
          php -l website/public/index.php
          php -l website/public/admin/index.php
          node --check website/public/assets/js/v10/owner-polish.js
          php website/tests/CmsOwnerPolishTest.php
