      - name: Deliver accepted owner-phone APK as unpublished owner-only draft release
        if: success() && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[export-beta-audio]')) || (github.event_name == 'workflow_dispatch' && inputs.export_diagnostic_apk))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = manufact-test/nomusic
          test "$GITHUB_REF_NAME" = experiment/android-a1-metrica-init-state-observer-arm13-20261112
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PUBLIC
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          bundle="$RUNNER_TEMP/celikom-a1-owner-phone-test"
          apk="$bundle/CELIKOM-A1-RAMIL-AU-BETA21-HONOR50-20261126.apk"
          test -f "$apk" && test ! -L "$apk"
          test -f "$bundle/README-RU.txt" && test ! -L "$bundle/README-RU.txt"
          # Existing private A1 drafts are delivery envelopes on main.
          # No code tag is created on a branch with different workflows.
          # Identify the actual APK source independently and unambiguously.
          test "$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)" = main
          cd "$bundle"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          name = "CELIKOM-A1-RAMIL-AU-BETA21-HONOR50-20261126.apk"
          apk = pathlib.Path(name)
          with apk.open("rb") as f:
              digest = hashlib.file_digest(f, "sha256").hexdigest()
          receipt = {
              "schema": 1,
              "distribution_only": True,
              "distribution_target": "main",
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_branch": os.environ["GITHUB_REF_NAME"],
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "native_launch_gate": "METRICA_READONLY_NATIVE_MAIN_75S_PASS_NOT_AUDIO",
              "acoustic_replacement_proven": False,
              "apk": name, "apk_size": apk.stat().st_size, "apk_sha256": digest,
          }
          with open("BUILD-PROVENANCE.json", "x") as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          sha256sum "$(basename "$apk")" README-RU.txt BUILD-PROVENANCE.json > SHA256SUMS.txt
          tag="celikom-a1-owner-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Draft only. The main target is distribution metadata, NOT the APK
          # source. The actual Android source SHA is recorded in the receipt.
          gh release create "$tag" "$apk" README-RU.txt BUILD-PROVENANCE.json SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target main --draft \
            --title "CELIKOM A1 — private owner diagnostic $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --notes "Unpublished owner-only delivery envelope on main, not a source release. Actual Android build source: $GITHUB_SHA ($GITHUB_REF_NAME). See BUILD-PROVENANCE.json and SHA256SUMS.txt. Native launch passed; acoustic replacement not proven. Do not publish."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,targetCommitish,assets,url > "$RUNNER_TEMP/celikom-a1-delivery-receipt.json"
          python3 - "$RUNNER_TEMP/celikom-a1-delivery-receipt.json" "$tag" "$bundle" <<'PY'
          import json, os, pathlib, sys
          from hashlib import file_digest
          receipt = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          assert receipt["isDraft"] is True and receipt["tagName"] == sys.argv[2]
          assert receipt["targetCommitish"] == "main"
          root = pathlib.Path(sys.argv[3])
          expected = {p.name: p for p in root.iterdir() if p.is_file()}
          assert set(expected) == {"CELIKOM-A1-RAMIL-AU-BETA21-HONOR50-20261126.apk", "README-RU.txt", "BUILD-PROVENANCE.json", "SHA256SUMS.txt"}
          provenance = json.loads(expected["BUILD-PROVENANCE.json"].read_bytes())
          assert provenance["source_commit"] == os.environ["GITHUB_SHA"]
          assert provenance["source_branch"] == os.environ["GITHUB_REF_NAME"]
          assert provenance["distribution_only"] is True
          assert len(receipt["assets"]) == len(expected)
          assert {a["name"] for a in receipt["assets"]} == set(expected)
          for a in receipt["assets"]:
              p = expected[a["name"]]
              assert a["size"] == p.stat().st_size
              if a.get("digest"):
                  with p.open("rb") as f:
                      assert a["digest"] == "sha256:" + file_digest(f, "sha256").hexdigest()
          print("CELIKOM_A1_PRIVATE_DRAFT_READY", receipt["url"])
          PY
