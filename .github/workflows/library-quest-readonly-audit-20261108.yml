name: CELIKOM — Quest Pistols and duplicate-track live DB READ ONLY audit
on:
  push:
    branches: [feature/library-readonly-quest-audit-20261108]
    paths: ['.github/workflows/library-quest-readonly-audit-20261108.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: celikom-library-quest-audit-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check nonmutating audit script
        run: |
          set -euo pipefail
          php -l tools/library-audit/quest-20261108-readonly.php
          if grep -Ein '\\b(INSERT|UPDATE|DELETE|REPLACE|TRUNCATE|ALTER|CREATE|DROP)\\s+(INTO|TABLE|FROM|[a-z_])' tools/library-audit/quest-20261108-readonly.php; then
            echo 'Potential SQL write keyword detected'; exit 1
          fi
      - name: Query production via strict read-only SQL transaction
        shell: bash
        env:
          HOST_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/private/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/private/hosts"
          chmod 600 "$RUNNER_TEMP/private/"*
          ssh -p 65002 -i "$RUNNER_TEMP/private/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/private/hosts" \
            u235811320@92.113.19.189 '/opt/alt/php83/usr/bin/php -d display_errors=stderr' < tools/library-audit/quest-20261108-readonly.php > "$RUNNER_TEMP/quest-library-audit.json"
          jq -e '.type=="CELIKOM_QUEST_LIBRARY_AUDIT_READ_ONLY" and .writes==0 and .yandex_unique_track_ids>=1 and (.quest_or_named_source_rows|type)=="array"' "$RUNNER_TEMP/quest-library-audit.json"
          echo '### Quest Pistols + library alias conflicts (read-only)' >> "$GITHUB_STEP_SUMMARY"
          jq '{checked_at_utc,quest_or_named_source_rows,yandex_unique_track_ids,replacement_rows_inspected,same_track_id_multiple_active,different_track_id_same_normalized_artist_title_groups,different_track_id_same_normalized_artist_title_examples,replacement_vs_source_duration_gt1500ms_count,replacement_vs_source_duration_gt1500ms_examples,writes}' "$RUNNER_TEMP/quest-library-audit.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celikom-quest-library-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/quest-library-audit.json
          retention-days: 30
          if-no-files-found: ignore
