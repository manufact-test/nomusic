name: CELIKOM A1 verified signed Floki spool stage (data only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-a1-owner-floki-spool.yml'
      - '.github/deploy/a1-owner-download-request.json'
      - '.github/scripts/floki-a1-root-signed-spool-consumer.py'
      - '.github/scripts/tests/floki-a1-signed-spool.test.py'
  # Manual fallback remains available if automatic workflow_run delivery is unavailable.
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'CELIKOM A1 Ramil Au Beta13 owner-phone audio test — no acoustic proof'
      - 'CELIKOM A1 Ramil Au BETA30 NAV51 live renderer correlation — no acoustic proof'
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: celikom-a1-verified-private-spool-recovery-beta30-ci01-20261128
  cancel-in-progress: true
jobs:
  stage-verified-signed-apk:
    if: github.repository == 'manufact-test/nomusic' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 18
    permissions:
      contents: write
      actions: read
    steps:
      # Only trusted main delivery code executes; never check out or execute
      # Android-branch code or scripts from the APK or source-run artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify local data-only stage and independent root fail-closed contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/tests/floki-a1-signed-spool.test.py
          python3 -m py_compile .github/scripts/floki-a1-root-signed-spool-consumer.py
          bash -n .github/scripts/floki-a1-signed-spool-bootstrap.sh
      - name: Provision GitHub CLI in isolated Floki runner
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v gh >/dev/null 2>&1; then exit 0; fi
          version=2.105.0
          bin="$HOME/.cache/celikom-a1-gh-v${version}/bin"
          mkdir -p "$bin"
          if [[ ! -x "$bin/gh" ]]; then
            archive="$RUNNER_TEMP/gh_${version}_linux_amd64.tar.gz"
            curl -fLsS --connect-timeout 12 --max-time 90 --retry 1 \
              -o "$archive" "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_amd64.tar.gz"
            tar -xzf "$archive" -C "$RUNNER_TEMP"
            install -m 700 "$RUNNER_TEMP/gh_${version}_linux_amd64/bin/gh" "$bin/gh"
          fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: Resolve exact successful ARM export and private release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" == PUBLIC ]]
          d="$RUNNER_TEMP/a1-verified-owner-delivery"
          mkdir -m700 "$d"
          python3 - "$d/request.json" <<'PY'
          import json,os,sys
          from pathlib import Path
          if os.environ['GITHUB_EVENT_NAME']=='workflow_run':
              run=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['workflow_run']
              request={'run_id':run['id'],'attempt':run['run_attempt']}
          else:
              request=json.loads(Path('.github/deploy/a1-owner-download-request.json').read_text())
          assert set(request) in ({'run_id','attempt'},{'run_id','attempt','release_id'})
          assert type(request['run_id']) is int and 1<=request['run_id']<=10**14
          assert type(request['attempt']) is int and 1<=request['attempt']<=100
          if 'release_id' in request:
              assert type(request['release_id']) is int and 1<=request['release_id']<=10**14
          Path(sys.argv[1]).write_text(json.dumps(request))
          PY
          run=$(jq -r .run_id "$d/request.json")
          attempt=$(jq -r .attempt "$d/request.json")
          tag="celikom-a1-owner-$run-$attempt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/$attempt" > "$d/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/$attempt/jobs?per_page=100" > "$d/jobs.json"
          python3 - "$d" <<'PY'
          import json,sys,re
          from pathlib import Path
          p=Path(sys.argv[1]); r=json.loads((p/'run.json').read_text())
          q=json.loads((p/'request.json').read_text());j=json.loads((p/'jobs.json').read_text())['jobs']
          assert r['id']==q['run_id'] and r['run_attempt']==q['attempt']
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_repository']['full_name']=='manufact-test/nomusic'
          assert r['head_branch']=='experiment/android-a1-metrica-init-state-observer-arm13-20261112'
          assert r['path'].split('@')[0]=='.github/workflows/android-a1-metrica-init-state-observer-arm13.yml'
          assert re.fullmatch(r'[0-9a-f]{40}',r['head_sha'])
          assert any(x['name']=='actual-2025-own-lspatch2-disposable-native-arm13' and x['conclusion']=='success' for x in j)
          assert any(x['name']=='jvm-issuer-proxy-contract' and x['conclusion']=='success' for x in j)
          print('A1_SOURCE_RUN_AND_BOTH_NATIVE_JVM_GATES_VERIFIED')
          PY
          # No export requested is a normal outcome for routine successful CI.
          release_id=$(jq -r '.release_id // empty' "$d/request.json")
          if [[ -n "$release_id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$d/release-raw.json"
            python3 - "$d" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);r=json.loads((p/'release-raw.json').read_text())
          normalized={
              'id':r['id'],'body':r.get('body') or '',
              'isDraft':r['draft'],'tagName':r['tag_name'],
              'targetCommitish':r['target_commitish'],
              'assets':[{'id':a['id'],'name':a['name'],'size':a['size'],'digest':a.get('digest')} for a in r['assets']]
          }
          (p/'release.json').write_text(json.dumps(normalized))
          PY
          else
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json id,body,isDraft,tagName,targetCommitish,assets > "$d/release.json"; then
              if [[ "$GITHUB_EVENT_NAME" == workflow_run ]] && ! jq -e '.head_commit.message | contains("[export-beta-audio]")' "$d/run.json" >/dev/null; then
                echo 'No owner APK export for this run; no delivery.'
                echo 'ready=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo 'Expected owner signed APK draft not found' >&2; exit 1
            fi
          fi
          python3 - "$d" "$tag" <<'PY'
          import json,sys,re
          from pathlib import Path
          p=Path(sys.argv[1]);r=json.loads((p/'release.json').read_text())
          assert r['isDraft'] is True and r['tagName']==sys.argv[2] and r['targetCommitish']=='main'
          a=r['assets']; apk=[x for x in a if re.fullmatch(r'CELIKOM-A1-[A-Za-z0-9_-]{1,100}\.apk',x['name'])]
          assert len(apk)==1 and {x['name'] for x in a}=={apk[0]['name'],'BUILD-PROVENANCE.json','SHA256SUMS.txt','README-RU.txt'}
          x=apk[0];assert 1024*1024<=x['size']<=160*1024*1024
          assert re.fullmatch(r'sha256:[0-9a-f]{64}',x['digest'])
          (p/'filename').write_text(x['name'])
          PY
          name=$(cat "$d/filename")
          jq -r '.assets[] | select(.name != "README-RU.txt") | "\(.id) \(.name)"' "$d/release.json" |
            while read -r asset_id asset_name; do
              [[ "$asset_id" =~ ^[0-9]+$ ]]
              [[ "$asset_name" == "$name" || "$asset_name" == BUILD-PROVENANCE.json || "$asset_name" == SHA256SUMS.txt ]]
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$d/$asset_name"
            done
          python3 - "$d" <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          p=Path(sys.argv[1]);r=json.loads((p/'release.json').read_text());run=json.loads((p/'run.json').read_text());q=json.loads((p/'request.json').read_text())
          v=json.loads((p/'BUILD-PROVENANCE.json').read_text());name=(p/'filename').read_text()
          assert v['schema']==1 and v['distribution_only'] is True and v['distribution_target']=='main'
          assert v['source_repository']=='manufact-test/nomusic' and v['source_branch']==run['head_branch'] and v['source_commit']==run['head_sha']
          assert v['workflow_run_id']==q['run_id'] and v['workflow_run_attempt']==q['attempt']
          assert v['native_launch_gate']=='METRICA_READONLY_NATIVE_MAIN_75S_PASS_NOT_AUDIO' and v['acoustic_replacement_proven'] is False
          assert v['apk']==name
          assets={a['name']:a for a in r['assets']}
          for n in [name,'BUILD-PROVENANCE.json','SHA256SUMS.txt']:
              f=p/n;assert f.is_file() and not f.is_symlink()
              with f.open('rb') as s: digest=hashlib.file_digest(s,'sha256').hexdigest()
              assert f.stat().st_size==assets[n]['size'] and assets[n]['digest']=='sha256:'+digest
          f=p/name;assert f.stat().st_size==v['apk_size'] and assets[name]['digest']=='sha256:'+v['apk_sha256']
          assert v['apk_sha256']+'  '+name in (p/'SHA256SUMS.txt').read_text().splitlines()
          metadata={'run':q['run_id'],'attempt':q['attempt'],'name':name,'size':v['apk_size'],'sha256':v['apk_sha256']}
          (p/'metadata.json').write_text(json.dumps(metadata,separators=(',',':'))+'\n')
          print('A1_PRIVATE_RELEASE_PROVENANCE_SIZE_AND_DIGEST_VERIFIED')
          PY
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r .id "$d/release.json")" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(jq -r .name "$d/metadata.json")" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(jq -r .size "$d/metadata.json")" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(jq -r .sha256 "$d/metadata.json")" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.source.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: steps.source.outputs.ready == 'true'
        with:
          packages: 'build-tools;36.0.0'
      - name: Independently verify existing A1 package and original install certificate
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/a1-verified-owner-delivery"
          name=$(cat "$d/filename")
          apk="$d/$name"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/36.0.0"
          "$sdk/apksigner" verify --verbose --print-certs "$apk" > "$d/signer.txt"
          grep -Fqx 'Signer #1 certificate SHA-256 digest: 048d76e1c4447fa4f3ac976c45d5a0f8427c087fa665c4fca88ce5caa068f9bf' "$d/signer.txt"
          test "$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' "$d/signer.txt")" = 1
          grep -Eq 'Verified using v[23] scheme .*: true' "$d/signer.txt"
          "$sdk/aapt" dump badging "$apk" > "$d/badging.txt"
          grep -Fq "package: name='pro.celikom.yandex.nativeclonelab'" "$d/badging.txt"
          echo A1_APKSIGNER_AND_ORIGINAL_PACKAGE_VERIFIED
      - name: Stage only immutable verified signed APK as untrusted Floki runner data
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/a1-verified-owner-delivery"
          name=$(cat "$d/filename")
          python3 -m py_compile .github/scripts/floki-a1-signed-spool.py
          python3 .github/scripts/floki-a1-signed-spool.py \
            --apk "$d/$name" \
            --metadata "$d/metadata.json" \
            --provenance "$d/BUILD-PROVENANCE.json"
          echo A1_APK_PRIVATELY_STAGED_AWAIT_INDEPENDENT_ROOT_PROMOTION
      - name: Wait for root-verified Floki receipt and store owner link in unpublished draft
        if: steps.source.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          A1_RUN: ${{ steps.source.outputs.run }}
          A1_ATTEMPT: ${{ steps.source.outputs.attempt }}
          A1_RELEASE_ID: ${{ steps.source.outputs.release_id }}
          A1_APK_NAME: ${{ steps.source.outputs.apk_name }}
          A1_APK_SIZE: ${{ steps.source.outputs.apk_size }}
          A1_APK_SHA256: ${{ steps.source.outputs.apk_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          d="$RUNNER_TEMP/a1-verified-owner-delivery"
          receipt="/home/runner/celikom-a1-signed-spool/receipts/a1-${A1_RUN}-${A1_ATTEMPT}.json"
          for attempt in $(seq 1 24); do
            [[ -f "$receipt" && ! -L "$receipt" ]] && break
            sleep 30
          done
          [[ -f "$receipt" && ! -L "$receipt" ]] || {
            echo A1_ROOT_RECEIPT_TIMEOUT >&2
            exit 1
          }
          python3 - "$d" "$receipt" <<'PY'
          import json,re,stat,sys,os
          from pathlib import Path
          d=Path(sys.argv[1]); receipt=Path(sys.argv[2])
          st=receipt.lstat()
          if not stat.S_ISREG(st.st_mode) or st.st_size>4096:
              raise SystemExit('A1_INVALID_ROOT_RECEIPT_FILE')
          r=json.loads(receipt.read_text())
          expected={
              'run':int(os.environ['A1_RUN']),
              'attempt':int(os.environ['A1_ATTEMPT']),
              'name':os.environ['A1_APK_NAME'],
              'size':int(os.environ['A1_APK_SIZE']),
              'sha256':os.environ['A1_APK_SHA256'],
          }
          for key,value in expected.items():
              if r.get(key)!=value:
                  raise SystemExit('A1_ROOT_RECEIPT_'+key.upper()+'_MISMATCH')
          if r.get('https_verified') is not True:
              raise SystemExit('A1_ROOT_HTTPS_NOT_VERIFIED')
          url=r.get('url','')
          pattern=r'https://celikom\.com/downloads/a1/[0-9a-f]{48}/'+re.escape(expected['name'])
          if not re.fullmatch(pattern,url):
              raise SystemExit('A1_ROOT_RECEIPT_URL_INVALID')
          release=json.loads((d/'release.json').read_text())
          if release.get('isDraft') is not True or release.get('targetCommitish')!='main':
              raise SystemExit('A1_OWNER_DRAFT_NOT_UNPUBLISHED')
          body=release.get('body') or ''
          marker='A1_OWNER_DOWNLOAD_URL='
          found=re.findall(r'^A1_OWNER_DOWNLOAD_URL=(https://celikom\.com/downloads/a1/[0-9a-f]{48}/[A-Za-z0-9_.-]+\.apk)$',body,re.M)
          if found and found!=[url]:
              raise SystemExit('A1_OWNER_DRAFT_LINK_CONFLICT')
          notes=body if found else body.rstrip()+'\n\n---\n\nOwner-only download capability (unpublished draft; do not share):\n'+marker+url+'\n'
          (d/'url').write_text(url)
          (d/'release-patch.json').write_text(json.dumps({'body':notes},separators=(',',':')))
          PY
          if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$A1_RELEASE_ID" --input "$d/release-patch.json" >/dev/null 2>&1; then
            echo A1_OWNER_DRAFT_PATCH_FAILED >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$A1_RELEASE_ID" > "$d/release-after.json"
          python3 - "$d" <<'PY'
          import json,sys
          from pathlib import Path
          d=Path(sys.argv[1]);r=json.loads((d/'release-after.json').read_text())
          url=(d/'url').read_text()
          body=r.get('body') or ''
          if r.get('draft') is not True or body.count('A1_OWNER_DOWNLOAD_URL=')!=1:
              raise SystemExit('A1_OWNER_DRAFT_READBACK_INVALID')
          if 'A1_OWNER_DOWNLOAD_URL='+url not in body:
              raise SystemExit('A1_OWNER_DRAFT_READBACK_MISMATCH')
          print('A1_ROOT_RECEIPT_AND_OWNER_DRAFT_LINK_VERIFIED')
          PY
          printf 'A1_OWNER_APK=%s\nA1_OWNER_APK_SIZE=%s\nA1_OWNER_APK_SHA256=%s\nA1_ROOT_HTTPS_VERIFIED=true\n' \
            "$A1_APK_NAME" "$A1_APK_SIZE" "$A1_APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary APK and metadata
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/a1-verified-owner-delivery"
