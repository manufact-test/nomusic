        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/a1-verified-owner-delivery"
          name=$(cat "$d/filename")
          python3 -m py_compile .github/scripts/floki-a1-signed-spool.py
          python3 .github/scripts/floki-a1-signed-spool.py \
