name: CELIKOM staging original v10 PNG live check
on:
  push:
    branches: [feature/api-range]
    paths:
      - .github/workflows/celikom-original-png-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read-only original image / staged site verification
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = manufact-test/nomusic
          test "$GITHUB_REF" = refs/heads/feature/api-range
          test -n "${SSH_KEY:-}" && test -n "${KNOWN_HOSTS:-}"
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$SSH_KEY" > "$tmp/id"
          printf '%s\n' "$KNOWN_HOSTS" > "$tmp/known"
          chmod 600 "$tmp/id" "$tmp/known"
          ssh -T -p 65002 -i "$tmp/id" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known" -o ConnectTimeout=15 u235811320@92.113.19.189 'bash -se' <<'REMOTE'
          set -euo pipefail
          root=/home/u235811320/domains/lemonchiffon-narwhal-791953.hostingersite.com
          test -f "$root/celikom-private/app/staging-approved.php"
          test -f "$root/celikom-private/staging-owner-credentials.txt"
          pass=$(sed -n 's/^HTTP Basic password: //p' "$root/celikom-private/staging-owner-credentials.txt")
          test -n "$pass"
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          base=https://lemonchiffon-narwhal-791953.hostingersite.com
          unauth=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$base/?v10_popup=approved")
          site_unauthed=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$base/")
          echo "UNAUTH_IMG_STATUS=$unauth"
          echo "UNAUTH_SITE_STATUS=$site_unauthed"
          test "$unauth" = 401 && test "$site_unauthed" = 401
          page=$(curl -sS --max-time 25 -u "review:$pass" -o "$temporary/home.html" -w '%{http_code}' "$base/")
          echo "AUTH_PAGE_STATUS=$page"
          test "$page" = 200
          if grep -Fq 'src="/?v10_popup=approved"' "$temporary/home.html"; then
            echo "ORIGINAL_IMAGE_SRC_IN_HTML=yes"
          else
            echo "ORIGINAL_IMAGE_SRC_IN_HTML=no"
          fi
          code=$(curl -sS --max-time 25 -u "review:$pass" -D "$temporary/headers" -o "$temporary/image" -w '%{http_code}' "$base/?v10_popup=approved")
          echo "AUTH_IMG_STATUS=$code"
          if test "$code" = 200; then
            printf "IMG_SIZE="; wc -c < "$temporary/image"
            printf "IMG_SHA256="; sha256sum "$temporary/image" | awk '{print $1}'
            printf "IMG_MIME="; file --mime-type -b "$temporary/image"
          else
            /opt/alt/php83/usr/bin/php -r '
              $c=require $argv[1];
              $pdo=new PDO("mysql:host=".$c["CELIKOM_SITE_DB_HOST"].";dbname=".$c["CELIKOM_SITE_DB_NAME"].";charset=utf8mb4",$c["CELIKOM_SITE_DB_USER"],$c["CELIKOM_SITE_DB_PASSWORD"],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $q=$pdo->prepare("SELECT COUNT(*) FROM media_assets WHERE sha256=? AND mime_type=? AND is_active=1");
              $q->execute(["0366d4f32b0edf67c2300b372202e5604999fa9e9dbb8f2ebfd295aed6fcf1fc","image/png"]);
              echo "EXACT_APPROVED_PNG_RECORDS=",$q->fetchColumn(),"\n";
              echo "MEDIA_TOTAL_RECORDS=",$pdo->query("SELECT COUNT(*) FROM media_assets")->fetchColumn(),"\n";
            ' "$root/celikom-private/staging-config.php"
          fi
          expected=0366d4f32b0edf67c2300b372202e5604999fa9e9dbb8f2ebfd295aed6fcf1fc
          if test "$code" = 200 && test "$(sha256sum "$temporary/image" | awk '{print $1}')" = "$expected" && grep -Fq 'src="/?v10_popup=approved"' "$temporary/home.html"; then
            echo "CELIKOM_ORIGINAL_V10_PNG_LIVE_VERIFIED"
          else
            echo "CELIKOM_ORIGINAL_V10_PNG_NOT_YET_LIVE"
          fi
          REMOTE
