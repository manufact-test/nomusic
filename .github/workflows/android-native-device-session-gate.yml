name: CELIKOM Native Android read-only signed-UI MediaSession gate
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - 'android/native-yandex-hooklab/device-session-gate/**'
      - '.github/workflows/android-native-device-session-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify zero mutation, zero network, signer pin and optional access
        run: |
          set -euo pipefail
          python3 -m unittest discover -s android/native-yandex-hooklab/device-session-gate/tests -p 'test_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android/native-yandex-hooklab/device-session-gate")
          manifest=(root/"app/src/main/AndroidManifest.xml").read_text()
          activity=(root/"app/src/main/java/pro/celikom/nativegate/GateActivity.java").read_text()
          listener=(root/"app/src/main/java/pro/celikom/nativegate/NativeSessionListener.java").read_text()
          assert "<uses-permission" not in manifest
          assert "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" in manifest
          assert ".getActiveSessions(listener)" in activity
          assert "SessionToken.createSessionToken(" in activity
          assert "releaseFuture(future)" in activity
          assert "onNotificationPosted" in listener and "getNotification()" not in listener
          for illegal in ("android.permission.INTERNET", "RECORD_AUDIO",
                         "REQUEST_INSTALL_PACKAGES", "MediaPlayer(", ".setMediaItems(",
                         ".replaceMediaItem(", ".setMediaItem(", ".seekTo(", ".play(",
                         "getMediaMetadata(", "HttpURLConnection", "getAccount"):
              assert illegal not in activity and illegal not in manifest, illegal
          print("PASS: first-party public MediaSession CAPABILITY-ONLY; no playback, no network, no private notification content")
          PY
  build-readonly-gate:
    needs: security-and-scope
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated CELIKOM Native Gate; do not build or patch Yandex
        run: |
          set -euo pipefail
          gradle -p android/native-yandex-hooklab/device-session-gate :app:assembleDebug --no-daemon
      - name: Check release boundary, manifest and APK signing without bypass
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/CELIKOM-Native-Yandex-Session-Gate-0.1-READONLY.apk"
          cp android/native-yandex-hooklab/device-session-gate/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          test -s "$OUT"
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          TOOL=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$TOOL" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/native-gate-sign.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/native-gate-sign.txt"
          APK="$OUT" python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["APK"])
          receipt={
            "format":"celikom-native-public-session-gate-v1",
            "source_commit":os.environ["GITHUB_SHA"],
            "artifact_filename":p.name,
            "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "size_bytes":p.stat().st_size,
            "package":"pro.celikom.nativegate",
            "signed_debug_apk_v2_verified":True,
            "installed_or_played":False,
            "vendor_yandex_modified":False,
            "requires_optional_notification_listener_access_for_active_session":True,
            "reads_notification_content":False,
            "has_internet_permission":False,
            "reads_yandex_metadata_tokens_audio":False,
            "sends_yandex_playback_commands":False,
            "native_yandex_source_replacement_proven":False,
            "physical_honor_verified":False,
            "build_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          pathlib.Path(os.environ["RUNNER_TEMP"],"CELIKOM-Native-Gate-READONLY-RECEIPT.json").write_text(
              json.dumps(receipt,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - name: Upload only first-party signed read-only diagnostic + receipt
        uses: actions/upload-artifact@v4
        with:
          name: CELIKOM-Native-Public-Session-Gate-0.1-READONLY
          path: |
            ${{ runner.temp }}/CELIKOM-Native-Yandex-Session-Gate-0.1-READONLY.apk
            ${{ runner.temp }}/CELIKOM-Native-Gate-READONLY-RECEIPT.json
          if-no-files-found: error
          retention-days: 7
