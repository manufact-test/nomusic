name: CELIKOM Blur pilot live DB read-only dedupe (fifth candidate)

on:
  push:
    branches: [feature/blur-pilot-five-20261108]
    paths: ['.github/workflows/blur-pilot-five-db-readonly.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celikom-blur-five-readonly-db
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify SSH identity and execute SELECT-only PHP on known API host
        env:
          HOST_KEY: ${{ secrets.CELIKOM_HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CELIKOM_HOSTINGER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/private/id_host"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/private/known_hosts"
          chmod 600 "$RUNNER_TEMP/private/"*
          SSH=(ssh -p 65002 -i "$RUNNER_TEMP/private/id_host" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/private/known_hosts")
          "${SSH[@]}" u235811320@92.113.19.189 'php' < .github/scripts/blur-five-db-status-readonly.php