name: CELIKOM Windows W73 real support mail state READ ONLY
on:
  push:
    branches: [experiment/windows-w72-extension-anti-drop-guards-20261111]
    paths:
      - .github/workflows/windows-w73-mail-readonly.yml
      - .github/scripts/windows-w73/mail-audit-readonly.php
permissions:
  contents: read
concurrency:
  group: celikom-w73-mail-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify audit script
        run: php -l .github/scripts/windows-w73/mail-audit-readonly.php
      - name: Read active release, SMTP readiness and recent ticket delivery metadata
        shell: bash
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_SSH_KEY:-}"
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$work/key"
          ssh-keygen -y -P '' -f "$work/key" > "$work/pub"
          test "$(ssh-keygen -lf "$work/pub" | awk '{print $2}')" = 'SHA256:Q6FyifXRq6garceQdIIjBmXhkk81Ic1p/x9JTSYHWUk'
          printf '%s\n' '[92.113.19.189]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAf8M2EVwq0oJI8I9KZ0NFE8P8yDOvDATEhkQti/Kk/0' > "$work/known_hosts"
          opts=(-i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh -T -p 65002 "${opts[@]}" 'u235811320@92.113.19.189' '/opt/alt/php83/usr/bin/php /dev/stdin' < .github/scripts/windows-w73/mail-audit-readonly.php
          echo 'W73_REMOTE_READONLY_NO_EMAILS_SENT_NO_DB_WRITES'
