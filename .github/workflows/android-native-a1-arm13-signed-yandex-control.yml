name: Android A1 native ARM13 signed original Yandex control only, no clone
on:
  push:
    branches:
      - experiment/android-native-a1-lspatch-clone-loader0-20261111
    paths:
      - 'android/native-yandex-hooklab/native_arm13_signed_original_control.py'
      - '.github/workflows/android-native-a1-arm13-signed-yandex-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-arm-signed-original-only:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native ARM tools and link isolated Android SDK audit utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner zipalign
          sdk="$RUNNER_TEMP/celikom-arm-sdk"
          mkdir -p "$sdk/build-tools/35.0.0"
          for tool in aapt apksigner zipalign; do
            ln -s "$(command -v "$tool")" "$sdk/build-tools/35.0.0/$tool"
            test -x "$sdk/build-tools/35.0.0/$tool"
          done
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          python3 -m py_compile android/native-yandex-hooklab/native_arm13_signed_original_control.py
      - name: Boot true ARM64 Android13 guest, support native ARMv7
        shell: bash
        timeout-minutes: 16
        run: bash android/native-yandex-hooklab/ci/native_arm_redroid_boot_only.sh
      - name: Check original issuer-signed five split package, install and check MAIN
        shell: bash
        timeout-minutes: 6
        run: python3 android/native-yandex-hooklab/native_arm13_signed_original_control.py
      - name: Destroy all temporary original APKs and Redroid guest data
        if: always()
        shell: bash
        run: |
          docker stop celikom-native-arm-android13 >/dev/null 2>&1 || true
          sudo umount /dev/binderfs >/dev/null 2>&1 || true
          sudo modprobe -r binder_linux >/dev/null 2>&1 || true
          sudo rm -rf -- "$RUNNER_TEMP/celikom-redroid-data" "$RUNNER_TEMP/celikom-arm-sdk"
          echo '{"publisher_apk_retained":false,"artifacts_uploaded":false,"owner_phone_modified":false}'
