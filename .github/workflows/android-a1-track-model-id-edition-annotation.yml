name: CELIKOM A1 exact signed Track Album ID edition annotation gate
on:
  push:
    branches: [experiment/android-a1-metrica-init-state-observer-arm13-20261112]
    paths:
      - 'android/native-yandex-hooklab/ci/a1_private_track_model_identity_annotation.py'
      - '.github/workflows/android-a1-track-model-id-edition-annotation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-track-model-identifiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scanner and install publisher-signature tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile android/native-yandex-hooklab/ci/a1_private_track_model_identity_annotation.py
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner
      - name: Download EXACT user-authorized publisher-signed historical original privately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' \
            | grep -qx 442137464
          mkdir -p "$RUNNER_TEMP/celikom-id-annotation"
          gh release download a1-yandex-2025-gpr-private-test \
            --repo "$GITHUB_REPOSITORY" \
            --pattern yandex-music-2025-10-4-120-1gpr.xapk \
            --dir "$RUNNER_TEMP/celikom-id-annotation" --clobber >/dev/null
          f="$RUNNER_TEMP/celikom-id-annotation/yandex-music-2025-10-4-120-1gpr.xapk"
          test "$(stat -c %s "$f")" = 45961661
          test "$(sha256sum "$f" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053
      - name: Decide semantic TrackID AlbumID edition provenance without any live hook
        shell: bash
        run: |
          set -euo pipefail
          python3 -B android/native-yandex-hooklab/ci/a1_private_track_model_identity_annotation.py \
            --xapk "$RUNNER_TEMP/celikom-id-annotation/yandex-music-2025-10-4-120-1gpr.xapk"
      - name: Securely remove research input; no APK or runtime changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/celikom-id-annotation"
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'NO_VENDOR_BINARY_EXPORTED_NO_AUDIO_MODIFICATION'
