name: CELIKOM Android A1 signed original playback process topology (read-only)
on:
  push:
    branches:
      - experiment/android-a1-metrica-init-state-observer-arm13-20261112
    paths:
      - 'android/native-yandex-hooklab/ci/a1_private_process_topology.py'
      - 'android/native-yandex-hooklab/ci/test_a1_private_process_topology.py'
      - '.github/workflows/android-a1-private-process-topology.yml'
permissions:
  contents: read
jobs:
  classify-original-process-topology:
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Validate bounded manifest parser offline
        run: python3 -B -m unittest discover -s android/native-yandex-hooklab/ci -p test_a1_private_process_topology.py -v
      - name: Provision isolated GitHub CLI if missing
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v gh >/dev/null 2>&1; then exit 0; fi
          version=2.105.0
          bin="$HOME/.cache/celikom-a1-gh-v${version}/bin"
          mkdir -p "$bin"
          if [[ ! -x "$bin/gh" ]]; then
            archive="$RUNNER_TEMP/gh_${version}_linux_amd64.tar.gz"
            curl -fLsS --connect-timeout 12 --max-time 90 --retry 1 \
              -o "$archive" "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_amd64.tar.gz"
            tar -xzf "$archive" -C "$RUNNER_TEMP"
            install -m 700 "$RUNNER_TEMP/gh_${version}_linux_amd64/bin/gh" "$bin/gh"
          fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: Verify the owner-supplied signed original and inspect only process categories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --install 'build-tools;35.0.0' >/dev/null
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$aapt2"
          d="$(mktemp -d "$RUNNER_TEMP/a1-processtop.XXXXXXXX")"
          trap 'rm -rf -- "$d"' EXIT
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.id == 442137464 and .draft == true and .tag_name == "a1-yandex-2025-gpr-private-test") | .id' | grep -qx 442137464
          gh release download a1-yandex-2025-gpr-private-test --repo "$GITHUB_REPOSITORY" --pattern yandex-music-2025-10-4-120-1gpr.xapk --dir "$d" --clobber >/dev/null
          x="$d/yandex-music-2025-10-4-120-1gpr.xapk"
          test "$(stat -c %s "$x")" = 45961661
          test "$(sha256sum "$x" | cut -d' ' -f1)" = 8e43be8900d28ee92c8e315ed07069568858bfd4a593757fba9d276bd0c54053
          python3 -B android/native-yandex-hooklab/ci/a1_private_process_topology.py --xapk "$x" --aapt2 "$aapt2"
