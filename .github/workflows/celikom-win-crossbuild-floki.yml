name: CELIKOM Windows x64 build on isolated FlokiNET
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows-companion/**'
      - '.github/ci/celikom-win-crossbuild-trigger.txt'
      - '.github/workflows/celikom-win-crossbuild-floki.yml'

permissions:
  contents: read

concurrency:
  group: celikom-win-crossbuild-floki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-compile:
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_HOME: /home/runner/_work/_temp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate preinstalled .NET 10 SDK in isolated image
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/dotnet
          dotnet --version
          dotnet --list-sdks
          dotnet --version | cut -d. -f1 | grep -Fx 10
      - name: Probe supported isolated Linux packaging tools (no credentials)
        id: packtools
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "wine=$(command -v wine || echo missing)"
            echo "wine64=$(command -v wine64 || echo missing)"
            echo "nsis=$(command -v makensis || echo missing)"
            echo "inno=$(command -v iscc || echo missing)"
            echo "sevenz=$(command -v 7z || echo missing)"
            echo "apt=$(command -v apt-get || echo missing)"
            echo "user=$(id -un)"
          } >> "$GITHUB_OUTPUT"
      - name: 'Tool inventory wine=${{ steps.packtools.outputs.wine }} nsis=${{ steps.packtools.outputs.nsis }} apt=${{ steps.packtools.outputs.apt }} uid=${{ steps.packtools.outputs.user }}'
        shell: bash
        run: true
      - name: Unprivileged official-package Wine feasibility (read-only)
        id: wineapt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "package_candidate=$(apt-cache policy wine64 2>/dev/null | sed -n 's/^ *Candidate: //p' | head -1 | tr -cd 'A-Za-z0-9.:-' || true)"
            echo "wine_loader_candidate=$(apt-cache policy libwine 2>/dev/null | sed -n 's/^ *Candidate: //p' | head -1 | tr -cd 'A-Za-z0-9.:-' || true)"
            echo "archive=$(command -v dpkg-deb || echo missing)"
            echo "pkg_dir=$(test -d /var/lib/apt/lists && find /var/lib/apt/lists -type f | wc -l || echo missing)"
          } >> "$GITHUB_OUTPUT"
      - name: 'Wine package sources wine64=${{ steps.wineapt.outputs.package_candidate }} libwine=${{ steps.wineapt.outputs.wine_loader_candidate }} dpkg=${{ steps.wineapt.outputs.archive }} lists=${{ steps.wineapt.outputs.pkg_dir }}'
        shell: bash
        run: true
      - name: Read-only Floki API and admin login form acceptance (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          url=https://api.celikom.com
          code=$(curl --fail-with-body -sS --connect-timeout 5 --max-time 20 -o "$tmp/health" -w '%{http_code}' "$url/api/v1/health")
          test "$code" = 200
          code=$(curl --fail-with-body -sS --connect-timeout 5 --max-time 20 -o "$tmp/login" -w '%{http_code}' "$url/admin/login")
          test "$code" = 200
          grep -Eqi '<form' "$tmp/login"
          grep -Eqi 'password' "$tmp/login"
          code=$(curl -sS --connect-timeout 5 --max-time 20 -o "$tmp/me" -w '%{http_code}' "$url/api/v1/auth/me")
          test "$code" = 401
          echo CELIKOM_W178_LIVE_PUBLIC_ADMIN_FORM_AND_AUTH_ROUTE_OK
      - name: W178 current-track native source revalidation regression tests
        shell: bash
        working-directory: windows-companion/w23
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-package-lock
          npm run build
          node --test initial-current-source.test.mjs native-host.test.mjs renderer-relay.test.mjs
          echo CELIKOM_W178_NATIVE_RENDERER_REGRESSION_PASS
      - name: Cross-compile Windows WinForms companion and updater on Linux
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version
          dotnet build windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj \
            -c Release -p:EnableWindowsTargeting=true -warnaserror -m:1
          dotnet build windows-companion/w15/Celikom.UpdateSupervisor/Celikom.UpdateSupervisor.csproj \
            -c Release -p:EnableWindowsTargeting=true -warnaserror -m:1
          echo CELIKOM_WINDOWS_CROSSBUILD_COMPILE_OK
      - name: Publish unsigned Windows single-file EXEs on Linux
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qa-exe]')
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/celikom-win-x64-crosspublish"
          mkdir -p "$out/companion" "$out/supervisor"
          dotnet publish windows-companion/w15/Celikom.Companion/Celikom.Companion.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -m:1 -o "$out/companion"
          dotnet publish windows-companion/w15/Celikom.UpdateSupervisor/Celikom.UpdateSupervisor.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -m:1 -o "$out/supervisor"
          python3 - "$out" <<'PY'
          import hashlib, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          for rel in ("companion/CELIKOM.Companion.exe", "supervisor/CELIKOM.UpdateSupervisor.exe"):
              path=root/rel
              assert path.is_file(), f"Missing exe: {rel}"
              with path.open("rb") as f:
                  assert f.read(2)==b"MZ", f"Not a Windows PE executable: {rel}"
              size=path.stat().st_size
              assert size>2_000_000, f"Unexpectedly small executable: {rel} ({size})"
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"CELIKOM_CROSSPUBLISH_PE_VALID {rel} bytes={size} sha256={digest}")
          PY
          echo CELIKOM_WINDOWS_UNSIGNED_CROSSPUBLISH_OK
