name: Browser support attachments
on:
  push:
    branches: [feature/desktop-support-attachments-20261111]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CELIKOM_API_BASE_URL: https://darkred-camel-588676.hostingersite.com
      REQUIRE_BROWSER_AUDIO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:extension
      - run: node scripts/test-support-browser.mjs
      - run: npm --prefix extension run validate
      - run: npm run security
      - run: npm run build:extension
      - name: Verify final package
        run: |
          cd extension/dist
          sha256sum --check celikom-extension-0.4.76.zip.sha256
          cat celikom-extension-0.4.76.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-extension-0.4.76
          path: |
            extension/dist/celikom-extension-0.4.76.zip
            extension/dist/celikom-extension-0.4.76.zip.sha256
          if-no-files-found: error
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-mysql
          MYSQL_DATABASE: celikom_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-mysql"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: celikom_test
      DB_USER: root
      DB_PASSWORD: ci-disposable-mysql
      STORAGE_PATH: /tmp/celikom-support-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6d4006e874aef08c1430759b4c5d303e2f0a06a0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo
          coverage: none
      - name: Syntax, persistence, exports, private access and compatibility
        run: |
          set -euo pipefail
          php -l server/src/Support/SupportReport.php
          php -l server/src/Support/SongReport.php
          php -l server/src/Support/SupportService.php
          php -l server/src/Support/SupportAdminView.php
          php -l server/src/Admin/AdminPanel.php
          php -l server/src/Application.php
          php server/tests/database.php
          php server/tests/support.php
          php server/tests/auth.php
          php server/tests/entitlement.php
          php server/tests/uploads.php
          php server/tests/admin.php

  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read source hashes only, without database or environment access
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$dir/key"
          chmod 600 "$dir/key"
          ssh-keygen -y -P '' -f "$dir/key" > "$dir/key.pub"
          test "$(ssh-keygen -lf "$dir/key.pub" -E sha256 | awk '{print $2}')" = 'SHA256:Q6FyifXRq6garceQdIIjBmXhkk81Ic1p/x9JTSYHWUk'
          printf '%s\n' '[92.113.19.189]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAf8M2EVwq0oJI8I9KZ0NFE8P8yDOvDATEhkQti/Kk/0' > "$dir/known_hosts"
          ssh -p 65002 -i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 u235811320@92.113.19.189 /opt/alt/php83/usr/bin/php < .github/scripts/browser-support-live-readonly.php
