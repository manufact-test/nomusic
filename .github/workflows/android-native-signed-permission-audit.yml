name: Android exact signed Yandex credential permission metadata (READ-ONLY)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - 'android/native-yandex-hooklab/audit_native_declared_permissions_ephemeral.py'
      - '.github/workflows/android-native-signed-permission-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-manifest-permissions-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python source and original-package invariant checks
        run: |
          python3 -m py_compile android/native-yandex-hooklab/audit_native_declared_permissions_ephemeral.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_clone_native_splits_ephemeral.py'
      - name: Read only publisher-verified public permission declarations and DEX literal counts
        run: python3 android/native-yandex-hooklab/audit_native_declared_permissions_ephemeral.py
      - name: Confirm no modified publisher app published
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'No real account access or third-party binaries uploaded'
