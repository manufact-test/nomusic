name: CELIKOM 0.4.55 popup state and invalidated context
on:
  push:
    branches: [fix/upload-button-context-20261018]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-mysql
          MYSQL_DATABASE: celikom_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-mysql"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: celikom_test
      DB_USER: root
      DB_PASSWORD: ci-disposable-mysql
      STORAGE_PATH: /tmp/celikom-ci-private-audio
      REQUIRE_BROWSER_AUDIO: "1"
      CELIKOM_API_BASE_URL: https://darkred-camel-588676.hostingersite.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo
          coverage: none
      - run: npm ci
      - run: php -l server/src/Application/Mp3Inspector.php
      - run: php -l server/src/Application/UploadService.php
      - run: php -l server/tests/uploads.php
      - name: Prepare audio-only synthetic test encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Full repository validation, server MySQL upload tests, configured build
        run: npm run ci
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-0.4.55-upload-stability
          path: |
            extension/dist/celikom-extension-0.4.55.zip
            extension/dist/celikom-extension-0.4.55.zip.sha256
            server/src/Application/Mp3Inspector.php
          if-no-files-found: error
          retention-days: 14
