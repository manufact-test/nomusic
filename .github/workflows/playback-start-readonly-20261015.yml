name: Read-only playback startup and catalog audit
on:
  push:
    branches: [feature/api-range]
    paths: [.github/workflows/playback-start-readonly-20261015.yml]
permissions:
  contents: read
concurrency:
  group: celikom-hostinger-private-test
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect approved private audio without mutation or audio artifacts
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          target=u235811320@92.113.19.189
          remote=/home/u235811320/domains/darkred-camel-588676.hostingersite.com/celikom/incoming/playback-start-audit-${GITHUB_RUN_ID}.php
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > "$work/key"
          ssh-keygen -y -P '' -f "$work/key" > "$work/public"
          test "$(ssh-keygen -lf "$work/public" -E sha256 | awk '{print $2}')" = 'SHA256:Q6FyifXRq6garceQdIIjBmXhkk81Ic1p/x9JTSYHWUk'
          printf '%s\n' '[92.113.19.189]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAf8M2EVwq0oJI8I9KZ0NFE8P8yDOvDATEhkQti/Kk/0' > "$work/known_hosts"
          opts=(-i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          trap 'ssh -p 65002 "${opts[@]}" "$target" "rm -f '\''$remote'\''" || true; rm -rf "$work"' EXIT
          cat > "$work/audit.php" <<'PHP'
          <?php
          ini_set('display_errors','0');
          try {
          $app='/home/u235811320/domains/darkred-camel-588676.hostingersite.com/celikom';
          require $app.'/current/bootstrap.php';$config=require $app.'/current/config/app.php';
          $pdo=Celikom\Database\Connection::open($config);$pdo->exec('SET TRANSACTION READ ONLY');$pdo->beginTransaction();
          $rows=$pdo->query("SELECT t.service_track_id,t.title,r.id,r.version,r.status,r.is_active,r.disabled_at,a.mime_type,a.size_bytes,a.storage_key,a.duration_ms FROM tracks t LEFT JOIN track_replacements r ON r.track_id=t.id LEFT JOIN audio_assets a ON a.id=r.audio_asset_id WHERE t.service='yandex' AND t.service_track_id IN ('48591518','48592008','34139530','39013770','105553785') ORDER BY t.service_track_id,r.id")->fetchAll(PDO::FETCH_ASSOC);
          $all=$pdo->query("SELECT t.service_track_id,a.mime_type FROM tracks t JOIN track_replacements r ON r.track_id=t.id JOIN audio_assets a ON a.id=r.audio_asset_id WHERE r.status='approved' AND r.is_active=1 AND r.disabled_at IS NULL ORDER BY t.service_track_id")->fetchAll(PDO::FETCH_ASSOC);$pdo->commit();
          $storage=new Celikom\Storage\LocalStorageAdapter($config['storage_path']);
          foreach($rows as &$row){$key=$row['storage_key'];unset($row['storage_key']);$row['stored_bytes']=$key&&$storage->exists($key)?$storage->getSize($key):null;
          if($key&&$row['stored_bytes']){$stream=$storage->openStream($key);$head=fread($stream,10);fclose($stream);$row['id3_bytes']=substr($head,0,3)==='ID3'?10+((ord($head[6])&127)<<21)+((ord($head[7])&127)<<14)+((ord($head[8])&127)<<7)+(ord($head[9])&127):0;}}
          unset($row);echo json_encode(['release'=>basename(realpath($app.'/current')),'focus'=>$rows,'approved'=>$all],JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR),"\n";
          foreach(['health','config'] as $endpoint){$ch=curl_init('https://darkred-camel-588676.hostingersite.com/api/v1/'.$endpoint);curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_TIMEOUT=>15]);$body=curl_exec($ch);echo json_encode(['endpoint'=>$endpoint,'status'=>curl_getinfo($ch,CURLINFO_HTTP_CODE),'elapsed_ms'=>round(curl_getinfo($ch,CURLINFO_TOTAL_TIME)*1000),'bytes'=>is_string($body)?strlen($body):0]),"\n";curl_close($ch);}
          foreach($rows as $row){if($row['service_track_id']!=='48591518'||$row['status']!=='approved'||!(int)$row['is_active'])continue;
          $tokens=new Celikom\Application\AudioTokenService($config['audio_signing_key']);$expires=time()+60;$url='https://darkred-camel-588676.hostingersite.com/api/v1/audio/'.$row['id'].'?token='.$tokens->sign((int)$row['id'],(int)$row['version'],$expires).'&expires='.$expires;
          $ch=curl_init($url);curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_TIMEOUT=>15,CURLOPT_HTTPHEADER=>['Range: bytes=0-524287']]);$body=curl_exec($ch);echo json_encode(['endpoint'=>'audio-range','track'=>'48591518','status'=>curl_getinfo($ch,CURLINFO_HTTP_CODE),'elapsed_ms'=>round(curl_getinfo($ch,CURLINFO_TOTAL_TIME)*1000),'mime'=>curl_getinfo($ch,CURLINFO_CONTENT_TYPE),'bytes'=>is_string($body)?strlen($body):0]),"\n";curl_close($ch);}
          echo "READ_ONLY_STARTUP_AUDIT_PASS; no mappings, audio, accounts or volume changed\n";
          }catch(Throwable $e){fwrite(STDERR,'Restricted startup audit failed: '.get_class($e)."\n");exit(1);}
          PHP
          scp -P 65002 "${opts[@]}" "$work/audit.php" "$target:$remote"
          ssh -p 65002 "${opts[@]}" "$target" "/opt/alt/php83/usr/bin/php '$remote'"
