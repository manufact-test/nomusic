name: Android A1 B42 source contract (isolated)
on:
  push:
    branches:
      - experiment/android-a1-parallel-audio-contract-20261111
      - experiment/android-native-a1-lspatch-clone-loader0-20261111
      - experiment/android-a1-final-native-source-hardening-handoff-20261112
      - experiment/android-a1-source-range-exactness-20261112
      - experiment/android-a1-b42-audio-controller-wire-20261112
    paths:
      - 'android/native-audio-contract/**'
      - 'docs/android/ANDROID-A1-PARALLEL-AUDIO-CONTRACT-20261111.md'
      - '.github/workflows/android-a1-b42-source-contract.yml'
  pull_request:
    paths:
      - 'android/native-audio-contract/**'
      - 'docs/android/ANDROID-A1-PARALLEL-AUDIO-CONTRACT-20261111.md'
      - '.github/workflows/android-a1-b42-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-source-contract:
    name: B42 pure source-only contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check android/native-audio-contract/source-contract.mjs
          node --check android/native-audio-contract/source-contract.test.mjs
      - name: PHP CLI for cross-language exact production ByteRange compatibility
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli
      - name: Deterministic source state and ACTUAL PHP ByteRange interoperability tests
        run: |
          php -v | head -n 2
          node --check android/native-audio-contract/server-byte-range-compat.test.mjs
          node --check android/native-audio-contract/actual-audio-controller-compat.test.mjs
          php -l android/native-audio-contract/actual-audio-controller-fixture.php
          node --test android/native-audio-contract/source-contract.test.mjs android/native-audio-contract/server-byte-range-compat.test.mjs android/native-audio-contract/actual-audio-controller-compat.test.mjs
