name: Android exact signed Le48 player receiver provenance (READ-ONLY)
on:
  push:
    branches:
      - experiment/android-native-yandex-fileinfo-hooklab-20261109
    paths:
      - 'android/native-yandex-hooklab/audit_native_ga4_field_receiver.py'
      - 'android/native-yandex-hooklab/tests/test_native_ga4_field_receiver.py'
      - '.github/workflows/android-native-ga4-field-receiver.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-dex-le48-field-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact DEX field slot and concrete new-instance evidence
        run: |
          set -eu
          python3 -m py_compile android/native-yandex-hooklab/audit_native_ga4_field_receiver.py
          python3 -m unittest discover -s android/native-yandex-hooklab/tests -p 'test_native_ga4_field_receiver.py' -v
      - name: Verify unchanged publisher-signed five APK six DEX exact Le48 field writes
        run: python3 android/native-yandex-hooklab/audit_native_ga4_field_receiver.py
      - name: Reject any third-party APK export or patch
        if: always()
        run: |
          test ! -d android/native-yandex-hooklab/release
          test ! -d android/native-yandex-hooklab/patched
          echo 'Only exact field provenance; no audio or decoder identity proven'
