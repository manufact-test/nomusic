name: android-one-player-lab-apk
on:
  push:
    branches:
      - experiment/android-one-player-source-gate-20261109
    paths:
      - 'android/one-player-prototype/**'
      - '.github/workflows/android-one-player-lab-apk.yml'
  workflow_dispatch:
jobs:
  android-lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android/one-player-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35 from runner SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Local-only APK inspector regression
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Compile host-only source-gate
        run: bash run-tests.sh
      - name: Build standalone debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Check no sensitive Android permissions
        run: |
          manifest=app/src/main/AndroidManifest.xml
          if grep -E 'uses-permission|BIND_ACCESSIBILITY_SERVICE|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|INTERNET' "$manifest"; then
            echo "Unexpected permission found" >&2; exit 1
          fi
      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-one-player-lab-debug-unsigned-for-research
          path: android/one-player-prototype/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
