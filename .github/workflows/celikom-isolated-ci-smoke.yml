name: CELIKOM isolated CI smoke (no secrets)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ci/celikom-runner-smoke-trigger.txt'

permissions:
  contents: read

concurrency:
  group: celikom-isolated-ci-smoke
  cancel-in-progress: false

jobs:
  sandbox-probe:
    name: Isolated runner smoke
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 5
    steps:
      - name: Verify sandbox without checkout or secrets
        shell: bash
        run: |
          set -euo pipefail
          test ! -S /var/run/docker.sock
          test ! -e /srv/celikom/migration
          test ! -e /var/lib/forgejo
          test ! -e /srv/celikom/data
          echo 'CELIKOM_SELF_HOSTED_SANDBOX_SMOKE_OK'

  extension-preflight:
    name: Extension build on FlokiNET
    runs-on: celikom-ci-smoke-only
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install extension workspace
        run: npm ci --no-audit --no-fund
      - name: Test and build extension
        run: |
          npm run test:extension
          npm run build:extension
      - name: Verify extension checksum
        run: cd extension/dist && sha256sum --check celikom-extension-*.zip.sha256
      - name: Upload isolated extension preflight ZIP
        uses: actions/upload-artifact@v4
        with:
          name: celikom-floki-extension-preflight-${{ github.sha }}
          path: |
            extension/dist/celikom-extension-*.zip
            extension/dist/celikom-extension-*.zip.sha256
          if-no-files-found: error
          retention-days: 3
