name: Upload cleanup inspection
on:
  push:
    branches: [feature/upload-auto-cleanup-20261121]
    paths: ['.github/workflows/upload-cleanup-20261121.yml', '.github/scripts/upload-cleanup/**', 'server/src/Application/*Normalizer*', 'server/src/Application/Mp3DecodeValidator.php', 'server/tests/mp3-cleanup*', 'extension/**', 'server/src/Application/UploadService.php', 'server/tests/uploads.php', 'scripts/test-mp3-cleanup.mjs', 'scripts/test-upload-cleanup-browser.mjs']
permissions:
  contents: read
  actions: read
concurrency:
  group: celikom-hostinger-private-test
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect current upload code without changing service
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: bash .github/scripts/upload-cleanup/inspect.sh
  decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        id: validator_restore
        continue-on-error: true
        with:
          name: mp3-validator
          path: dist/validator
          run-id: 44879795714
          github-token: ${{ github.token }}
      - name: Build isolated static MP3-only validator from pinned FFmpeg source
        if: steps.validator_restore.outcome != 'success'
        run: bash .github/scripts/upload-cleanup/build-decoder.sh
      - run: |
          chmod 700 dist/validator/mp3-validator
          sha256sum --check dist/validator/mp3-validator.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mp3-validator
          path: |
            dist/validator/mp3-validator
            dist/validator/mp3-validator.sha256
            dist/validator/LICENSE.LGPLv2.1
            dist/validator/source.tar.gz
  verify:
    needs: decoder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-mysql
          MYSQL_DATABASE: celikom_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-mysql"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: celikom_test
      DB_USER: root
      DB_PASSWORD: ci-disposable-mysql
      STORAGE_PATH: /tmp/celikom-cleanup-tests
      CELIKOM_API_BASE_URL: https://darkred-camel-588676.hostingersite.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo, mbstring, curl
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: mp3-validator
          path: decoder-artifact
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p server/tools
          cp decoder-artifact/mp3-validator server/tools/mp3-validator
          chmod 700 server/tools/mp3-validator
          npm ci
          npm run test:extension
          php -l server/src/Application/UploadService.php
          php -l server/src/Application/Mp3Normalizer.php
          php -l server/src/Application/Mp3DecodeValidator.php
          CLEANUP_RELEASE_FIXTURES=dist/upload-cleanup node scripts/test-mp3-cleanup.mjs
          REQUIRE_BROWSER_AUDIO=1 node scripts/test-upload-cleanup-browser.mjs
          php server/tests/uploads.php
          npm --prefix extension run validate
          npm run security
          npm run build:extension
          cp server/src/Application/{UploadService,Mp3Normalizer,Mp3DecodeValidator}.php dist/upload-cleanup/
          cp decoder-artifact/{mp3-validator,LICENSE.LGPLv2.1,source.tar.gz} dist/upload-cleanup/
          cp .github/scripts/upload-cleanup/{probe.php,smoke.php} dist/upload-cleanup/
          (cd dist/upload-cleanup && sha256sum *.php *.mp3 mp3-validator LICENSE.LGPLv2.1 source.tar.gz > payload.sha256)
          tar -czf dist/upload-cleanup.tar.gz -C dist/upload-cleanup .
      - uses: actions/upload-artifact@v4
        with:
          name: celikom-extension-0.4.78
          path: |
            extension/dist/celikom-extension-0.4.78.zip
            extension/dist/celikom-extension-0.4.78.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: upload-cleanup-server-payload
          path: dist/upload-cleanup.tar.gz
  deploy:
    needs: [verify, inspect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upload-cleanup-server-payload
          path: dist
      - name: Install upload-only delta with backup and automatic rollback
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: bash .github/scripts/upload-cleanup/deploy.sh
